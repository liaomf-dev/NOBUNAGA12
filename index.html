奪走居城‧浪岡城的父親一起投靠安東家。之後便改名為北畠右近，有著擔任使者重職前去遊說豐臣秀吉等的傑出事蹟。"],["遠藤盛胤",65,76,31,10,26,55,50,"武士","佛教","CBCCDDCCD","",1555,1605,1570,[100,0,0,0,0],"二階堂家臣。通稱但馬。於主家滅亡之際被捕，因而改仕伊達家。其人驍勇善戰，曾在關原會戰中背負松川菱之旗幟奮戰，受到敵我雙方的讚賞。"],["川島宗泰",69,71,22,65,16,57,49,"武士","佛教","CBCCDDCBC","",1567,1616,1582,[100,0,0,0,0],"二階堂家臣。於主家滅亡後改仕伊達家。據說他在葛西‧大崎一揆之際，雖然遍體鱗傷仍不肯撤退。之後便負責仙台城以及江戶城外壕的修建工作。"],["保土原行藤",24,22,67,37,14,65,82,"武士","佛教","DCDDBDCCC","",1538,1620,1553,[0,0,0,0,100],"二階堂家臣。保土原家為二階堂家的分家。於伊達政宗攻打主家之際進行內應，之後改仕伊達家。不久便被提拔成為伊達家的一家。寫得一手好文章。"],["小田邊勝成",72,78,13,7,15,62,59,"武士","佛教","BABCDDCDD","",1560,1619,1575,[0,100,100,0,0],"二本松畠山家臣。擅長騎戰，有許多單槍匹馬攻破敵陣的事蹟，別名衝鋒大學。於主家滅亡後經歷浪人生活，最後侍奉伊達家，以武頭役一職獲得3百石俸祿。"],["黑澤道家",67,74,28,67,74,30,56,"武士","佛教","CBDDDCCCB","",1567,1623,1582,[0,0,0,0,0],"小野寺家臣。黑澤城主。於有屋嶺會戰等戰事中表現傑出。主家被貶後改仕佐竹家而參與鎮壓一揆以及開發新田。於大阪之陣時，從軍擔任團長一職表現傑出。"],["梅津憲忠",71,73,44,72,75,18,58,"武士","佛教","BBCBDBCCA","",1572,1630,1587,[100,100,0,0,0],"佐竹家臣。在大阪之陣中身負重傷仍繼續奮戰，因而有「佐竹的黃鬼」之名號。之後便成為家老，由於為人正明果斷，因此深受主君‧義宣的信賴。"],["岡本宣綱",22,12,65,73,28,18,66,"僧侶","佛教","CDBDBCCCB","",1583,1649,1598,[0,0,100,0,0],"佐竹家臣。顯逸之子。起初雖效仿祖輩剃髮出家，但之後就因主君‧義宣之命而還俗。其跟隨義宣移封秋田，在大阪之陣中也出征並立下了戰功。"],["須田盛久",47,32,72,53,29,17,81,"武士","佛教","CCDBBCDCC","",1586,1667,1601,[0,0,0,100,200],"宇都宮家臣。主家被貶後，透過姊夫‧小貫賴久的介紹而改屬佐竹家。後來於大阪冬之陣中立功，之後便成為家老。據說是位有見地且穩重之人。"],["長尾景廣",27,18,38,59,19,45,57,"武士","佛教","DCCDCCDDC","",1573,1630,1588,[0,0,0,0,0],"北條家臣。憲景的次男。主家滅亡後成為浪人，居於加賀。在關原會戰開始前前去侍奉上杉家。於大阪之陣中則是以旗本之將的身份出征，擔任先鋒。"],["大道寺直次",35,52,45,57,12,95,80,"武士","佛教","DDADDDCCB","",1571,1651,1586,[0,0,100,0,0],"北條家臣。政繁的四男。主家滅亡後以遠山長右衛門為名，侍奉於福島家。也參與關原會戰。福島家被貶後便改仕德川家，並恢復舊姓。"],["中山照守",74,67,15,10,31,88,64,"武士","佛教","CSDDDCDDD","",1570,1634,1585,[0,400,0,0,0],"北條家臣。家範之子。主家滅亡後改仕德川家康。在關原會戰及大阪之陣從軍，之後便成為槍奉行。為馬術的專家，精通高麗八條流的奧義。"],["塙安友",9,28,58,56,21,7,73,"武士","佛教","DDDBDDDDB","",1556,1629,1571,[0,0,0,100,0],"織田家臣。直政之子。本能寺之變後歷經佐佐家，最後仕於豐臣秀次。秀次死後成為浪人，於關原會戰中隸屬東軍。並在戰後於江戶成為小兒科的醫師。"],["前田利政",62,46,33,55,33,4,55,"武士","佛教","CCCCBDBBC","",1578,1633,1593,[0,0,0,0,100],"利家的次男。迎娶蒲生氏鄉的女兒。領有能登21萬石。由於在關原會戰中隸屬西軍，因此被貶。之後隱居於京，於大阪之陣中保持中立。"],["生駒一正",49,32,61,60,34,3,55,"武士","佛教","DCDCBBBBB","",1555,1610,1570,[0,0,0,0,100],"豐臣家臣。親正之子。於攻打雜賀等戰事中表現傑出。派兵朝鮮之際，渡海參加蔚山城等戰事。於關原會戰中隸屬東軍，戰後成為讚岐高松城主。"],["上田重安",48,27,19,64,35,5,87,"武士","佛教","DDDDCCDBB","",1563,1650,1578,[0,0,0,0,0],"豐臣家臣。參加九州征伐、小田原征伐等戰事。於關原會戰中隸屬西軍，戰後遂被貶。之後便侍奉淺野家，曾於大阪之陣出陣。同時也是著名的茶人。"],["桑山重晴",39,43,48,52,36,10,82,"武士","佛教","DCBCCDCCB","",1524,1606,1539,[0,0,100,0,0],"豐臣家臣。於賤岳會戰中擔任防守豐臣軍本陣，對勝利有極大的貢獻。之後便侍奉豐臣秀長，成為和歌山城城代並領有3萬石。曾向千利休學習茶道。"],["關盛吉",52,37,29,42,11,97,64,"武士","佛教","DCDDDCCCC","",1559,1623,1574,[0,0,0,0,0],"柴田家臣。盛信之子。主君‧勝豐死後改仕蒲生氏鄉，在九州征伐等戰役中相當活躍。後來於主家內鬥之際出奔，改仕兄長一政。一政被貶後投靠土井利勝。"],["田丸直昌",28,54,11,44,32,4,56,"武士","佛教","CCBDDDCBC","",1551,1607,1566,[0,0,0,0,0],"蒲生家臣。田丸城主。迎娶了主君‧氏鄉的妹妹。之後便獲得美濃岩村4萬石。由於在關原會戰中隸屬西軍，而被貶並放逐到越後，但不久後就被赦免。"],["小笠原秀政",64,75,48,69,76,93,46,"武士","佛教","DSSDDDDDD","",1569,1615,1584,[0,100,400,0,0],"德川家臣。貞慶的嫡男。於石川康長被貶後，獲舊領的信濃松本6萬石俸祿。最後於大阪夏之陣中戰死沙場。據說其向主君家康留下「信濃…」一句話就斷氣了。"],["木曾義利",28,16,7,21,10,79,63,"武士","佛教","DCDDDDDDD","",1577,1640,1592,[0,0,0,0,0],"德川家臣。義昌的嫡男。於父親死後繼承家督。其行為非常粗暴，因為犯了殺害叔父‧義豐之罪而被貶。之後就在京都剃髮出家，流浪各國。"],["千村良重",61,36,55,24,38,85,64,"武士","佛教","DBCBDBDCD","",1566,1630,1581,[0,0,0,0,0],"木曾家臣。主家被貶後，於關原會戰之際被德川家康延攬成為家臣。負責德川秀忠軍的前導一職，並有守護木曾、討伐西軍的石川貞清等傑出事蹟。"],["宮部長房",21,13,22,36,1,7,53,"僧侶","佛教","DDDDBBBDD","",1581,1634,1596,[0,0,0,0,0],"豐臣家臣。因幡鳥取城主。繼潤之子。曾參與派兵朝鮮等戰事。在關原會戰中雖一時隸屬東軍，但因其後倒戈西軍，並攻擊伏見城，因此戰後被貶。"],["新庄直賴",52,67,44,52,58,5,74,"武士","佛教","CCDDDBBDC","",1538,1612,1553,[0,0,0,0,0],"豐臣家臣。擔任高槻城主。雖於關原會戰中隸屬西軍，佔領伊賀上野城，但戰後被貶並交由蒲生秀行看管。之後領有常陸麻生3萬石。"],["新庄直忠",46,65,38,68,59,10,78,"武士","佛教","CCDDDBBDC","",1542,1620,1557,[0,0,0,0,0],"豐臣家臣。擔任豐臣家直領代官。曾於派兵朝鮮時渡海且表現傑出。關原會戰後於近江獲得些許俸祿。與兄長‧直賴同為文武雙才，被評為是深得人心的武士。"],["小川祐忠",28,36,61,32,3,77,54,"武士","佛教","CDDCBDCDC","",1547,1601,1562,[0,0,0,0,100],"近江的豪族。隸屬於明智光秀。光秀死後曾擔任柴田勝豐的家老，之後又侍奉豐臣秀吉，領有伊予府中7萬石。後雖於關原會戰中倒戈東軍，但戰後被貶。"],["京極高知",52,53,49,56,24,45,50,"高家","基督教","DCDBCCDBB","",1572,1622,1587,[0,0,0,100,0],"豐臣家臣。高吉的次男。領有信濃飯田10萬石，並竭盡心力在整頓城下町上。於關原會戰中隸屬東軍，戰後，說服逃到高野山的兄長前往德川家仕官。"],["松井康之",63,55,60,67,71,55,62,"武士","佛教","CCCBBCACB","",1550,1612,1565,[0,0,0,100,200],"足利家臣。於主君‧義輝橫死後改仕細川藤孝，在丹後平定戰等戰事中表現傑出。於關原會戰中隸屬東軍，領有豐後杵築2萬6千石。同時也是著名的茶人。"],["筒井定慶",7,23,22,45,18,5,49,"僧侶","佛教","DDDDDDDDD","",1566,1615,1581,[0,0,0,0,0],"豐臣家臣。福須美順弘之子。後來成為叔父‧順慶的養子。表哥‧定次被貶後便繼承家督。於大阪夏之陣中被城方攻陷居城而逃亡，不久後便自戕。"],["松倉重政",52,33,3,15,6,8,59,"武士","佛教","CBCCCCCSD","",1571,1630,1586,[0,100,0,0,0],"筒井家臣。重信之子。主家被貶後便改屬德川家。雖於大阪之陣後成為肥前島原城主，但因實行重稅及鎮壓基督徒等惡政，而種下島原之亂的禍根。"],["南條元忠",36,43,24,22,5,85,44,"武士","佛教","DCCDBDCCD","",1570,1614,1585,[0,0,0,0,0],"南條家第九代當主。羽衣石城主。元續的嫡男。因於關原會戰中隸屬西軍而被貶。雖於不久後改屬豐臣秀賴，但於大阪冬之陣時被懷疑內通德川軍而遭殺害。"],["南條元清",54,49,48,56,43,99,54,"武士","佛教","CCCDCBCCD","",1551,1605,1566,[0,0,0,0,0],"南條家臣。南條宗勝的庶子。繼承東伯耆的名門‧小鴨家。在派兵朝鮮之際，因遭外甥‧元忠的讒言而失去地位，轉屬小西行長。關原會戰後改仕加藤清正。"],["石野氏滿",57,76,56,32,44,68,53,"武士","佛教","DDCACDDCD","",1553,1606,1568,[0,0,0,400,0],"別所家臣。有著和主君‧長治一起固守三木城與羽柴秀吉交戰，殺死羽柴家臣‧古田重則等的傑出事蹟。長治死後便改屬秀吉。之後又改仕前田利家。"],["有馬則賴",32,25,48,63,46,5,69,"武士","佛教","CCCBCBCBC","",1533,1602,1548,[0,0,100,0,0],"播磨的豪族。重則之子。侍奉豐臣秀吉，參與九州征伐及派兵朝鮮等戰事。秀吉死後改仕德川家康，參與關原會戰，並於戰後獲得攝津三田3萬石領地。"],["有馬豐氏",55,37,54,59,45,95,73,"武士","佛教","CBCBCBCBB","",1569,1642,1584,[0,0,100,0,0],"豐臣家臣。則賴的嫡男。秀吉死後轉屬德川家康，於關原會戰、大阪兩陣中立下戰功，領有筑後久留米21萬石。在鎮壓島原之亂的行動中也立下功勞。"],["赤松則英",39,32,31,44,13,78,29,"高家","佛教","DDCCCDCCD","",1571,1600,1586,[0,0,0,0,0],"豐臣家臣。則房之子。其父死後，繼承阿波住吉1萬石領地。於關原會戰中隸屬西軍，固守近江佐和山城。雖在城被攻陷前逃出，但戰後自戕於京都。"],["赤松廣秀",58,35,28,65,4,79,38,"高家","佛教","DDCCBDDCC","",1562,1600,1577,[0,0,0,0,100],"豐臣家臣。赤松政秀之子。於藤原惺窩處學習漢學。雖在關原會戰中自西軍倒戈向東軍，但因縱火燒了因幡鳥取城下，因此被德川家康命其自盡謝罪。"],["福原長堯",55,47,58,71,78,22,49,"武士","佛教","CDCBBBBCB","",1551,1600,1566,[0,0,0,100,0],"豐臣家臣。則尚之弟。石田三成的妹婿。曾於派兵朝鮮時擔任奉行渡海遠征。在關原會戰時隸屬西軍，防守大垣城。最後在主力敗北後開城投降，並自戕身亡。"],["長船定行",36,21,59,45,37,10,40,"武士","佛教","BCBBDDBDC","",1560,1600,1575,[100,0,100,0,0],"宇喜多家臣。貞親之子。在兄長‧綱直死後繼承家督。為家中屈指可數的高位者，掌管2萬4千石領地。後來跟隨主君‧秀家出陣關原會戰，戰後便失去行蹤。"],["毛利元康",62,53,52,56,47,33,41,"武士","佛教","CDACCBBCD","",1560,1601,1575,[0,0,400,0,0],"毛利元就的八男。以出雲末次城為居城，並以末次為姓。後來獲得備後神邊1萬5千石領地。在關原會戰中隸屬西軍，指揮對近江大津城的攻擊。"],["毛利秀包",71,58,63,57,77,31,35,"武士","基督教","BCABBAABC","",1567,1602,1582,[100,0,400,100,0],"毛利元就的九男。後來成為兄長‧隆景的養子。備受豐臣秀吉寵愛，並獲得賜名。於派兵朝鮮時因拯救隆景而表現活躍。但在關原會戰中隸屬西軍而被貶。"],["宍戶元續",49,44,43,65,72,37,68,"武士","佛教","CCBCCBBBC","",1563,1631,1578,[0,0,100,0,0],"毛利家臣。隆家之孫，曾擔任頭號家老。於豐臣秀吉派兵朝鮮之際渡海奮戰。在關原會戰後便跟隨主家移往荻，並負責荻城的修建工事。"],["福原廣俊",48,24,78,76,41,31,56,"武士","佛教","DDDDBBBBB","",1567,1623,1582,[0,0,0,0,100],"毛利家臣。貞俊之孫。於派兵朝鮮之際從軍。在關原會戰後跟隨主家移往荻，並和吉川廣家一同盡心盡力為荻藩奠定根基。曾擔任江戶城等的修繕奉行。"],["仁木義治",14,8,32,70,30,50,88,"武士","佛教","DDDDCDBDB","",1565,1653,1580,[0,0,0,0,0],"細川家臣。居住於勝瑞城下。雖在勝瑞城被攻陷後隱居，但不久後就被蜂須賀家政延攬，之後便以商人的身份侍奉家政。後著有「昔阿波物語」一書。"],["吉田政重",70,82,41,12,79,77,60,"武士","佛教","BCDBBCBDD","",1568,1628,1583,[100,0,0,100,0],"長宗我部家臣。據說是曾取下115個敵將的首級，並在朝鮮驅除猛虎的猛將。在大阪之陣時跟隨舊主‧盛親奮戰。大阪城被攻陷後則返回土佐成為醫師。"],["佐竹親直",47,63,53,43,80,80,49,"武士","佛教","CBBCCCBCD","",1566,1615,1581,[0,100,100,0,0],"長宗我部家臣。上之加江城主。於其父‧義秀戰死後繼承家督。迎娶了長宗我部元親的女兒。在大阪之陣時跟隨舊主‧盛親奮戰，於夏之陣中戰死沙場。"],["秋月種長",46,25,57,53,7,34,47,"武士","佛教","DCCCBDBBD","",1567,1614,1582,[0,0,0,0,0],"筑前的豪族。古處山城主。種實的長男。因降於豐臣秀吉的九州征伐軍，而被轉封日向高鍋3萬石。後來於關原會戰中倒戈東軍，並在戰後確保了領土。"],["種子島久時",61,45,52,57,42,22,43,"武士","佛教","CCBSDBBCC","",1568,1611,1583,[0,0,0,400,0],"島津家臣。種子島的領主。時堯的次男。由於兄長‧時次早逝，因此在主君‧義久的加冠下完成元服，繼承家督。率領鐵砲隊在各地表現活躍，因而聲名大噪。"],["赤座吉家",43,22,38,36,2,3,43,"武士","佛教","DDDCBCDDC","",1563,1606,1578,[0,0,0,0,0],"豐臣家臣。雖在關原會戰中隸屬西軍，卻與朽木元綱一起倒戈於東軍。由於戰後被貶，因此前去侍奉加賀前田家，最後卻在河水暴漲的越中國大門川溺斃。"],["足立重信",62,24,63,89,70,5,62,"武士","佛教","DCCBCDBAS","",1563,1625,1578,[0,0,0,0,0],"加藤家臣。於關原會戰中擔當主君‧嘉明的居城‧伊予松前城之留守一職，並順利擊退毛利軍，因而成為家老。擅於河川工事，在領內力行灌溉和防洪。"],["石田重家",23,7,42,67,48,20,102,"庶民","佛教","DDDDCCCBA","",1584,1686,1599,[0,0,0,0,0],"三成之子。於關原會戰中作為人質留在大阪城內。於戰後進入京都壽聖院，剃髮出家。後因壽聖院住持求情，才免於一死。之後成為壽聖院的三世住持。"],["太田一吉",46,32,37,43,49,7,51,"武士","佛教","DDCCCDCCC","",1566,1617,1581,[0,0,0,0,0],"丹羽家臣。於主家沒落後改仕豐臣秀吉。在關原會戰中隸屬西軍並固守居城‧豐後臼杵城奮戰，但因主力敗北而開城投降。之後隱居京都。"],["大谷義治",64,47,58,57,85,20,35,"武士","佛教","BBBBCCCCD","",1580,1615,1595,[100,0,0,0,0],"豐臣家臣。吉繼之長男。在關原會戰中與其父同屬西軍作戰。雖在戰後成為浪人，但後來被豐臣秀賴延攬進入大阪城。最後戰死於天王寺口之戰中。"],["大野治房",62,44,39,52,69,21,43,"武士","佛教","BBCCBDDDC","",1572,1615,1587,[100,0,0,0,0],"豐臣家臣。冶長之弟。在大阪之陣時，成為主戰派的中心人物之一。大阪城被攻陷後，雖然抱著國松丸（主君‧秀賴之子）逃出，但最後還是被捕而遭斬首。"],["大野治胤",58,35,27,48,68,21,41,"武士","佛教","CBCCBDDDC","",1574,1615,1589,[0,100,0,0,0],"豐臣家臣。治長之弟。自稱道犬齋。於大阪夏之陣時縱火燒界。大阪城被攻陷時，企圖逃脫，但終究被捕而被斬首於界。"],["奧村長福",67,56,53,55,81,4,82,"武士","佛教","BBBCBCCBD","",1542,1624,1557,[100,100,0,0,0],"前田家臣。能登末森城主。曾僅以三百名士兵擊退佐佐成政率領的一萬五千大軍。此時，也留下了長福之妻為激勵城兵而四處奔波的軼聞。"],["金森可重",47,27,55,62,50,92,57,"武士","佛教","CBBBCBDBB","",1558,1615,1573,[0,0,0,0,0],"織田家臣。長屋景重之子，後來成為長近的養子。於養父死後繼承家督。於大阪之陣參陣，並立下戰功。同養父一樣喜愛茶道，並在茶會記中留名。"],["上泉泰綱",27,89,19,11,83,10,48,"劍豪","佛教","BDDDDCDDD","混戰",1552,1600,1567,[100,0,0,0,0],"新陰流的創始者‧上泉信綱之孫。在關原會戰開始前，應徵上杉景勝的浪人招募，而隸屬於直江兼續的麾下。最後在與出羽長谷堂城的最上軍交戰中戰死。"],["郡宗保",54,64,47,57,82,10,69,"武士","佛教","BBDCCBCCC","",1546,1615,1561,[0,100,0,0,0],"豐臣家臣。曾擔任馬迴。於關原會戰中隸屬西軍而參加攻擊大津城的戰役。並以主君‧秀賴之貼身侍衛的身份，負責與各大名交涉。大阪城陷落時追隨秀賴而死。"],["小西行景",62,47,55,61,67,20,31,"商人","基督教","DDCBCCABC","",1569,1600,1584,[0,0,0,100,0],"豐臣家臣。行長的外甥。皈依基督教。在關原會戰中，雖為防守行長的居城‧肥後宇土城而和加藤清正軍奮戰，但聽聞西軍戰敗後就開城投降，並自戕身亡。"],["吉弘統增",63,78,53,56,73,84,45,"武士","佛教","BBCCCABBC","",1572,1617,1587,[100,100,0,0,0],"大友家臣。高橋紹運之子。於九州征伐後改屬豐臣家。在關原會戰中和兄長‧宗茂一同隸屬西軍，但在戰後被貶。在大阪之陣時則加入德川軍參戰。"],["德川家光",52,65,73,81,51,88,47,"武士","佛教","BBCBABDAA","",1604,1651,1619,[100,0,0,0,200],"德川幕府第三代將軍。秀忠的次男。確立了參勤交代制、改定武家諸法度、實施鎖國政策等，謀求幕府的安定，被後人稱為「寬永之治」。"],["速水守久",59,59,56,62,84,10,56,"武士","佛教","BBBCCCCCC","",1559,1615,1574,[100,0,0,0,0],"豐臣家臣。以近習組頭身份參加了小牧長久手會戰及小田原征伐。秀吉死後改仕秀賴，並成為七手組頭之一。最後於夏之陣時，追隨秀賴自戕而死。"],["福島高晴",64,68,34,35,9,97,60,"庶民","佛教","BCBCCBBCC","",1573,1633,1588,[100,0,0,0,0],"豐臣家臣。正則之弟。於關原會戰中隸屬東軍，進攻伊勢桑名城，並於戰後獲得大和松山3萬石領地。在大阪之陣時，因被懷疑和豐臣軍內通而被貶。"],["前田利常",61,37,77,83,66,92,65,"武士","佛教","BCCBACBBA","",1593,1658,1608,[100,0,0,100,0],"加賀金澤藩主。利家的四男。繼承兄長‧利長之位。於大阪之陣參戰並立下戰功。為了藩的存亡而努力不懈，據說曾為了瞞過江戶幕府的警戒還故意裝得愚笨。"],["水野勝成",67,72,67,32,65,98,87,"武士","佛教","CBBCDCCCB","",1564,1651,1579,[0,100,100,0,0],"德川家臣。曾參與進攻遠江高天神城等許多會戰。曾一時侍奉豐臣秀吉等人，但不久便回頭再仕舊主，領有備中福山10萬石。也曾參陣島原之亂。"],["脅阪安元",53,62,70,67,52,97,69,"武士","佛教","CDDCDCBBB","",1584,1653,1599,[0,0,0,0,0],"德川家臣。安治之子。於其父死後繼承伊予大洲5萬3千石。不久後被轉封信濃飯田5萬5千石。至其子孫輩時，已成為領有播磨龍野5萬3千石，直至明治維新。"],["村井長賴",63,65,53,55,64,0,62,"武士","佛教","BBBCDCCBC","",1543,1605,1558,[100,0,0,0,0],"前田家臣。因為進攻伊勢立下戰功，因此從利家受賜「又」一字，自稱又兵衛。和奧村長福同為前田家重鎮。同時擔任金澤奉行一職，領有1萬石。"],["由布惟信",75,63,67,65,87,84,85,"武士","佛教","ABBCBBCCB","",1527,1612,1542,[100,0,0,0,0],"立花家臣。從道雪之名取號「雪下」。據說是位參加了六十五次以上會戰的猛將。即使在主家因關原會戰而被貶後，仍執意前往輔佐宗茂，致力於立花家的復興。"],["小野鎮幸",72,75,58,44,86,84,66,"武士","佛教","ABBBCBCCC","",1543,1609,1558,[100,0,0,0,0],"立花家臣。通稱和泉。與由布惟信同為立花家的兩大支柱。於朝鮮出兵時更是讓其英名大噪。在主家因關原會戰而被貶後，便改仕加藤清正。"],["飯田直景",57,76,52,54,63,99,71,"武士","佛教","BBBCCSCSD","",1561,1632,1576,[0,0,0,0,0],"豐臣家臣。通稱覺兵衛。為加藤清正旗下的侍大將。於朝鮮出兵時建造龜甲車，並投入於晉州城攻略戰中。精通土木技術，並參與了熊本城的建築工程。"],["柳生宗章",62,91,25,17,88,91,37,"劍豪","佛教","ADBDDDDDD","混戰",1566,1603,1581,[400,0,0,0,0],"宗嚴的四男。中村家家老‧橫田村詮的客將。在村詮因讒言而被誅殺後，與遺臣一同反抗中村一忠。大風雪中，雖奮戰斬殺了18人，但終究還是戰死。"],["柳生三嚴",64,97,32,12,62,91,43,"劍豪","佛教","ADBDDDDDD","混戰",1607,1650,1622,[100,0,0,0,0],"德川家臣。宗矩之子。通稱‧十兵衛。由於幼小時的意外而導致單眼失明。雖為德川家光的劍術指南役，但因觸怒家光而被迫停止出仕。之後流浪諸國專心於修行。"],["赤池長任",74,85,67,33,61,50,39,"武士","佛教","AABBADDCC","",1529,1568,1544,[100,100,0,0,200],"相良家臣。曾鎮守位於與薩摩之國境處的大口城。從武的家臣甚多，數度擊退島津家的攻勢，將島津義弘逼至窘境，並打敗川上久朗。"],["和久宗是",15,32,57,65,89,15,80,"武士","佛教","CCCDDDDCB","",1535,1615,1550,[0,0,0,0,0],"豐臣家臣。進攻小田原時曾說服伊達政宗參戰。秀吉逝世後，仕於伊達家，但大阪之戰開始後即返回豐臣家。以白裝束衝入敵陣而戰死。"],["東鄉重位",39,93,23,16,60,30,82,"劍豪","佛教","ADBDDDDDD","",1561,1643,1576,[400,0,0,0,0],"島津家臣。追隨島津義久上洛時，自天寧寺的善吉和尚處學習劍術，創立薩摩自顯流（示現流）。之後成為島津家久的劍術指南役。"],["安井成安",23,38,43,82,90,10,82,"商人","佛教","CDDDDBCAS","",1533,1615,1548,[0,0,0,0,0],"大阪的工匠。剃髮自稱道頓。曾投資私財整備水路，但於大阪之役以豐臣方參戰而戰死。之後完成的堀，被命名為道頓堀。"],["山田長政",68,67,42,37,54,35,40,"庶民","佛教","BBDBDBACC","",1590,1630,1605,[100,0,0,400,0],"暹羅（現在的泰國）的日本人町頭領。因獲得阿猶他亞國王‧嵩坦的信任而活躍。國王死後，被捲入政治鬥爭，最後被人在傷口上塗毒而身死。"],["天草時貞",75,26,76,71,57,40,17,"武士","基督教","ACSABACAB","",1621,1638,1636,[100,0,400,400,0],"肥後的天主教徒。人稱‧四郎。指揮苦於苛稅的農民與幕府軍對抗。一揆軍雖奮戰一時，但因軍糧被斷而遭受總攻擊，最後全軍連同時貞皆被殲滅。"],["伊東祐益",6,2,74,65,56,82,43,"武士","基督教","DDDBDAADC","",1569,1612,1584,[0,0,0,0,0],"伊東義祐之孫，天主教徒。洗禮名為滿所。為大友宗麟之遠戚，並為宗麟之遣歐使節正使。拜謁教皇及西班牙國王後，歸國成為司祭。"],["三浦按針",43,62,81,68,55,85,56,"庶民","基督教","DDCADASBC","",1564,1620,1600,[0,0,0,400,0],"德川家外交顧問。為英國人，本名威廉‧亞當斯。本為漂流至豐後的南蠻船之航海士，後奉家康之命而仕於德川家，並被授與日本名‧按針。"],["猿飛佐助",33,87,72,4,100,60,30,"忍者","佛教","BCSDSCDDD","火牛計",1588,1618,1603,[0,0,100,0,400],"真田十勇士。在信濃山中與猴群玩耍時被甲賀忍者的戶澤白雲齋相中而成為忍者。之後仕於真田幸村，巡迴諸國收集情報。"],["霧隱才藏",39,86,76,8,91,63,34,"忍者","佛教","BCSDSCDDD","",1584,1618,1599,[0,0,0,0,600],"真田十勇士。於伊賀忍者百地三太夫之處學習忍術。曾與甲賀流的猿飛佐助比試忍術，也因此機緣仕於真田幸村。大阪夏之陣時，欲奪取德川家康之性命。"],["穴山小助",78,72,82,26,99,58,51,"武士","佛教","BADBBCDDD","",1567,1618,1582,[0,100,0,0,0],"真田十勇士。武田家滅亡後跟隨曾為武田家臣之父而仕於真田幸村。由於容貌酷似幸村，因而成為幸村之影武者，於大阪夏之陣戰死。"],["海野六郎",72,65,88,52,92,59,42,"武士","佛教","BBABACDDD","",1576,1618,1591,[0,0,400,0,200],"真田十勇士。為真田家本家‧滋野三家出身，幼小時即仕於真田幸村。不僅為十勇士中的最老將，頭腦也精明，遂為幸村之得力參謀。"],["望月六郎",59,66,72,32,98,59,38,"武士","佛教","CCCACSBDD","",1580,1618,1595,[0,0,0,100,0],"真田十勇士。為真田家本家‧滋野三家出身。關原會戰後，追隨被迫蟄居的真田幸村進入九度山。擅於操使大筒，於大阪夏之陣時曾砲擊德川家康。"],["筧十藏",62,81,85,53,93,62,37,"武士","佛教","BCCSCCDDD","",1581,1618,1596,[0,0,0,400,0],"真田十勇士。本為蜂須賀家家臣，但因遇上真田幸村而志願成為幸村家臣。為種子島鎗名手，於大阪夏之陣中非常活躍，但之後生死不明。"],["根津甚八",75,76,48,47,97,59,45,"海賊","佛教","BDBACCSDD","",1573,1618,1588,[0,0,0,100,0],"真田十勇士。為真田家本家‧滋野三家出身。本為海賊。大阪夏之陣時，與穴山小助同為幸村之影武者而擾亂德川軍，最後戰死沙場。"],["由利鎌之助",57,87,57,38,94,58,35,"劍豪","佛教","ASBCCCDDD","",1583,1618,1598,[100,100,0,0,0],"真田十勇士。為鎖鎌名手。本與三好伊三同為鈴鹿山中之山賊，後因三好清海的勸誘而成為真田幸村之家臣。也有三河野田城的武將之說。"],["三好清海",63,85,53,49,96,60,90,"武士","佛教","SABCDCDDD","",1528,1618,1543,[400,0,0,0,0],"真田十勇士。本為出羽龜田的領主，在龜田城陷後便投靠真田幸村。其身高超過六尺，以巨大的鐵棒為武器。於大阪夏之陣中奮戰，最後舉刀自刃。"],["三好伊三",57,83,43,47,95,60,82,"武士","佛教","SABDDCDDD","",1536,1618,1551,[400,0,0,0,0],"真田十勇士。清海之弟。因遇上由利鎌之助而成為山賊，之後因其兄的勸說而仕於真田家。是一位不遜於其兄的豪傑，於大阪夏之陣中，邊切腹邊詠辭世詩。"],["加藤段藏",46,79,92,12,8,37,66,"忍者","佛教","CDSCSBDDD","",1503,1569,1518,[0,0,400,0,400],"有「飛加藤」之異名的傑出忍者。仕於上杉謙信，但卻因謙信懼於其能力而被迫逃出越後。之後所仕的武田信玄也欲取其性命，最後於廁中被暗殺身亡"]];
// row: 0姓名 1統率 2武勇 3知略 4政治 5義理 6相性 7壽命 8出身 9信仰 10適性字串 11戰法 12生年 13卒年 14登場年 15熟練[5] 16列傳
DATA.forEach(r=>{ r.t=r[1]+r[2]+r[3]; r.t4=r.t+r[4]; });
const APT=['足輕','騎馬','弓箭','鐵砲','計略','兵器','水軍','築城','內政'];
const GR={S:5,A:4,B:3,C:2,D:1};
// [label, getter, type, desc-first, extra class]
const COLS=[
  ['姓名',r=>r[0],'name',false],
  ['統率',r=>r[1],'stat',true,'grp'],['武勇',r=>r[2],'stat',true],['知略',r=>r[3],'stat',true],['政治',r=>r[4],'stat',true],
  ['統武智',r=>r.t,'total',true,'key'],['統武智政',r=>r.t4,'total',true,'key'],
  ['義理',r=>r[5],'n',true,'grp'],['相性',r=>r[6],'n',false],['壽命',r=>r[7],'n',true],
  ['出身',r=>r[8],'txt',false,'grp'],['信仰',r=>r[9],'txt',false],
  ...APT.map((a,i)=>[a,r=>GR[r[10][i]],'g',true,i===0?'grp':'',i]),
  ['固有戰法',r=>r[11],'sp',false,'grp']
];
let sortIdx=COLS.findIndex(c=>c[0]==='統武智'), dir=-1;
const open=new Set();
const $=id=>document.getElementById(id);
const head=$('head'), body=$('body');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fill(sel,vals){vals.forEach(([v,label])=>{const o=document.createElement('option');o.value=v;o.textContent=label;sel.appendChild(o);});}
function freq(i){const f={};DATA.forEach(r=>{if(r[i])f[r[i]]=(f[r[i]]||0)+1;});return Object.keys(f).sort((a,b)=>f[b]-f[a]).map(k=>[k,`${k}（${f[k]}）`]);}
fill($('origin'),freq(8));
fill($('sp'),freq(11));
fill($('apt'),APT.map((a,i)=>[i,`${a} S`]));

COLS.forEach((c,ci)=>{
  const th=document.createElement('th');
  th.tabIndex=0;
  th.className=[c[2]==='name'?'name':'',c[4]||''].join(' ').trim();
  th.innerHTML=`${c[0]}<span class="arr"></span>`;
  th.onclick=()=>setSort(ci);
  th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSort(ci);}};
  head.appendChild(th);
});

function setSort(ci){
  if(sortIdx===ci) dir=-dir; else { sortIdx=ci; dir=COLS[ci][3]?-1:1; }
  render();
}

function cell(c,r){
  const v=c[1](r), cls=c[4]&&c[4]!=='key'?' '+c[4]:'';
  switch(c[2]){
    case 'name': return `<td class="name"><button type="button" data-n="${DATA.indexOf(r)}" aria-expanded="${open.has(r)}">${esc(v)}</button></td>`;
    case 'stat': return `<td class="stat${v>=90?' hi':''}${cls}"><i style="width:calc((100% - 8px)*${Math.min(v,120)/120})"></i><span>${v}</span></td>`;
    case 'total': return `<td class="total${cls}">${v}</td>`;
    case 'n': return `<td class="n${cls}">${v}</td>`;
    case 'txt': return `<td class="txt${cls}">${esc(v)}</td>`;
    case 'sp': return v?`<td class="sp${cls}">${esc(v)}</td>`:`<td class="none${cls}">—</td>`;
    case 'g': {const gr=r[10][c[5]];return `<td class="${cls.trim()}"><span class="g g${gr}">${gr}</span></td>`;}
  }
}

function detail(r){
  const jk=['足輕','騎馬','弓箭','鐵砲','計略'].map((a,i)=>`<span>${a}熟練 <b>${r[15][i]}</b></span>`).join('');
  const yr=[['生年',r[12]],['卒年',r[13]],['登場年',r[14]]].map(([a,v])=>`<span>${a} <b>${v}</b> 年</span>`).join('');
  return `<tr class="detail"><td colspan="${COLS.length}"><div class="det"><p>${esc(r[16])}</p><div class="meta">${yr}</div><div class="meta">${jk}</div></div></td></tr>`;
}

function render(){
  const q=$('q').value.trim(), og=$('origin').value, sp=$('sp').value, ap=$('apt').value;
  let rows=DATA.filter(r=>(!q||r[0].includes(q)||r[16].includes(q))&&(!og||r[8]===og)&&(!sp||(sp==='*'?!!r[11]:r[11]===sp))&&(ap===''||r[10][+ap]==='S'));
  const get=COLS[sortIdx][1];
  rows.sort((a,b)=>{
    const x=get(a), y=get(b); let d;
    if(typeof x==='string'){ if(!x&&y) return 1; if(x&&!y) return -1; d=x.localeCompare(y,'zh-Hant'); }
    else d=x-y;
    return d*dir || (b.t-a.t);
  });
  [...head.children].forEach((th,ci)=>{
    const on=ci===sortIdx;
    th.classList.toggle('on',on);
    th.querySelector('.arr').textContent=on?(dir<0?'▼':'▲'):'';
    th.setAttribute('aria-sort',on?(dir<0?'descending':'ascending'):'none');
  });
  $('shown').textContent=rows.length;
  if(!rows.length){body.innerHTML=`<tr><td class="empty" colspan="${COLS.length}">沒有符合條件的武將，試試其他關鍵字或按「重設」。</td></tr>`;return;}
  body.innerHTML=rows.map(r=>`<tr${open.has(r)?' class="open"':''}>${COLS.map(c=>cell(c,r)).join('')}</tr>${open.has(r)?detail(r):''}`).join('');
}

body.addEventListener('click',e=>{
  const b=e.target.closest('button[data-n]'); if(!b) return;
  const r=DATA[+b.dataset.n];
  open.has(r)?open.delete(r):open.add(r);
  render();
});

let t; $('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,150);});
['origin','sp','apt'].forEach(id=>$(id).onchange=render);
$('reset').onclick=()=>{['q','origin','sp','apt'].forEach(id=>$(id).value='');sortIdx=COLS.findIndex(c=>c[0]==='統武智');dir=-1;open.clear();render();};
render();
</script>
</body>
</html>
