<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信長之野望 革新 全武將能力表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: header + filter bar, then one sortable ledger table (sticky header, sticky name column); clicking a name opens that officer's 列傳 row */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --fg:#1b1f2a; --muted:#646b7c; --line:#dcdfe7;
  --accent:#27408b; --accent-soft:#e6eaf6; --gold:#9a6b12;
  --g-s:#b3261e; --g-s-bg:#fbe5e2; --g-a:#a35a00; --g-a-bg:#fcefd9; --g-b:#2a6a4a; --g-b-bg:#e1f1e8; --g-c:#4f5a75; --g-c-bg:#eceef4; --g-d:#9aa0ad;
  --bar:#d3dbef; --bar-hi:#27408b;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151c; --surface:#1a1d26; --fg:#e5e7ee; --muted:#9097a8; --line:#2b303d;
  --accent:#8fa8f0; --accent-soft:#232a40; --gold:#e0b65e;
  --g-s:#ff8a7e; --g-s-bg:#3d1f1c; --g-a:#f0b45e; --g-a-bg:#382a14; --g-b:#7fd3a6; --g-b-bg:#17332a; --g-c:#aab3cc; --g-c-bg:#262b38; --g-d:#5f6676;
  --bar:#273150; --bar-hi:#8fa8f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151c; --surface:#1a1d26; --fg:#e5e7ee; --muted:#9097a8; --line:#2b303d;
  --accent:#8fa8f0; --accent-soft:#232a40; --gold:#e0b65e;
  --g-s:#ff8a7e; --g-s-bg:#3d1f1c; --g-a:#f0b45e; --g-a-bg:#382a14; --g-b:#7fd3a6; --g-b-bg:#17332a; --g-c:#aab3cc; --g-c-bg:#262b38; --g-d:#5f6676;
  --bar:#273150; --bar-hi:#8fa8f0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
.wrap{max-width:1500px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.04em;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.02em;margin-top:4px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.count b{color:var(--fg);font-size:18px;font-family:var(--mono)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input,.controls select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.controls input{flex:1 1 220px}
.controls input:focus,.controls select:focus,button:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.reset{font:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--muted);cursor:pointer}
.reset:hover{color:var(--fg);border-color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.tablebox{overflow:auto;max-height:calc(100vh - 220px);min-height:360px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:center}
thead th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;user-select:none;border-bottom:2px solid var(--line)}
thead th:hover{color:var(--accent)}
thead th .arr{display:inline-block;width:1em;color:var(--accent);font-size:11px}
thead th.on{color:var(--accent);background:var(--accent-soft)}
thead th.key{color:var(--gold)}
thead th.key.on{color:var(--accent)}
.grp{border-left:1px solid var(--line)}
.name{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left}
thead th.name{z-index:3}
td.name button{all:unset;cursor:pointer;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
td.name button::after{content:"▸";font-size:10px;color:var(--muted);transition:transform .15s}
tr.open td.name button::after{transform:rotate(90deg);color:var(--accent)}
td.name button:hover{color:var(--accent)}
td.name button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
tbody tr:hover td{background:var(--accent-soft)}
td.stat{position:relative;font-family:var(--mono);font-size:13.5px;min-width:42px}
td.stat span{position:relative}
td.stat i{position:absolute;left:4px;bottom:3px;height:3px;border-radius:2px;background:var(--bar)}
td.stat.hi{font-weight:700;color:var(--accent)}
td.stat.hi i{background:var(--bar-hi)}
td.total{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--gold)}
td.n{font-family:var(--mono);font-size:13px;color:var(--muted)}
td.txt{font-size:13px}
td.none{color:var(--muted)}
td.sp{font-size:13px;font-weight:700;color:var(--accent)}
.g{display:inline-block;width:22px;line-height:20px;border-radius:4px;font-family:var(--mono);font-size:12px;font-weight:500}
.gS{color:var(--g-s);background:var(--g-s-bg);font-weight:700}
.gA{color:var(--g-a);background:var(--g-a-bg)}
.gB{color:var(--g-b);background:var(--g-b-bg)}
.gC{color:var(--g-c);background:var(--g-c-bg)}
.gD{color:var(--g-d)}
tr.detail td{background:var(--accent-soft);text-align:left;white-space:normal;padding:12px 14px 14px}
tr.detail:hover td{background:var(--accent-soft)}
.det{position:sticky;left:14px;max-width:min(760px,calc(100vw - 64px));display:flex;flex-direction:column;gap:8px;line-height:1.75}
.det p{margin:0;font-size:14px}
.det .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.det .meta b{color:var(--fg);font-family:var(--mono);font-weight:500}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{font-size:12px;color:var(--muted);line-height:1.7}
@media (max-width:560px){th,td{padding:6px 7px}td.name button{font-size:14px}}
@media (prefers-reduced-motion:reduce){td.name button::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>信長之野望 革新 全武將能力表<small>全 1100 名武將・點擊欄位標題排序・點擊姓名看列傳</small></h1>
    <div class="count">顯示 <b id="shown">0</b> 名</div>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="搜尋姓名或列傳，例如：真田、上杉" aria-label="搜尋姓名或列傳">
    <select id="origin" aria-label="依出身篩選"><option value="">全部出身</option></select>
    <select id="sp" aria-label="依固有戰法篩選"><option value="">全部戰法</option><option value="*">有固有戰法</option></select>
    <select id="apt" aria-label="依適性篩選"><option value="">全部適性</option></select>
    <button class="reset" id="reset" type="button">重設</button>
  </div>
  <div class="hint">第一次點擊由高到低，再點一次由低到高。能力值 ≥ 90 以粗體標示。統武智＝統率＋武勇＋知略，統武智政＝統率＋武勇＋知略＋政治。</div>

  <div class="tablebox">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <footer>適性等級 S ＞ A ＞ B ＞ C ＞ D。相性數值越接近越容易結交。生年、卒年、登場年與熟練度在點擊姓名後顯示。</footer>
</div>

<script>
const DATA = [["蠣崎季廣",66,49,70,79,52,35,88,"武士","佛教","CCDDBDBDA","",1507,1595,1522,[100,100,0,0,100],"蠣崎家第4代當主，義廣之子。與從祖代時代就持續對立的蝦夷人和解，制定了蝦夷商船往來的制度。由於此項政策而確立了蝦夷地區領主的地位。"],["蠣崎慶廣",70,50,72,84,31,35,67,"武士","佛教","CDBCCDBCA","",1549,1616,1564,[100,0,100,0,100],"蠣崎家第5代當主，季廣之子。與豐臣秀吉親近，獲得了蝦夷地區的交易權，成為了獨立領主。1599年向德川家康獻上了家譜，改姓松前。"],["蠣崎盛廣",52,34,28,70,72,34,37,"武士","佛教","DDDCDDCDB","",1571,1608,1586,[0,0,0,0,0],"蠣崎松前家第6代當主。慶廣之子。德川家康成為內大臣之際，曾隨同其父拜見德川家康。1600年，成為松前藩的第2代藩主，但是早於其父病故。"],["蠣崎守廣",41,35,50,62,55,32,71,"武士","佛教","DDDDDCCDC","",1564,1635,1579,[0,0,0,0,0],"松前藩家老。季廣的第十一子。為了要振興一族而成為家臣。宴請第4代藩主‧氏廣於自宅時，突然發生的火災，使其過於自責而跳入火中自殺。"],["近藤義武",61,41,63,60,68,33,69,"武士","佛教","DDDCDCDDC","",1569,1638,1584,[0,0,0,100,0],"松前藩士。據說是禰保田館主‧近藤季常的後裔。公卿‧花山院忠長被放逐到蝦夷之際，擔任接應的工作。大阪夏之陣時，隨其主‧慶廣出戰。"],["南條廣繼",57,52,67,38,20,33,34,"武士","佛教","DDCDDDDCD","",1528,1562,1543,[0,0,100,0,0],"蠣崎家臣，勝山館主。娶蠣崎季廣之長女。後來其妻毒殺其弟舜廣、元廣（季廣之長男、次男），遭到連坐牽連，於是自戕。留下「逆水松」之傳說。"],["南部晴政",88,75,41,39,29,66,65,"武士","佛教","CSDDDCDDD","",1517,1582,1532,[100,400,0,0,0],"南部家第24代當主，安信之子。被賜與將軍足利義晴的偏諱，改名晴政。以三戶城為根據地，建立了南部家廣大的版圖。"],["石川高信",80,67,53,53,80,67,75,"武士","佛教","CADDDDCDD","",1496,1571,1511,[100,400,0,0,0],"南部家臣，南部政康之次男。以津輕郡代的身分輔佐其姪‧晴政，成功地大力擴展了南部家的勢力。後來因家臣‧大浦（津輕）為信的謀反，而自殺。"],["南部信直",66,42,78,81,75,67,53,"武士","佛教","DCDDADDBB","",1546,1599,1561,[0,100,0,0,200],"南部家第26代當主，石川高信之子。在晴繼（晴政之子）死後的御家騷亂中獲勝後繼承家業。被九戶政實之亂搞得焦頭爛額，但因親近豐臣秀吉，而統一了領地。"],["南部利直",69,54,82,76,40,67,56,"武士","佛教","DCDCBBCBC","",1576,1632,1591,[0,100,0,100,100],"南部家第27代當主，信直之子。父親死後繼承了家業。關原會戰中屬於東軍，救援了最上家。通過平定領地內起義等行動建立了南部藩的基礎。"],["泉山古康",41,29,49,70,67,67,54,"武士","佛教","DDDDDDDDC","",1536,1590,1551,[0,0,0,0,0],"南部家臣，政昭（石龜信房之子）之子。作為叔父泉山康朝的義子，以三戶鄉泉山村為領地，改姓泉山。女兒慈照院後來成為主公南部信直的夫人。"],["泉山政義",31,21,48,65,57,67,69,"武士","佛教","DDDCDDDDC","",1560,1629,1575,[0,0,0,100,0],"南部家臣，古康的嫡子。姐姐是主公信直的妻子慈照院。後來因為石龜家無人繼承，改姓石龜。作為信直的義弟，位列南部藩重臣20名之內。"],["北信愛",76,55,69,82,88,67,90,"武士","佛教","BCBDBBCDB","",1523,1613,1538,[400,100,0,0,0],"南部家臣，劍吉城主。在晴政死後的御家騷動中支持信直，成為信直的首席家老，表現活躍。每逢戰鬥，一定帶著小觀音像保佑。"],["八戶政榮",47,49,63,75,84,67,66,"武士","佛教","CDDDDDDDC","",1544,1610,1559,[100,0,0,0,0],"南部家臣，八戶根城主。和北信愛同為支撐主家的重臣。信直參加豐臣秀吉的小田原征伐戰時，他留下防衛。據說因患眼疾而失明。"],["九戶信仲",59,54,66,43,22,60,54,"武士","佛教","DDCDCCDDD","",1514,1568,1529,[0,0,100,0,100],"南部家臣，信實之長男，九戶城主。號稱右京。九戶家乃是南部家之庶族，據說其祖先是南部行連（南部家始祖‧光行之六男），娶八戶信長之女。"],["九戶政實",72,78,42,36,5,60,55,"武士","佛教","CADDDDCCD","",1536,1591,1551,[100,400,0,0,0],"南部家臣，信仲之子。南部晴政死後，推舉弟弟‧實親為繼承人未果，於是發動叛亂。與應南部信直的邀請而出戰的豐臣軍奮戰，慘遭敗北，被斬首。"],["九戶實親",75,73,30,33,20,60,49,"武士","佛教","DBDDDDCDD","",1542,1591,1557,[0,100,0,0,0],"南部家臣，信仲之子。與南部晴政的次女結婚，成為候選繼承人。與反叛主家的兄長‧政實一起踞守九戶城，與豐臣軍作戰，但是戰敗，被斬首。"],["高田康真",54,39,70,34,16,60,41,"武士","佛教","DDDCCDDDD","",1553,1594,1568,[0,0,0,100,0],"南部家臣，九戶信仲之四子。原來是高水寺城主‧斯波詮直的女婿，但是與岳父對立，因而出走，擔任了斯波伐軍的先鋒。後來被表兄弟殺死。"],["大浦為則",39,28,59,67,60,50,47,"武士","佛教","DDDDDDDDC","",1520,1567,1535,[0,0,0,0,0],"南部家臣，政信之嫡子，大浦城主。父親死後，繼承了家業。據說生來就病弱。後來讓女兒‧戌的丈夫‧大浦（津輕）為信作了後嗣。"],["津輕為信",82,72,95,94,3,13,57,"武士","佛教","ACDBSSCBA","",1550,1607,1565,[400,100,0,0,400],"弘前藩初代藩主，娶了大浦為則之女。從主家南部家獨立，用了17年時間統一了津輕。參加了豐臣秀吉的小田原征伐戰，正式得到了津輕領主的地位。"],["津輕信牧",68,61,73,83,44,13,45,"武士","佛教","CDDBDBDBC","",1586,1631,1601,[100,0,0,100,0],"弘前藩的第2代藩主，為信之三男。幼時即因為受到其父的影響受洗為基督徒。兩名兄長夭折，故其父死後繼承家業。修築弘前城，穩固該藩的基礎。"],["沼田祐光",69,47,83,78,81,12,73,"武士","佛教","BCBCAADBB","",1539,1612,1554,[100,0,100,100,300],"津輕家臣，上野國沼田出身。雲遊全日本修練武藝的時候，欣賞為信的器量，因而為其效力，成為其導師。為了為信的津輕統一作出許多功績。"],["小笠原信凈",55,60,64,41,72,7,65,"武士","佛教","DDDCCBDCD","",1532,1597,1547,[0,0,100,0,200],"津輕家臣。支持主公‧為信創業的大浦三老之一，出身於信濃國，後移居到津輕，為大浦家效力。參加了進攻大光寺城、石川城的戰鬥，表現出色。"],["兼平綱則",63,57,69,59,55,12,81,"武士","佛教","CDDDCBDCC","",1544,1625,1559,[100,0,0,0,200],"津輕家臣。輔助主公‧為信度過事業草創期的大浦三老之一。兼平家為大浦一族，據說在種里盛純（大浦盛信之弟）領有兼平村之時，即以地名為姓。"],["森岡信元",64,68,21,17,36,16,50,"武士","佛教","DBDDDCDDC","",1556,1606,1571,[0,100,0,0,0],"津輕家臣。支持主公為信創業的大浦三老之一。參加了與石川高信的戰鬥，攻下和德城，成為城主。後來被為信懷疑謀反，被謀殺。"],["浪岡顯村",28,26,35,63,75,11,47,"高家","佛教","DDDDDDDDC","",1555,1602,1570,[0,0,0,0,0],"浪岡北田家當主，具運之子。娶了安東愛季之女。由於被津輕為信攻下了居城浪岡城，只好投靠安東家，改名為北田彈正。也有說法是城被攻破時自殺了。"],["斯波經詮",47,28,67,65,33,94,64,"高家","佛教","DCCDCCDCC","",1495,1559,1510,[0,100,0,0,100],"奧州斯波家當主，詮高的嫡子。奧州斯波家是從足利尊氏的家臣‧斯波家長作為奧州管領被派去斯波郡，建立高水寺城並以那裏為根據地。"],["斯波詮真",35,27,51,55,63,96,54,"高家","佛教","DCCDDCDDD","",1524,1578,1539,[0,0,100,0,0],"奧州斯波家當主，經詮之子。與鄰國南部家屢屢爭鬥，終於被逼入劣勢，於是兩方和解。後來讓九戶信仲的四子高田康真作了女婿。"],["斯波詮直",9,14,5,31,14,95,69,"高家","佛教","DDDDDDDDD","",1550,1619,1565,[0,0,0,0,0],"奧州斯波家當家，詮真之子。敗給南部信直的軍隊，潛逃到各地躲藏。後來雖仕於南部家，卻於大阪冬之陣時成為浪人，據說住在京都。"],["豬去詮義",46,41,45,61,49,96,64,"高家","佛教","DDDDDDDCD","",1500,1564,1515,[0,0,0,0,0],"奧州斯波家臣，詮高之三子。父親進攻雰石地區的時候，他成為豬去館主，稱豬去御所。豬去館在斯波家滅亡的時候招致了南部信直的攻擊。"],["石清水義長",58,41,58,35,84,95,44,"武士","佛教","DDCDDCDDD","",1544,1588,1559,[0,0,100,0,0],"斯波家臣。稱肥後，屢向不理政務、沉迷於享樂的主公詮真進諫，但是主公聽不進去。南部信直消滅斯波家的時候，他為主家殉難了。"],["石清水義教",45,56,66,50,11,99,59,"武士","佛教","DCCDCCDDD","",1547,1606,1562,[0,100,0,0,200],"斯波家臣，義長之弟。稱右京。對主家的前途看淡，與南部家串通。在居城石清水館舉兵，南部軍趁此機會進攻，斯波家滅亡了。"],["雰田詮泰",39,46,61,43,26,99,54,"武士","佛教","DDDDDCDDC","",1539,1593,1554,[0,0,0,0,0],"斯波家臣，通稱大學。由於對主家的前途感到不安，而與石清水義教一起勾結南部家，導致了斯波家的滅亡，後來南部家給了他千石。"],["葛西晴胤",40,33,49,47,52,76,58,"武士","佛教","CDDDDDDDD","",1497,1555,1512,[0,0,0,0,0],"葛西家第15代當主，晴重之次子，寺池城主。由於兄長‧守信和其義子‧晴清（伊達稙宗之六子）均早逝，因而由他繼承了家業。接受了將軍‧足利義晴的偏諱。"],["葛西親信",20,18,27,40,44,77,47,"武士","佛教","DCDDDDDDC","",1513,1560,1528,[0,0,0,0,0],"葛西家第16代當主，晴胤之嫡子，寺池城主。父親死後，繼承了葛西家的家業。可是，由於體弱多病，主政僅五年，沒有留下什麼功績就病死了。"],["葛西晴信",42,32,47,57,36,78,63,"武士","佛教","DCDDDDDCD","",1534,1597,1549,[0,0,0,0,0],"葛西家第17代當主，晴胤之次子，寺池城主。兄長親信死後，他繼承了家業。曾經聯合伊達家與大崎家作戰。沒有參加豐臣秀吉的小田原征伐，因而被免職。"],["葛西俊信",51,71,5,10,76,76,56,"武士","佛教","DBDDDDDDD","",1579,1635,1594,[0,100,0,0,0],"伊達家臣，父重俊乃是胤重（晴信之弟）之子。兄重信出仕於宇和島伊達家而遠赴宇和島。以馬術名家而聞名，曾經在京都數度展現美技。"],["柏山明吉",72,63,64,39,53,76,65,"武士","佛教","CDDDCCDCD","",1530,1595,1545,[100,0,0,0,0],"葛西家臣，大林城主。柏山家是奧州千葉家的一員。擔任膽澤郡的總管職，擁有家中重要的軍事實力。是葛西‧大崎起義時擔任總大將的柏山明宗之父。"],["柏山明助",60,73,24,12,57,79,46,"武士","佛教","BBDDDDDDC","",1578,1624,1593,[100,100,0,0,0],"葛西家臣，明宗的嫡子。主家滅亡後，為南部家效力，擔任岩崎城代，在鎮壓和賀起義軍等行動中表現出色，但是主公利直害怕其剛勇，將其毒殺。"],["小山明長",59,72,54,9,29,76,29,"武士","佛教","DCCDDDDCD","",1557,1586,1572,[0,100,100,0,0],"葛西家臣，柏山明吉之三子，小山城主。與弟弟折居明六都是領內很有名的武士，1581年柏山家內亂的時候，殺害了家老三田將監。"],["折居明久",60,75,30,7,23,76,34,"武士","佛教","BBDDDCDDD","",1561,1595,1576,[100,100,0,0,0],"葛西家臣，柏山明吉之四子。折居館主，是領內有名的武士，柏山家內亂的時候，殺害了家老三田將監。葛西‧大崎起義中擔任叛亂軍的總帥。"],["米谷常秀",40,42,37,37,52,79,56,"武士","佛教","DDCDDDDDD","",1535,1591,1550,[0,0,0,0,0],"葛西家臣，米谷城主，常時之嫡子。米谷家有龜掛千葉家的血脈。與桃生郡深谷的弟弟（五子）常忠、弟弟（七子）信忠一起被伊達政宗謀殺。"],["武遣重信",58,59,51,24,63,76,65,"武士","佛教","CDDDDCDDD","",1526,1591,1541,[100,0,0,0,0],"葛西家臣，武遣城主。參加了鎮壓富澤家叛亂、鎮壓濱田家和熊谷家的兵變等行動，表現出色。與桃生郡深谷的弟弟儀信一起被伊達政宗謀殺。"],["矢作重常",47,45,43,31,41,77,36,"武士","佛教","DDCDDDDDC","",1555,1591,1570,[0,0,0,0,0],"葛西家臣，外館城主。鎮壓濱田兵亂立下大功，取代濱田家成為氣仙郡的首領。此時才能得到認可。後來被伊達政宗謀殺。"],["大崎義直",49,34,38,44,43,95,71,"高家","佛教","CDCDDDDCC","",1506,1577,1521,[0,0,0,0,0],"大崎家第12代當主。因得到伊達稙宗援助，鎮壓家臣的謀反而逐漸失勢。於天文大亂時，協助伊達晴宗，攻打稙宗所屬的大崎義宣。"],["大崎義隆",52,49,25,48,47,97,55,"高家","佛教","CDDDDDDDC","",1548,1603,1563,[0,0,0,0,0],"大崎家第13代當主，義直之子。一度擊退伊達政宗的大軍，但是後來投入其麾下。參加豐臣秀吉的小田原征伐時去晚了，因此被免職，之後為上杉景勝效力。"],["一栗故牛",70,53,74,50,60,96,91,"武士","佛教","CDADABDDD","",1500,1591,1515,[100,0,400,0,300],"大崎家臣，奧州一栗城主。據說是一栗兵部高春的祖父，葛西‧大崎起義的時候，不顧自己92歲的高齡，踞守居城作戰，戰敗被殺。"],["一栗高春",63,71,52,15,21,97,57,"武士","佛教","CCDDDDDCD","",1557,1614,1572,[0,100,0,0,0],"大崎家臣，一栗城主。葛西、大崎起義的時候，踞守居城，奮戰至最後。平定起義後為最上家效力，擔任鶴岡城番，但是因發動叛亂被誅殺。"],["一迫隆真",31,19,73,54,33,95,44,"武士","佛教","DDDDCDDDC","",1549,1593,1564,[0,0,0,0,300],"大崎家臣，真阪城主，伊豆守，也稱狩野姓。據說一迫‧狩野家擔當大崎一族的參謀，天正末期主家內亂的時候，站在氏家彈正吉繼一方。"],["氏家吉繼",50,47,65,71,8,97,54,"武士","佛教","DDDDCCDDC","",1537,1591,1552,[0,0,0,0,200],"大崎家臣，岩出山城主。大崎內亂的時候與伊場野總八郎聯手，是反主流派的中心人物。主家沒落後，為伊達政宗效力，但是不久之後病死了。"],["黑川晴氏",77,72,66,36,47,88,76,"武士","佛教","BACDCDDCD","",1523,1599,1538,[100,100,100,0,100],"大崎家臣，鶴楯城主。黑川家乃大崎家之庶族。從應永年間起隸屬於伊達家。1588年，伊達家入侵大崎領地之際，協助大崎家，擊破伊達軍。"],["四釜隆秀",60,77,63,52,20,96,49,"武士","佛教","DBBDBCDCD","",1547,1596,1562,[0,100,100,0,200],"大崎家臣，四釜城主，剛勇機智。大崎家內亂的時候，奉主公義隆之命守衛新田城，與前來進攻的伊達軍作戰，將其擊退。"],["南條隆信",78,71,64,19,92,95,34,"武士","佛教","ACDDCDDDC","",1559,1593,1574,[100,100,0,0,100],"大崎家臣，中新田城主。大崎家內亂的時候，他守備居城，神奇地指揮作戰，出色地擊退了伊達政宗軍。是大崎家侍大將中的名將。"],["新井田隆景",31,17,58,50,29,96,20,"武士","佛教","DDDDDDDDD","",1573,1593,1588,[0,0,0,0,0],"大崎家臣，新井田城主。擔任義隆的侍從。是家中屈指可數的美少年，與同為侍從的伊場野總八郎爭寵，引發了大崎家的內亂。"],["宮崎隆親",64,61,46,22,86,95,54,"武士","佛教","CDCDDDDCD","",1542,1596,1557,[0,0,100,0,0],"大崎家臣，宮崎城主，擔任侍大將。葛西‧大崎起義的時候擔任總大將，守衛居城，與伊達軍作戰，但是戰敗。據說城池陷落後隱居在秋田仙北。"],["留守顯宗",27,30,22,68,72,67,67,"武士","佛教","DDDDDDDCC","",1519,1586,1534,[0,0,0,0,0],"留守家第17代當主，景宗之嫡子。與國分家爭戰不斷。在伊達晴宗之三男‧政景成為女婿後隱居，這時，嫡子宗綱成為高城家的養子。"],["留守政景",69,65,55,60,57,68,58,"武士","佛教","DCCDDDDDC","",1549,1607,1564,[0,100,100,0,0],"留守家第18代當主，伊達晴宗之三男。娶留守顯宗之女而繼任家督。追隨其兄‧輝宗與姪政宗，多與相馬家或最上家交戰。後來，恢復原本的伊達姓氏。"],["國分盛氏",42,36,28,51,38,67,69,"武士","佛教","CDDDDDDCD","",1506,1575,1521,[100,0,0,0,0],"陸奧豪族，號稱能登守。1189年，源賴朝滅亡陸奧平泉的藤原家之際，火燒國分尼寺。於1570年重建該寺。"],["國分盛顯",15,31,36,25,52,67,54,"武士","佛教","DDDDDCDDD","",1528,1582,1543,[0,0,0,0,0],"陸奧豪族，盛氏之子。追隨源賴朝討伐奧州的千葉常胤的五男胤通，為國分家的祖先。由於自己沒有兒子，所以收伊達晴宗的十男盛重為養子。"],["國分盛重",19,21,14,32,14,68,62,"武士","佛教","DCDDDDDDD","",1553,1615,1568,[0,0,0,0,0],"伊達家臣，伊達晴宗的十男。繼承國分家。1599年，稱病不願出仕岩出山城。被懷疑有反叛意圖而出走，前去投奔其姐的夫家佐竹家。"],["相馬盛胤",84,75,60,56,75,7,72,"武士","佛教","DADDDDDDC","",1529,1601,1544,[0,400,0,0,0],"相馬家第15代當主，顯胤之嫡子，小高城主。天文大亂後與伊達家敵對，在各地展開死鬥。另一方面，與近鄰的田村清顯和睦相處，鞏固了領地的基礎。"],["相馬義胤",76,70,54,50,78,7,87,"武士","佛教","DADDDCDCD","",1548,1635,1563,[0,400,0,0,0],"相馬家第16代當主，盛胤之嫡子。在伊達家各地展開抗爭。在關原會戰中屬於西軍，被免職，但是在伊達政宗的勸解下保全了領地。"],["泉田胤清",64,37,27,28,60,8,39,"武士","佛教","CDCDDDDDD","",1563,1602,1578,[0,0,100,0,0],"相馬家臣，泉田城主。1588年於守備的大越城，成功擊退來襲的伊達政宗軍，追隨其主義胤，與伊達家之間爭戰不休。"],["江井胤治",23,21,16,68,67,8,84,"武士","佛教","DDDDDCDCC","",1504,1588,1519,[0,0,0,0,0],"相馬家臣，歷仕於顯胤、盛胤、義胤。活躍於內政與外交工作。追隨義胤拜訪田村家之際，遭到私通伊達家的田村家臣田村月齋的狙擊而亡。"],["佐藤好信",42,34,38,72,53,38,49,"武士","佛教","DDCDDDDDA","",1514,1563,1529,[0,0,0,0,0],"相馬家臣。佐藤家原來是岩城家臣，但是從好信這一代屬於相馬家。擔任軍事奉行，但是由於郡左馬助的讒言被沒收了領地，在失意中病逝。"],["佐藤為信",66,53,63,45,27,38,48,"武士","佛教","DCDDCDDCD","",1543,1591,1558,[0,100,0,0,100],"相馬家臣，好信之子，小齋城主。與伊達家會戰的時候，殺死了來增援的郡左馬助，為父親報了仇。後來臣屬伊達家，之後在佐沼戰役中陣亡。"],["水谷胤重",66,58,41,71,86,7,68,"武士","佛教","DCBDDCDCD","",1538,1606,1553,[0,100,100,0,0],"相馬家臣。關原之戰後，對於提出通過領地要求的伊達政宗，家臣大多提議趁機殺害，他是唯一提出反對的人。結果政宗平安通過。主家因此免於貶為平民的命運。"],["岩城重隆",69,57,68,70,44,40,69,"武士","佛教","CCDDCDDDB","",1500,1569,1515,[100,100,0,0,200],"陸奧大館城主。伊達家內亂〈天文大亂〉之際，女兒‧久保成為晴宗的妻子，因此與晴宗為同一陣線。和佐竹義篤時而互相較勁。在和歌創作方面頗富造詣。"],["岩城貞隆",41,33,46,55,52,23,37,"武士","佛教","DDCDDDDDC","",1583,1620,1598,[0,0,0,0,0],"陸奧大館城主。佐竹義重的三男。岩城常隆的養子。因為沒能在關原合戰中參加出征，而遭到貶抑，家財充公。後因參加大阪之陣，而受封信濃川中島一萬石。"],["船尾昭直",60,67,66,47,30,44,69,"武士","佛教","CDDDCCDDC","",1538,1607,1553,[100,0,0,0,100],"佐竹家臣。船尾家是以岩城由隆之弟隆輔為祖。隸屬於佐竹家而侍奉義昭、義重、義宣三代，並以陸奧方面之佐竹家先鋒的身份活躍。"],["田村隆顯",70,76,53,44,24,54,85,"高家","佛教","CADDDDDCC","",1489,1574,1504,[100,400,0,0,0],"奧州的豪族，三春城主。娶了伊達晴宗之女。伊達家內亂（天文大亂）的時候，他幫助了岳父稙宗。打敗了佐竹義重和石川昭光聯軍，但是不久驟逝。"],["小峰義親",56,41,67,48,16,19,85,"高家","佛教","DCDDCCDDC","",1541,1626,1556,[0,0,0,0,300],"奧州小峰城主，顯賴之子（也說是義綱之子）。趕走宗家義顯，佔領了白河結城。後來敗給了佐竹義重，以義重之子義廣為義子，然後退隱。"],["河東田清重",63,75,50,68,76,15,64,"武士","佛教","CDBDDDDDC","",1542,1606,1557,[100,0,100,0,0],"白河結城家臣。號稱上總守。據說驍勇善戰、施行德政，頗得民眾愛戴。活躍於與佐竹家之間的戰役。主家滅亡之後，改仕於伊達家。"],["蘆名盛氏",87,71,85,86,43,45,59,"武士","佛教","ABDDABDBA","",1521,1580,1536,[100,400,0,0,400],"蘆名家第16代當主。把蘆名家建設成了與伊達家齊名，是奧州舉足輕重的大名，是蘆名家中興之祖。巧妙地利用同盟，獲得了從會津一元到北越後的領地。"],["蘆名盛興",64,47,35,53,41,45,28,"武士","佛教","DCDDDDDCC","",1547,1575,1562,[0,100,0,0,0],"蘆名家第17代當主，盛氏之嫡子。父親退隱後，他繼承了家業，但是在與佐竹家的抗爭中早逝。為了治療盛興的病，父親在領地內曾經禁止釀酒。"],["二階堂盛義",43,38,50,70,75,45,49,"武士","佛教","DCDDDDDDB","",1532,1581,1547,[0,0,0,0,0],"二階堂家第18代當主。起初與蘆名盛氏相爭，但後來交出兒子盛隆為人質而投降。由於日後盛隆繼承了蘆名家，因此受到援助而回復了二階堂家的勢力。"],["蘆名盛隆",65,62,51,56,35,45,23,"武士","佛教","CCDDDDDCD","",1561,1584,1576,[0,100,0,0,0],"蘆名家第18代當主，二階堂盛義之子。娶了蘆名盛興的後室，聯合上杉、北條家等與佐竹家爭鬥，在黑川城裏被失寵的近臣殺死。"],["蘆名盛重",53,51,26,53,47,19,55,"武士","佛教","DDDDDDDDC","",1576,1631,1591,[0,0,0,0,0],"蘆名家第20代當主，佐竹義重的次子。成為白河結河家的義子，但是後來娶了蘆名盛隆之女，繼承了家業。在摺上原與伊達政宗作戰，戰敗後逃到故鄉常陸。"],["針生盛信",26,19,38,48,26,47,72,"武士","佛教","DDCDDDDDD","",1553,1625,1568,[0,0,0,0,0],"蘆名家臣，盛幸（蘆名盛滋之子）之孫。1576年，與金上盛實爭奪地位。由於在關原會戰中屬於西軍，失去了領地，後來為伊達家效力。"],["豬苗代盛國",67,36,64,47,9,65,58,"武士","佛教","DCBDCBDDC","",1536,1594,1551,[0,0,100,0,100],"蘆名家臣。由於後妻讒言，企圖廢其嫡子‧盛胤的地位。事發之後，與盛胤相爭。後來背棄主家投靠伊達家，於摺上原之戰時，擔任先鋒攻打蘆名軍。"],["豬苗代盛胤",60,73,37,29,89,46,76,"武士","佛教","CBDDDDDDC","",1565,1641,1580,[100,100,0,0,0],"蘆名家臣，盛國之子。摺上原之戰中，於主家戰敗後，追隨其主盛重逃到常陸。後來離開盛重，回到故鄉豬苗代，在故鄉度過餘生。"],["金上盛備",55,57,58,67,84,45,62,"武士","佛教","CCDDDDDBD","",1527,1589,1542,[100,0,0,0,0],"蘆名家臣。盛隆死後，戰勝要推舉伊達政宗之弟小次郎為繼承人的一派，成功地擁戴了佐竹義重之次子義廣為當主。在摺上原會戰中陣亡。"],["鬆本氏輔",47,46,43,54,36,47,50,"武士","佛教","DDDDDBDDC","",1525,1575,1540,[0,0,0,0,0],"蘆名家臣，舜輔之子。蘆名四天的宿老之一。稱圖書助，擔任過奧州船岡的城主。1574年，與田村清顯軍在安積郡福原作戰時戰死。"],["富田氏實",22,20,40,74,17,46,50,"武士","佛教","DDDDDDDDB","",1541,1591,1556,[0,0,0,0,0],"蘆名家臣。四天宿老之一。於其主盛隆死後，推舉伊達政宗之弟小次郎繼承而失敗。於摺上原之戰時，擔任留守任務，主力部隊敗北之後，降於伊達家。"],["富田隆實",63,81,21,12,92,45,25,"武士","佛教","CBDDDDDCD","",1569,1594,1584,[100,100,0,0,0],"蘆名家臣，氏實之子。於摺上原之戰擔任先鋒，奮戰直逼伊達軍本陣，敗北後，追隨其主盛重逃到常陸，但是過沒多久即離盛重而去。"],["佐瀨種常",44,45,49,69,57,44,74,"武士","佛教","DDCDDDDDB","",1515,1589,1530,[0,0,0,0,0],"蘆名家臣，蘆名四天的宿老之一。原來在耶麻郡中田付開六齋市，但是中田付不方便，於是把六齋市移到了小田付村。在摺上原會戰中戰死。"],["平田舜範",41,32,46,46,36,46,64,"武士","佛教","DDCDDDDDD","",1519,1583,1534,[0,0,0,0,0],"蘆名家臣，輔範之子。平田家乃是蘆名四天宿老之一。稱之為是亦齋。大槻城主大槻政通謀反之際，追隨其主盛氏出戰，平定亂事。"],["慶德範重",65,70,33,18,68,45,39,"武士","佛教","CDDDDDDCD","",1555,1594,1570,[100,0,0,0,0],"蘆名家臣，平田舜範之子。平定松本行輔（氏輔之子）的叛變。伊達軍侵略蘆名領地之際，連同中目盛光一起奮戰不懈，終於擊破對方。"],["大內定綱",55,73,63,27,21,26,64,"武士","佛教","BCDDDDDCD","",1546,1610,1561,[100,100,0,0,0],"奧州的豪族，鹽松城主。伊達政宗成為伊達家當主時，他歸屬了伊達家，但是不久就與之敵對。招致政宗的攻擊，敗北，以後為伊達家效力。專長槍術。"],["安東愛季",78,69,84,87,53,35,48,"武士","佛教","BDBCABABB","",1539,1587,1554,[100,0,100,0,300],"檜山安東家第8代當主，舜季的嫡子。統一了湊和檜山兩安東家，運用巧妙的戰略，建立了安東家最大的版圖，其才能令人恐懼。"],["秋田實季",71,49,60,50,41,35,83,"武士","佛教","CDDBDBADB","",1576,1659,1591,[100,0,0,0,0],"檜山安東家第9代當主，愛季的嫡子。父親死後，他繼承了家業。與南部家和戶澤家抗爭，守住了領地，但是由於關原會戰中的表現不佳，被趕出了秋田領地。"],["安東茂季",46,55,51,45,46,40,39,"武士","佛教","CDDDDDBDC","",1540,1579,1555,[0,0,0,0,0],"湊安東家第9代當主，舜季的三子。成為安東季堯的義子的兄長友季死後，他繼承家業，成為了湊安東家的當主。娶了蠣崎季廣的六女為妻。"],["安東通季",32,30,25,34,14,40,30,"武士","佛教","DDDDDDBCD","",1564,1594,1579,[0,0,0,0,0],"湊安東家第10代當主，茂季的嫡男。其父死後，被伯父‧愛季逼得不得不放棄湊城，而移至豐島城。愛季死後，與戶澤家共謀欲舉反旗，但失敗而終。"],["安東堯季",18,31,35,32,12,34,54,"武士","佛教","DDDDDCDCD","",1521,1575,1536,[0,0,0,0,0],"湊安東家第7代當主，宣季之子。其父死後繼承家業，被管領細川家的執事以「謹上書眾」待之。始終未能弄璋，因此過女婿‧舜季的三男‧茂季為養子。"],["豐島重村",19,21,60,72,68,40,54,"武士","佛教","DDCDDDDDC","",1540,1594,1555,[0,0,0,0,0],"安東家臣，據說是畠山重忠的後裔。1570年，聯合安東家臣下刈右京等人叛變，敗於安東愛季的軍隊後，投靠妻子的娘家‧仁賀保家。"],["南部政直",44,46,47,35,75,40,39,"武士","佛教","DCDDDDCDC","",1523,1562,1538,[0,0,0,0,0],"安東家臣。稱宮內少輔。作為安東家的外交官屢屢去京都，與山科言繼和織田信長會見。愛季向信長贈送馬和鷹的時候他也擔任使者。"],["淺利則祐",36,32,57,48,52,33,54,"武士","佛教","DCDDDCCDC","",1529,1583,1544,[0,0,0,0,0],"出羽的豪族，十狐（獨鈷）城主。則賴的嫡子。與計劃從屬於安東家的弟弟勝賴對立，後來招致勝賴引來的安東軍的攻擊，自殺了。"],["淺利勝賴",31,40,16,54,27,33,44,"武士","佛教","DDDDDDDCD","",1554,1598,1569,[0,0,0,0,0],"出羽的豪族，則賴的次子。與安東家聯手，迫使兄長則祐自殺，成為了當主。後來由於與津輕家勾結，企圖謀反，安東愛季誘他出來飲宴，將他殺死。"],["淺利賴平",63,49,52,42,53,39,80,"武士","佛教","DCCDDDDDD","",1524,1604,1529,[0,100,0,0,0],"出羽的豪族，勝賴之子。父親被謀殺後，他隱身於津輕。後來作為安東家的代官治理比內，但是發生未繳納軍役金的問題，訴訟過程中猝死於大阪。"],["戶澤道盛",22,8,68,41,31,39,41,"武士","佛教","DDDDCDDDD","",1551,1592,1566,[0,0,0,0,200],"戶澤家第16代當主，角館城主，秀盛的嫡子。由於父親去世，年紀尚幼就繼承了家業，此後，年紀輕輕就退隱，死在孫子的移封處常陸國小河城。"],["戶澤盛安",85,90,70,55,81,39,24,"武士","佛教","CSBDDSDAC","",1566,1590,1581,[100,400,100,0,0],"戶澤家第18代當主，角館城主，道盛的三子。採取積極的軍事行動，建立了戶澤家最大的版圖。得到了「夜叉九郎」的綽號，據說他也有慈悲深沉的一面。"],["戶澤政盛",73,71,52,71,76,39,63,"武士","佛教","DBBDDBDBB","",1585,1648,1600,[0,100,100,0,0],"戶澤家第20代當主，角館城主。盛安的庶子。叔父光盛死後，他繼承了家業。關原會戰中攻打上杉家的酒田城，大阪之戰中守衛小田原城等。"],["戶澤政重",46,39,72,50,44,45,85,"武士","佛教","DDCDBCDDD","",1493,1578,1508,[0,0,0,0,300],"戶澤家臣，戶澤家第14代當主徵盛之三子。稱安房守，住在小館。後來收入佛門的盛重（侄子道盛的嫡子）為義子。"],["本堂忠親",39,25,56,44,33,64,93,"武士","佛教","DDDDCBDDD","",1506,1599,1521,[0,0,0,0,100],"出羽的豪族，本堂城主，朝親之子。參加了豐臣秀吉的小田原征伐，保全了領地。秀吉出兵朝鮮的時候，他屬於前田利長軍，駐在肥前名護屋城。"],["戶蒔義廣",42,45,41,33,57,34,44,"武士","佛教","DDCDDDDCD","",1556,1600,1571,[0,0,0,0,0],"戶澤家臣。擔任出羽戶蒔城主。關原會戰的時候跟隨東軍的最上義堯出戰，與西軍的小野寺義道軍作戰，但是在角間川戰死。"],["小野寺輝道",69,64,70,58,55,49,63,"武士","佛教","CCDDCCDCC","",1534,1597,1549,[100,100,0,0,100],"小野寺家第13代當主，惟道的嫡子。父親死後，一度藏在大寶寺家，後來殺了仇敵橫手光盛等人，重返橫手城。建立起小野寺家的全盛時代。"],["鮭延秀綱",70,75,74,38,41,48,84,"武士","佛教","DBBDBBDDC","",1562,1646,1577,[0,100,100,0,300],"小野寺家臣，鮭延城主，貞綱之子。與最上義光會戰，失敗，從屬之。鎮壓仙北地區的起義，與侵入最上領地的上杉軍戰鬥，均立下過大功。"],["大寶寺義氏",66,70,7,27,26,48,32,"僧侶","佛教","DCDDDDDDD","",1551,1583,1566,[0,100,0,0,0],"出羽的豪族，尾浦城主。經常會戰，忽略了領地內的政務，被領民憎惡。勾結最上義光的家臣前森藏人謀反時，自殺了。"],["最上義守",39,24,21,42,15,97,69,"武士","佛教","DDDDDDDDB","",1521,1590,1522,[0,0,0,0,0],"最上家第10代當主。2歲時繼承了家業。偏愛次子義時，欲傳家業給義時，但是趁著伊達家的騷動，長子義光崛起，他被迫讓位。"],["最上義光",82,77,96,88,2,99,68,"武士","佛教","BBDCSADAA","",1546,1614,1561,[100,400,0,0,600],"最上家第11代當主，義守的嫡子。逼迫父親讓位，殺死弟弟，自己成為當主。使用密約外交和暗殺敵人重臣等等種種手段，建立了最上家最大的版圖。"],["最上家親",41,57,22,47,36,96,35,"武士","佛教","CDDCDDDDC","",1582,1617,1597,[0,100,0,0,0],"最上家第12代當主，義光的次子。父親死後，他繼承了家業。殺了與之一直對立的弟弟，致力領地內統一，但是不久奇怪地死去。據說是叔父楯岡光直下了毒。"],["中野義時",19,21,14,30,24,97,24,"武士","佛教","DDDDDCDDD","",1550,1574,1565,[0,0,0,0,0],"最上家臣。是最上義守的次子。受到父親寵愛，與兄長義光爭奪家督之位。因受到反對義光政策的天童賴貞等擁立而開戰，但被義光攻破而自盡。"],["氏家定直",60,42,77,70,84,98,59,"武士","佛教","DCCDBDCBD","",1512,1571,1527,[0,100,100,0,300],"最上家臣。天文大亂的時候代表主公義守出戰。主家發生騷動的時候，抱病勸說義守，使其將家業傳給了義光。"],["氏家守棟",69,58,80,60,72,97,62,"武士","佛教","CCDDBBDDB","",1534,1596,1549,[0,100,0,0,0],"最上家臣，定直之子。專長智謀，討伐天童家和白鳥家時做出了很大貢獻。還作為使者出使過伊達家，進攻過真室城，在各方面均表現出色。"],["氏家光氏",71,74,49,58,75,97,59,"武士","佛教","BADDDBDCD","",1568,1627,1583,[100,100,0,0,0],"最上家臣，為成澤家的出身。繼承守棟。關原之戰時，奮勇對抗揮兵前來的上杉景景勝軍，家親成為當主後，負責領國的政治。"],["北楯利長",16,8,62,82,63,96,77,"武士","佛教","DDDDCDDBS","",1548,1625,1563,[0,0,0,0,100],"最上家臣，稱大學。進行治水工程，解決了莊內水源不足的問題。這個堰被稱為「大學堰」，主公義光對其才能讚不絕口。"],["志村光安",74,76,69,28,78,97,44,"武士","佛教","BBBDBDCCD","",1565,1609,1580,[100,100,0,0,200],"最上家臣。身為主公義光的心腹表現出色，非常忠誠，永不背叛。關原會戰的時候守衛長谷堂城，出色地擊退了直江兼繼的大軍。"],["楯岡滿茂",72,61,63,40,57,97,83,"武士","佛教","DCCDDDDDC","",1556,1639,1571,[0,0,100,0,0],"最上家臣，湯澤城主。關原之戰時，雖受小野寺家的攻擊，但仍孤軍奮鬥守住了居城。所領俸祿4萬8千石為最上家臣團之首。"],["新關久正",40,26,39,79,60,95,60,"武士","佛教","DCDDDDDBA","",1582,1642,1597,[0,0,0,0,0],"最上家臣。人稱為因幡守。興建導引赤川之水的工程，但因主家被貶，工作暫時交給了土井利勝，工事於是中斷。後來完成了用水堰，被稱為「因幡堰」。"],["延澤滿延",70,87,31,10,36,93,47,"武士","佛教","ABDDDCCCD","",1544,1591,1559,[100,400,0,0,0],"最上家臣。開始時為天童家效力，但是以嫡子康滿娶最上義光之女松尾公主為條件和解了。是力大剛勇的武將，據說義光一直感覺有心理壓力。"],["伊達稙宗",46,42,89,92,46,74,77,"武士","佛教","DCBDSADDS","",1488,1565,1503,[0,0,100,0,600],"伊達家第14代當主。獲得奧州探題，通過聯姻外交擴大版圖。在三子實元入嗣上杉家問題上與嫡子晴宗對立，引起了「天文大亂」。"],["伊達晴宗",61,55,76,84,30,66,58,"武士","佛教","CCDDBCDAB","",1519,1577,1534,[100,0,0,0,300],"伊達家第15代當主，稙宗的嫡子。與父親對立，引發「天文大亂」，平息後繼承了家業。和父親一樣，以聯姻外交使伊達家的勢力達到不可動搖的地位。"],["伊達輝宗",71,60,51,78,81,74,41,"武士","佛教","DBDCCDDBC","",1544,1585,1559,[0,100,0,0,100],"伊達家第16代當主，晴宗之次子。經常與相馬家爭鬥。將家業讓給嫡子政宗的第二天，被二本松義繼綁架，死於前來救援的伊達軍的槍擊戰中。"],["伊達政宗",95,86,92,93,10,69,69,"武士","佛教","CADSBSBAA","組隊擊",1567,1636,1582,[0,400,0,400,300],"伊達家第17代當主，輝宗的嫡子。短時間內征服了周圍諸國，24歲就稱霸奧州，人稱「獨眼龍」，令人畏懼。機敏地生存於豐臣、德川兩政權下。"],["伊達實元",59,56,54,62,53,66,60,"武士","佛教","DCDDDCDDC","",1527,1587,1542,[0,0,0,0,0],"稙宗的三子。原本要入嗣越後上杉家，但是由於兄長晴宗的阻止，引發了「天文之亂」。亂中屬於稙宗一方，但是風波過後為晴宗效力。"],["伊達成實",87,94,53,52,67,66,78,"武士","佛教","BSDADBCDD","",1568,1646,1582,[400,400,0,100,0],"實元之子。在軍事方面輔佐主公政宗，是伊達家的頭號猛將。得到了高度評價。晚年為德川三代將軍家光講述奧州的軍事故事。"],["遠藤基信",25,31,77,85,95,74,53,"武士","佛教","DDDDBDDAA","",1532,1585,1547,[0,0,0,0,200],"伊達家臣。中野宗時下臺後，他得到了輝宗的信任，成為宿老。負責政務，與織田信長等人也有書信往來。輝宗死後，在其墓前殉死。"],["鬼庭良直",73,80,32,29,75,70,72,"武士","佛教","BBCDDDDCD","",1513,1585,1528,[100,100,100,0,0],"伊達家臣。稙宗的五子盛重入嗣國分家的時候，他去了國分家料理諸般事務。後來負責會議諸事。人取橋會戰中雖然高齡，還擔任殿軍，戰死沙場。"],["鬼庭綱元",73,69,71,70,68,70,91,"武士","佛教","DCDBCDDDC","",1549,1640,1564,[0,100,0,100,200],"伊達家臣。成為主公政宗的心腹，出兵朝鮮的時候，因為豐臣秀吉的愛妾香一事惹得政宗發怒，離開伊達家。後來返回，任國老治理國政。"],["片倉景綱",85,70,95,91,91,69,58,"武士","佛教","CBAASACCA","",1557,1615,1572,[100,100,0,100,400],"伊達家臣。19歲就作為主公政宗的老師，用自己的智慧輔佐政宗。勸說政宗參加豐臣秀吉的小田原征伐，為伊達家的生存作出了貢獻。"],["片倉重長",72,78,41,57,76,69,75,"武士","佛教","CCDADDDCD","",1584,1659,1599,[0,100,0,100,0],"伊達家臣，景綱之子。在大阪夏季戰役中殺死後藤又兵衛等，在很多場合表現出色，德川家康評價他如「鬼」般可怕。據說一表人材，直追小早川秀秋。"],["川村重吉",2,6,17,90,57,68,73,"武士","佛教","DDDDDDDAS","",1575,1648,1590,[0,0,0,0,0],"伊達家臣。精通算術、水利，從北上川的改建工程開始，負責了很多土木工程。建立了仙臺藩200萬石的經濟基礎。"],["小梁川宗朝",55,51,70,62,89,74,96,"武士","佛教","CDDDABDBD","",1469,1565,1484,[100,0,0,0,300],"伊達家臣。天文大亂的時候屬於稙宗方，救出了被幽禁在西山城的稙宗，並在很多行動中表現出色。戰亂平息後，還作為稙宗的近侍，稙宗死後，為其殉死。"],["小梁川宗秀",60,53,50,59,41,74,60,"武士","佛教","CDBDDDDDD","",1510,1570,1525,[100,0,100,0,0],"伊達家臣，宗朝之子。天文之亂時和父親一起屬於稙宗方。中野宗時叛亂的時候，他擔任追討軍的先鋒，進攻小松城時戰死。據說文武全才。"],["桑折貞長",44,32,78,80,35,70,52,"武士","佛教","DDDDBDDBB","",1517,1569,1532,[0,0,0,0,200],"伊達家臣。號稱播磨守。在其主‧晴宗成為奧州探題之際，與牧野久仲一同封為奧州守護代。為報答其受封，獻上了鷹、馬及黃金30兩等的謝禮。"],["後藤信康",70,72,66,9,60,69,59,"武士","佛教","CADDCCDDD","",1555,1614,1570,[0,100,0,0,200],"伊達家臣，湯目重弘的次子，繼承了後藤家。守衛檜原城，防範蘆名家。智勇雙全，會戰的時候必穿黃衣，所以人人畏稱「黃後藤」。"],["白石宗實",72,71,56,42,55,70,46,"武士","佛教","BBDDDDCDC","",1553,1599,1568,[100,100,0,0,0],"伊達家臣，為輝宗、政宗二代效力，在各地的會戰中立下戰功。摺上原會戰中與伊達成實一起形成了伊達軍的主力。也參加了豐臣秀吉的出兵朝鮮行動。"],["鈴木元信",6,4,51,84,65,67,65,"商人","佛教","DDDDDDDBA","",1555,1620,1570,[0,0,0,0,0],"伊達家臣。主要活躍於內政方面。為伊達家擬定統一天下時所需的法令草案，卻在臨終之際，認為這是「無用長物」而燒之。"],["中野宗時",24,13,68,86,26,66,72,"武士","佛教","DDCDBDDAB","",1503,1575,1518,[0,0,0,0,300],"伊達家臣，「天文大亂」中擔任晴宗的參謀，事件平息後成為了家中最大的勢力。輝宗時代發動謀反，失敗之後逃亡，餓死在逃亡途中。"],["牧野久仲",12,5,72,84,20,74,43,"武士","佛教","DDDDBBDBB","",1532,1575,1547,[0,0,0,0,300],"伊達家臣，中野宗時的次子。擔任奧州守護代，與父親一起處理伊達家中的政務。輝宗主政時期發動謀反，但是失敗後逃亡，逃到了相馬領地。"],["支倉常長",17,57,44,69,52,70,51,"武士","佛教","DDDBDBBDC","",1571,1622,1586,[0,0,0,100,0],"伊達家臣。奉其主政宗之命，與傳教士路易斯‧所德羅，一同擔任慶長遣歐使節，訪問西班牙等國。但是並未達成目的，便於8年後回國。"],["原田宗時",75,81,53,18,68,69,28,"武士","佛教","CADDDDCCD","",1565,1593,1580,[0,400,0,0,0],"伊達家臣，剛勇之士，18歲就握有兵馬大權，在各地立下戰功。參加了豐臣秀吉的出兵朝鮮行動，中途病死。「伊達騷動」的原田甲斐是宗時之孫。"],["屋代景賴",62,69,82,27,27,65,45,"武士","佛教","BBDDADDCD","",1563,1608,1578,[100,100,0,0,300],"伊達家臣，14歲就作政宗的近侍。智勇出眾，政宗不在時就命令他留守。可是由於舉止多有傲慢而被免職，流浪中病死了。"],["佐竹義昭",77,59,74,87,63,20,34,"武士","佛教","BCDDCCDDB","",1531,1565,1545,[100,0,0,0,100],"佐竹家第17代當主，義篤的嫡子。降服南陸奧的白河結城家，與小田家爭奪常陸的霸權。關東管領上杉憲政來尋求庇護，被他拒絕了。"],["佐竹義重",94,86,88,89,75,20,65,"武士","佛教","BSCDAACBA","",1547,1612,1562,[100,400,100,0,300],"佐竹家第18代當主，義昭的嫡子，繼承父親的遺志，成功地統一了常陸，與北條家和伊達家為敵，自己親自在陣前指揮作戰，人稱「鬼義重」，令人生畏。"],["佐竹義宣",86,84,66,80,86,20,63,"武士","佛教","BBDBCBCBA","",1570,1633,1585,[100,100,0,100,100],"佐竹家第19代當主。義重的嫡子。勇猛不在其父之下，遠近聞名。在關原會戰中堅持加入西軍，德川家康評價他為少有的固執己見之人。"],["佐竹義堅",52,46,26,60,67,15,53,"武士","佛教","DDCDDDDDC","",1518,1571,1533,[0,0,0,0,0],"佐竹一門，東家政義的嫡子。效力於年輕的宗家義昭，與北家義廉和南家義里等人輪流執行佐竹家的家政。1556年與那須家作戰，戰敗。"],["佐竹義久",80,71,63,77,68,15,47,"武士","佛教","BBBCDDCCB","",1554,1601,1569,[100,100,0,0,0],"佐竹一門，東家義堅的次子，擔任南陸奧勢力範圍內的總指揮，在內政、軍事、外交等很多方面表現出色。通過石田三成與豐臣秀吉結交。"],["佐竹義廉",51,38,42,61,55,19,64,"武士","佛教","DDDDDDDCD","",1506,1570,1521,[0,0,0,0,0],"佐竹一門，北家義信的次子，由於兄長義住戰死，他繼承了家業。為年輕的宗家義昭效力，與東家義堅和南家義里等人輪流執行佐竹家的家政。"],["佐竹義斯",63,53,46,65,63,19,49,"武士","佛教","CDCDDCDDC","",1538,1587,1553,[100,0,0,0,0],"佐竹一門，北家義廉的嫡子。擔任常陸南部方面的總指揮，領導江戶家等等有實力的國人。而且給上杉家發去書信等等，在外交活動中也有作為。"],["佐竹義憲",43,33,54,56,44,19,37,"武士","佛教","DDDDDDDCD","",1570,1607,1585,[0,0,0,0,0],"佐竹一門，北家義斯的嫡子。義重的三子貞隆入嗣岩城家時他隨行，進入植田城，執行岩城家的家政。後來跟隨主家的轉封。到了出羽秋田。"],["梅津政景",40,16,50,82,73,18,52,"武士","佛教","DDDDDBDCS","",1581,1633,1596,[0,0,0,0,0],"佐竹家臣。歷任勘定奉行與家老，與其兄憲忠皆得到其主義宣深厚的信賴。紀錄當時藩政的「梅津政景日記」，為歷史學的的珍貴史料。"],["岡本禪哲",3,6,80,79,57,18,59,"僧侶","佛教","DDCDADDDA","",1524,1583,1539,[0,0,0,0,200],"佐竹家臣，僧人，為義篤、義昭、義重三代效力的親信。與白河結城家和古河公方文書往來等等，在外交方面起了重要的作用，在佐竹一門佔有重要的地位。"],["岡本顯逸",7,9,70,75,53,18,37,"僧侶","佛教","DDDDCDDCD","",1559,1596,1574,[0,0,0,0,300],"佐竹家臣，禪哲之子，僧人，為佐竹義重和義宣三代效力的親信。在外交方面表現出色，隨同義重之三子貞隆入嗣到岩城家，參與岩城家的執政。"],["小貫賴久",39,34,60,69,65,17,59,"武士","佛教","DDDDDDDCC","",1544,1603,1559,[0,0,0,0,0],"佐竹家臣，作為親信為義重、義宣二代效力，在外交方面發揮了重要作用。與和田昭為、人見藤通一起作為義宣的三奉行表現出色。"],["小野崎從通",18,25,49,33,25,71,68,"武士","佛教","DDCDDDDDD","",1562,1630,1577,[0,0,0,0,0],"常陸的土豪，額田城主。屬於佐竹家，但是自立願望強烈，幾多反抗主家。後來發動叛亂，失敗了，為松平忠輝等人效力過。據說專長繪畫。"],["車斯忠",38,63,68,46,11,18,50,"武士","佛教","CCDDCCDDD","",1552,1602,1567,[0,100,0,0,300],"佐竹家臣，向主公義重進讒言，趕走了和田昭為，成為了義重的親信。關原會戰的時候臣屬上杉家。主家轉封後，企圖奪回水戶城，但是失敗了，被殺。"],["澀江政光",54,14,70,88,80,20,40,"武士","佛教","DDDBCBDAS","",1574,1614,1589,[0,0,0,0,100],"佐竹家臣。受到其主義宣的絕大信賴，盡力於經營秋田藩。靠著獨創的檢地法「澀江田法」，鞏固了藩內的財政。在大阪冬之陣時，戰死。"],["和田昭為",60,28,68,81,39,22,74,"武士","佛教","DDCDBBDDB","",1534,1608,1549,[0,0,100,0,200],"佐竹家臣，屬於一時白河結城家，但是為義昭、義重、義宣三代效力，在內政和外交等方面表現出色。豐臣秀吉出兵朝鮮的時候他留在國中代理政務。"],["江戶忠通",66,68,54,60,34,22,57,"武士","佛教","CCDDDDDDC","",1507,1564,1522,[100,100,0,0,0],"常陸的豪族，水戶城主，通泰之子。開始時跟著佐竹義篤，義篤死後，義昭繼承家業後，他與之敵對，反復抗爭。此後和解，再次從屬了佐竹家。"],["真壁氏幹",61,96,36,7,29,16,72,"劍豪","佛教","BDDDDDDCD","混戰",1550,1622,1565,[400,0,0,0,0],"常陸的豪族，真壁城主。跟從佐竹家，不用刀槍，使用約一丈長的木杖展現武勇，人稱「鬼真壁」，令人畏懼。後來跟隨佐竹家轉封至秋田。"],["大掾貞國",42,34,35,43,40,21,29,"武士","佛教","CDDDDDDDD","",1548,1577,1563,[0,0,0,0,0],"常陸的豪族，府中城主。大掾慶幹死後，佐竹義昭之弟繼承了家業，改名昌幹，但是招致大掾家中的反對，遂返回自己家，貞國繼承了家業。"],["大掾清幹",37,41,16,27,47,23,17,"武士","佛教","DDCDDDDDD","",1573,1590,1588,[0,0,0,0,0],"常陸的豪族，府中城主，貞國之子。由於沒有參加豐臣秀吉的小田原征伐，招致了佐竹義宣的攻擊，自殺了。一族諸人也被招到太田城殺害。"],["小田氏治",40,19,38,42,57,70,70,"高家","佛教","DCDDDDCCD","",1531,1601,1546,[0,0,0,0,0],"小田家第15代當主，政治之子，與北條家聯合，試圖阻止佐竹家南進，但是履戰履敗，居城被奪，最後投降。以後也沒能收復失地，後來為結城秀康效力。"],["小田友治",12,8,50,53,41,71,56,"高家","佛教","DDCDDDCDC","",1548,1604,1563,[0,0,0,0,0],"氏治的庶長子。稱八田左近。為與小田家聯合的北條家效力。主家滅亡後，為豐臣家效力，出兵朝鮮的時候擔任船務奉行，獲得了伊勢的領地。"],["小田守治",29,28,28,45,55,71,53,"高家","佛教","DCDDDDDDC","",1557,1610,1572,[0,0,0,0,0],"小田家第16代當主，氏治之子。一直結為同盟的北條家滅亡後，為結城秀康效力。因為妹妹是秀康的側室，所以跟隨秀康的越前移封，移居到了越前。"],["菅谷勝貞",75,69,77,51,93,70,61,"武士","佛教","CBBDADCDC","",1497,1558,1512,[100,100,100,0,200],"小田家臣，土浦城主。殺死了建築土浦城的豪族若泉五郎左衛門，奪取了土浦城，作為居城。與近鄰的土豪和上杉、佐竹家等在各地作戰。"],["菅谷政貞",67,61,70,44,86,70,60,"武士","佛教","CCDDCBDDD","",1528,1588,1543,[100,100,0,0,100],"小田家臣，土浦城主，勝貞之子，從佐竹家奪去的小田城，與大掾家、宇都宮家等等作戰，很多行動中表現出色，後來跟隨主公氏治臣屬於佐竹家。"],["足利晴氏",33,29,30,65,38,36,52,"高家","佛教","DDCDDDDDD","",1508,1560,1523,[0,0,0,0,0],"古河公方，高基之子。作為足利家的一員，有著關東武士的強大支持，北條家也注意對他採取懷柔態度。後來反抗北條氏康，被幽禁在小田原。"],["足利義氏",49,24,21,40,31,36,41,"高家","佛教","DDDDDDDDD","",1541,1582,1556,[0,0,0,0,0],"古河公方，晴氏之子，在北條家的庇護下長大成人，重返古河城，但是手裏沒有實權。死後，由於古河足利家無後，由女兒創立了喜連川家。"],["梁田晴助",62,54,73,72,84,36,70,"武士","佛教","DDDDCCDDC","",1524,1594,1539,[0,0,0,0,100],"古河足利家臣，關宿城主，高助之子。將企圖打敗北條氏康的主公晴氏幽禁，擁立晴氏之子藤氏。聯合上杉家和武田家與北條家爭鬥。"],["結城政勝",71,58,72,74,49,42,56,"武士","佛教","CDBDBDDDA","",1503,1559,1518,[100,0,100,0,300],"結城家第16代當主，政朝之子。制定了「結成氏新法度」，以強化支配力。聯合向北關東擴張勢力的北條氏康，與佐竹、宇都宮、小田家等持續抗爭。"],["結城晴朝",67,44,86,88,16,41,81,"武士","佛教","BDBCABDCA","",1533,1614,1548,[0,0,100,0,400],"結城家第17代當主，小山高朝的次子。成為伯父政勝的義子。在北條、上杉兩家之間徘徊不定。後來收德川家康的次子秀康為義子。"],["結城朝勝",54,38,68,47,60,42,59,"武士","佛教","DDDDCDDDC","",1569,1628,1584,[0,0,0,0,300],"宇都宮廣綱之次子。成為了結城晴朝的義子，但是後來因為德川家康的次子秀康入嗣結城家，而返回了宇都宮家。以後一直採取反德川、反結城的姿態。"],["結城秀康",78,84,29,53,72,94,33,"武士","佛教","DADBDBCCD","",1574,1607,1589,[0,100,0,100,0],"德川家康的次子，繼承了結城家的家業。關原會戰的時候留在關東，以防備上杉景勝，戰後，得到越前福井75萬石俸祿。據說性格火爆。"],["松平忠直",74,79,21,40,53,93,55,"武士","佛教","DBDBDBDDD","",1595,1650,1610,[0,100,0,100,0],"結城秀康的嫡子。其父死後繼承了家督。有在大阪之陣時，成功阻止了真田幸村軍等事蹟。但之後因為行為不檢點，便遭到貶黜而處流刑。"],["小山高朝",52,36,56,48,40,42,66,"武士","佛教","CDDDDDDCD","",1508,1574,1523,[100,0,0,0,0],"下野的豪族，結城政朝的次子。成為小山政長的義子。靠著兄長結城政勝的後援恢復小山家的勢力。也與北條家聯合，維護領國的安定。"],["小山秀綱",32,45,48,42,47,42,74,"武士","佛教","DDCDDCDDD","",1529,1603,1544,[0,0,0,0,0],"下野的豪族，高朝的嫡子。與弟弟結城晴朝協力，聯合上杉家和北條家，保住了小山家的命脈，但是正當豐臣秀吉征伐小田原時臣屬於北條家，失去了領地。"],["岩上朝堅",39,26,57,76,63,39,38,"武士","佛教","DDDDDDDDC","",1554,1592,1569,[0,0,0,0,0],"結城家臣。舊姓三浦，主公晴朝讓他改姓結城四天王之一的岩上姓。和佐竹義重、田村清顯文書往來等等，在外交方面表現出色。"],["多賀谷重經",57,49,61,39,22,37,60,"武士","佛教","CCDDDDDDC","",1558,1618,1573,[0,100,0,0,0],"結城家臣，下妻城主，政經之子。參加豐臣秀吉的小田原征伐，保全了領地。關原會戰中由於加入西軍，被免職，流浪中死在了近江彥根。"],["多賀谷政廣",29,22,69,71,57,40,58,"武士","佛教","DDDDCDDCD","",1537,1595,1552,[0,0,0,0,200],"結城家臣。作為使者去過佐竹家和宇都宮家等等，在外交方面表現出色。使德川家康的次子秀康入嗣結城家，豐臣秀吉對他的功績給予了獎賞。"],["水谷正村",74,67,60,22,44,35,75,"武士","佛教","DBBDCCDDC","",1521,1596,1536,[0,100,100,0,300],"結城家臣，下館城主，結城四天王之一。主要在下野方面出戰，不斷與宇都宮家抗爭，後來參加了豐臣秀吉的小田原征伐，保全了領地。"],["千葉胤富",65,47,52,63,52,67,52,"武士","佛教","CDCDDDDDC","",1527,1579,1542,[100,0,100,0,0],"千葉家第27代當主，昌胤之次子。周圍的佐竹、里見家都與上杉家聯合，他與北條家聯合。後來招致上杉、結城聯軍的攻擊，但是成功地將他們擊退。"],["千葉邦胤",53,41,36,32,39,63,28,"武士","佛教","DDDDDCDDC","",1557,1585,1572,[0,0,0,0,0],"千葉家第29代當主，胤富的三子。由於反北條家的兄長良胤被廢，他繼承了家業。娶了北條氏政之女。後來被對他懷恨的近臣暗殺了。"],["千葉重胤",39,23,43,53,41,71,57,"武士","佛教","DDDDDDDCD","",1576,1633,1591,[0,0,0,0,0],"千葉家第31代當主，邦胤的嫡子。由於北條氏康之子直重繼承千葉家30代，於是成為人質待在小田原城。小田原陷落後，隱居到下總國。"],["原胤貞",65,54,56,69,55,67,59,"武士","佛教","CBDDDDDDC","",1512,1571,1527,[0,100,0,0,0],"千葉家臣，胤清之子，生實城主。臼井家投降的時候，進入臼井城，執行臼井家的家政。一度被里見家奪去居城，但是後來又奪了回來。"],["原胤榮",60,48,53,57,36,68,53,"武士","佛教","DDBDDDDDD","",1537,1590,1552,[0,0,100,0,0],"千葉家臣，胤貞的嫡子。為利胤、親胤效力。據說和主家有同等的勢力。後來與主家一起從屬了北條家，成為臼井眾的首席家臣。"],["高城胤吉",72,62,46,64,57,67,81,"武士","佛教","CDCDDDDCD","",1484,1565,1499,[100,0,100,0,0],"原家臣，高城家是千葉一族，是原家軍事部門的重臣。建築了小金城作為居城。第一次國府臺會戰的時候，屬於北條家，英勇奮戰，殺了父親和兄長的敵人。"],["高城胤辰",66,55,54,49,47,60,44,"武士","佛教","CDCDDCDCD","",1542,1586,1557,[100,0,0,0,0],"原家臣，胤吉之子。上杉謙信遠征關東的時候，一度跟隨上杉家，但是以後一直傾向北條方。後來得到了栗原六鄉。"],["高城胤則",42,36,39,44,53,67,32,"武士","佛教","DDDDDDDDC","",1572,1604,1587,[0,0,0,0,0],"原家臣，胤臣之子。豐臣秀吉征伐小田原的時候，他防守小田原城，戰敗後閒居在信濃國。後來得到允許為豐臣家效力，但是由於秀吉的死這事不了了之。"],["里見義堯",82,71,80,57,57,33,62,"武士","佛教","BBDDBCABD","",1512,1574,1527,[400,100,0,0,300],"房總的戰國大名。打敗殺死父親實堯的表兄弟義豐，成為當主。國府臺會戰中敗給了北條氏康，但是此後繼續在房總擴大勢力，與北條家戰鬥。"],["里見義弘",74,67,50,60,47,33,48,"武士","佛教","CCBCDDADC","",1530,1578,1545,[100,100,100,0,0],"房總的戰國大名，義堯長子。與上杉謙信結盟，對抗北條家。國府台之戰時，敗於北條軍，但是後來成功恢復勢力。父親死後，與北條家議和。"],["里見義賴",66,60,74,48,29,31,44,"武士","佛教","CCCCCCADD","",1543,1587,1558,[100,0,100,0,100],"房總的戰國大名。義堯次子。強迫里見梅王丸（兄‧義弘之子）出家，自己繼任家督。正木憲時因此事而叛變，在成功弭平叛亂後，終於平定上總。"],["里見義康",51,48,28,46,65,31,30,"武士","佛教","CDDDDDBCC","",1573,1603,1588,[0,0,0,0,0],"房總的戰國大名，義賴之子。豐臣秀吉征伐小田原時，他因為去晚了，只保全了安房一國的領地。後來建築館山城。關原會戰中屬於東軍。"],["里見忠義",27,36,17,49,36,31,28,"武士","佛教","DDDDDDBCD","",1594,1622,1609,[0,0,0,0,0],"安房館山藩主，義康的嫡子，娶了大久保忠鄰的孫女。忠鄰倒臺時，受到波及後被流放在伯耆倉吉。據說「南總里見八犬傳」就是從堅持忠義的8名家臣為藍本的。"],["正木時茂",71,85,44,16,78,33,62,"武士","佛教","SCDDDDADC","",1514,1576,1529,[400,100,0,0,0],"里見家臣，大多喜城主。專長槍術，人稱「槍大膳」。從二次國府臺會戰開始，幾乎參加了里見家的全部會戰，勇名遠近聞名。"],["正木憲時",70,72,39,17,89,24,26,"武士","佛教","BCDDDDADD","",1555,1581,1570,[100,100,0,0,0],"里見家臣，據說是時忠或者弘季之子。成為伯父時茂的義子，繼承了家業。對主公強行繼承家業感到憤恨，發動叛變，但是失敗了，被家臣殺死。"],["正木時忠",68,70,60,47,26,28,58,"武士","佛教","CCDDDDBDC","",1518,1576,1533,[100,100,0,0,0],"里見家臣，勝浦城主。和兄長時茂一起在很多會戰中立下戰功。第二次國府臺會戰的時候，優先考慮保全正木家，遂叛變到北條家，但是後來返回。"],["正木賴忠",47,55,54,58,38,28,71,"武士","佛教","DDDDDDCCD","",1551,1622,1566,[0,0,0,0,0],"里見家臣，時忠之子。父親臣屬北條家時，被作為人質。兄長時通死後，他返回了居城勝浦城。主家被免職後，他去投奔為紀州德川家效力的兒子為春。"],["正木為春",31,30,49,70,52,28,79,"武士","佛教","DDDDDCCDC","",1573,1652,1588,[0,0,0,0,0],"里見家臣，賴忠之子。侄子德川賴宣（胞妹萬夫人之子）成為紀州和歌山藩主的時候，以家老的身分去了紀州。晚年用草子之名寫了「敵人的故事」。"],["土岐為賴",76,72,79,55,44,22,89,"武士","佛教","BDBDBBCCD","",1494,1583,1509,[100,0,100,0,300],"里見家臣，萬喜城主。家中少有的能征慣戰之人，人稱「萬喜少弼」，令人畏懼。第二次國府臺會戰後背叛了里見家，臣屬北條家，與里見家作戰。"],["酒井敏房",69,75,75,58,52,29,66,"武士","佛教","BBDDBCCCC","",1511,1577,1526,[100,100,0,0,200],"里見家臣，東金城主。與正木時茂、土岐為賴一起在里見家以勇猛著稱。第一次國府臺會戰的時候擔任殿軍。後來背叛主家，臣屬北條家。"],["酒井政辰",44,61,58,32,39,29,59,"武士","佛教","DCCDDDCDD","",1544,1603,1559,[0,100,0,0,0],"北條家臣。東金城主。敏房之子。在豐臣秀吉進攻小田原時，籠城於居城中。在主家滅亡後離開居城並退隱。其子孫在德川家擔任旗本。"],["小野忠明",26,102,3,2,14,44,63,"劍豪","佛教","BDDDDDDDD","混戰",1565,1628,1580,[100,0,0,0,0],"劍術家，初仕於里見家，但為修習劍術而周遊各國。後來拜師於一刀流的開宗祖師伊藤一刀齋，並改名為小野忠明。開創出小野一刀流。"],["宇都宮廣綱",66,59,31,66,57,16,37,"武士","佛教","CCDDDDDCD","",1543,1580,1555,[0,100,0,0,0],"宇都宮家第21代當主。尚綱之嫡子。娶佐竹義昭之女而互結同盟。另外，與芳賀高定一同對抗領地內聯合北條家的反宇都宮勢力。據說體弱多病。"],["宇都宮國綱",58,67,57,64,44,17,39,"武士","佛教","DCDDDDDDC","",1568,1607,1580,[0,100,0,0,0],"宇都宮家第22代當主，廣綱的嫡子。參加了豐臣秀吉的小田原徵伐戰，保全了領土。可是，捲入了豐臣家內部的權力鬥爭，被沒收了領地。"],["壬生綱房",50,31,85,78,8,13,76,"武士","佛教","CCDDABDDB","",1479,1555,1494,[0,100,0,0,400],"宇都宮家臣，壬生城主。擔任首席家老。使用各種計謀逼死了主公忠綱、興綱，興綱之子尚綱戰死後，他奪取了宇都宮城。"],["壬生綱雄",42,49,48,36,33,13,61,"武士","佛教","DDCDDDDDC","",1515,1576,1530,[0,0,0,0,0],"宇都宮家臣，壬生、鹿沼城主，綱房的嫡子。他接近北條家，謀求從主家自立，所以被串通宇都宮家的叔父周良招到鹿沼城殺死。"],["壬生義雄",58,60,55,43,21,13,38,"武士","佛教","CDDDDDDCD","",1552,1590,1567,[100,0,0,0,0],"宇都宮家臣，壬生城主，綱雄的嫡子。殺死叔父周良，為父親報了仇。後來屬於了北條家。豐臣秀吉徵伐小田原的時候，防守小田原城，戰後不久即死去。"],["芳賀高繼",49,32,60,72,60,9,66,"武士","佛教","DCDDDDDCC","",1526,1592,1541,[0,0,0,0,0],"宇都宮家臣，高經的次子。因為父親橫死，他逃往益子領地，但是被芳賀高定讓給了家業，遂返回。作為宿老全盤處置家中的內政，外交。"],["芳賀高定",64,51,82,81,84,16,59,"武士","佛教","CDCDACDDB","",1529,1588,1544,[100,0,100,0,300],"宇都宮家臣，益子勝宗之子。芳賀高經死後，繼承了芳賀家。奪回了被壬生家奪去的宇都宮城，作為宿老參與國政，努力恢復主家的勢力。"],["芳賀高武",62,39,51,71,55,15,40,"武士","佛教","DCDDDDDDC","",1572,1612,1587,[0,100,0,0,0],"宇都宮家臣，宇都宮廣綱之三男。繼承芳賀高繼之位。為其兄國綱的得力助手。在主家被貶後，屢次向伊勢內宮供奉祈求復興主家的祈禱文。"],["今泉高光",41,30,58,63,49,12,29,"武士","佛教","DDDDDDDCD","",1568,1597,1583,[0,0,0,0,0],"宇都宮家臣，上三川城主。主張迎接淺野長政的兒子長重作主公國綱的繼承人，與宿老芳賀高武對立。後來招致高武的攻擊，戰敗身死。"],["皆川廣照",36,46,61,65,29,61,79,"武士","佛教","DDDDDDDDC","",1548,1627,1563,[0,0,0,0,0],"下野的豪族，皆川城主，俊宗之子。北條氏康滅亡時，他投降了德川家康。後來成為德川家康六子鬆平忠輝的傅家老，但是因為勸諫忠輝反而被免職。"],["那須資胤",56,45,47,21,31,55,56,"高家","佛教","DCBDDDDDC","",1527,1583,1542,[0,0,100,0,0],"下野的戰國大名，政資的次子。兄長高資橫死後，在大關高增等人的輔佐下繼承的家業。後來與高增等與那須眾對立，招致攻擊，失敗，以退隱為條件和解。"],["那須資晴",68,72,29,35,36,56,53,"高家","佛教","DCSDDCDCD","",1557,1610,1572,[0,100,400,0,0],"下野的戰國大名，資胤的嫡男。薄葉原會戰中大勝宇都宮軍，威名遠近聞名。豐臣秀吉徵伐小田原時，由於他去晚了，被沒收了領地。"],["那須資景",66,61,43,40,52,55,70,"高家","佛教","DCADDDDCD","",1586,1656,1601,[0,100,100,0,0],"下野那須藩主，資晴的嫡子。父親在小田原徵伐戰中去晚了，被免職，他代替父親領受5千石的俸祿。關原會戰中屬於東軍。也參加了大阪之戰，立下軍功。"],["大田原資清",64,27,83,82,30,66,74,"武士","佛教","CDCDADDCB","",1486,1560,1501,[100,0,100,0,400],"那須七黨之一，大田原城主。殺死黑羽城主大關增次，讓兒子高增繼承了大關家，讓女兒作了主公政資的側室等等，樹立了那須家中最大的勢力。"],["大關高增",68,46,87,80,40,66,71,"武士","佛教","CDBDABDDB","",1527,1598,1542,[100,0,100,0,300],"那須七黨之一，大田原資清之子。率領大關、大田原、福原家，聯合伊王野、蘆野家，作為大伯父輔佐主公資晴等等，建立了家中最大的勢力。"],["福原資孝",42,44,69,51,36,55,79,"武士","佛教","DCDDCCDCD","",1535,1614,1550,[0,0,0,0,100],"那須七黨之一，大田原資清之子。父親繼承了被迫隱居的福原資安的家業，他輔佐兄長大關高增。豐臣秀吉的小田原徵伐戰時，他去晚了，被剝奪了領地。"],["福原資保",43,38,58,49,53,55,62,"武士","佛教","DDCDDDDDC","",1571,1633,1586,[0,0,0,0,0],"那須七黨之一，資孝的資子。成為兄長資廣的義子，繼承了家業。關原會戰中屬於東軍。大阪之戰中屬於本多正信作戰，後來擔任了大阪城番。"],["大田原綱清",46,51,75,53,60,66,49,"武士","佛教","DDCDCDDDD","",1540,1589,1555,[0,0,100,0,300],"那須七黨之一，資清的三子。由於兄長高增、資孝自立門戶，他繼承了大田原家。豐臣秀吉徵伐小田原的時候，派遣兒子晴清出迎秀吉。"],["大田原晴清",51,42,70,65,45,66,64,"武士","佛教","DDDDCDDDC","",1567,1631,1582,[0,0,0,0,200],"那須七黨之一，綱清之子。因參加豐臣秀吉的小田原征伐，得以保住所屬領地。關原之戰時隸屬東軍，以蒐集上杉家的情報聞名，戰後因此增加俸祿。"],["佐野宗綱",66,55,32,52,67,11,30,"武士","佛教","DCDDDDDCD","",1556,1586,1571,[0,100,0,0,0],"佐野家第16代當主，昌綱的嫡子。聯合佐竹家與北條家對抗。還進行軍事、經濟兩方面的改革，但是招致了家臣的反感。後來在須花阪戰役中戰死。"],["佐野房綱",56,94,30,19,72,15,43,"劍豪","佛教","BDCDDDDDD","混戰",1558,1601,1573,[100,0,100,0,0],"佐野家臣，昌綱之子。另說是豐綱之子。佐野宗綱死後，由於北條氏忠繼承家督，改仕於豐臣秀吉。被稱為天德寺了伯，據說是劍術名家。"],["山上照久",73,90,44,14,94,10,63,"武士","佛教","CBDDDBDDD","",1542,1605,1557,[100,400,0,0,0],"佐野家臣，佐野四天王之一，人稱道及。取敵人首級無數而號稱家中第一猛將。後來因作武士修行而辭職。關原之戰時，為上杉家而戰。"],["上杉憲政",28,20,19,27,29,37,56,"高家","佛教","DDDDDDDDD","",1523,1579,1531,[0,0,0,0,0],"山內上杉家第20代當主。河越會戰中戰敗，喪失了勢力，被北條軍逼迫，逃往越後。將上杉姓和關東管領職讓給了長尾景虎。禦館之亂中被上杉景勝殺死。"],["長野業正",97,80,91,40,96,37,62,"武士","佛教","SBADADDAD","",1499,1561,1514,[400,100,100,0,400],"山內上杉家臣。主家滅亡後還艱守居城箕輪城，6次擊退了武田信玄的進攻。信玄不得不發出感嘆，「有業正在，上州不是那麼好打的。」"],["長野業盛",72,82,55,31,92,37,18,"武士","佛教","CBCDDDDCD","",1548,1566,1561,[100,100,0,0,0],"山內上杉家臣，箕輪城主，業正之子。父親死後，他繼承了家業。徹底抵抗進攻上州的武田家，死者一千六百多人，負傷數千，最後自殺了。"],["上泉信綱",68,115,42,5,88,41,69,"劍豪","佛教","ADDDDDDDD","混戰",1508,1577,1523,[400,0,0,0,0],"劍術家。起初為長野家效力，主家滅亡後，一度為武田信玄效力，不久為了修練武藝，去浪跡四方，創始了新陰流，弟子有柳生宗嚴等人。"],["小幡憲重",75,65,74,16,81,38,53,"武士","佛教","CBDDBBDCD","",1522,1575,1537,[100,100,0,0,200],"山內上杉家臣。妻子是長野業正之妹，由於家族謀反而去流浪，投靠了武田信玄。為信玄進攻上州作出了貢獻，成為西上野先方眾的首席。據說在長篠會戰中戰死。"],["小幡信貞",74,83,40,29,47,37,51,"武士","佛教","BBDDDDDDC","",1541,1592,1556,[0,400,0,0,0],"武田家臣，重貞的嫡子。作為西上野先方眾的主力表現出色。主家滅亡後，為北條家效力，北條家滅亡後，去投靠上田城主真田昌幸，得到了庇護。"],["長尾憲景",41,40,57,62,41,37,72,"武士","佛教","DDCDDDDCD","",1511,1583,1526,[0,0,0,0,0],"山內上杉家臣。摠社長尾家出身，由於白井長尾家當主景誠被殺，他繼承了家業。主家滅亡後，為上杉謙信效力，謙信死後，屬於了北條家。"],["長尾景長",43,24,52,68,63,39,42,"高家","佛教","DDDDDDDDC","",1527,1569,1542,[0,0,0,0,0],"足利長尾家當主，為山內上杉家效力。起初接受了上杉憲當（憲政）的偏諱，取名「當長」。與由良成繁一起作為上杉、北條兩家的中間人，表現活躍。"],["沼田顯泰",45,36,49,60,12,21,64,"武士","佛教","DDCDDDDCD","",1510,1574,1525,[0,0,0,0,0],"上野的豪族。建築沼田城作為居城，投降了上杉謙信的關東侵襲軍。後來由於殺死嗣子朝憲、擁立末子景義，而招致家臣的反感，被趕走。"],["沼田景義",63,60,56,6,37,24,29,"武士","佛教","DCDCDCDDD","",1552,1581,1567,[0,100,0,0,0],"上野的豪族，顯泰之子。父親殺死異母兄長朝憲而招致家臣反對，與父親一起逃到會津。後來起兵欲奪回沼田城，但是被真田昌幸謀殺。"],["鈴木重則",64,75,23,15,84,60,42,"武士","佛教","CDDBDDDCD","",1547,1589,1562,[100,0,0,100,0],"真田家臣，名胡桃城代。招致北條家臣豬俁邦憲的奇襲，失敗，自殺了。此次事件違反了私戰的禁令，給了豐臣秀吉征伐小田原的口實。"],["由良成繁",60,56,74,65,53,8,72,"武士","佛教","CDBDABDDC","",1506,1578,1521,[0,0,100,0,200],"橫瀨由良家第8代當主，泰繁的嫡子，改姓由良。屬於上杉家，對抗北條、武田家的侵略。後來屬於北條家，促成了北條家與上杉家的同盟。"],["上田朝直",40,41,56,68,31,12,88,"武士","佛教","CDCDDDDDC","",1494,1582,1509,[0,0,0,0,0],"扇谷上杉家家臣。投降了北條家的武藏侵襲軍，以後為北條家效力。作為別國眾成為鬆山城主，使用獨自的權力，不受主家束縛。"],["上田憲定",32,25,34,66,34,12,59,"武士","佛教","DDCDDDDDC","",1536,1595,1551,[0,0,0,0,0],"北條家臣，朝直的次子。和父親、兄長長則一樣，努力經營鬆山城。豐臣秀吉征伐小田原的時候，他守衛小田原城，城池陷落後被趕走。"],["藤田信吉",61,59,65,48,19,76,57,"武士","佛教","CCDDDCDCD","",1559,1616,1574,[0,0,0,0,0],"武田家臣，主家滅亡後為上杉家效力，進攻佐渡等行動中表現活躍。關原會戰前離開了上杉家，在上杉、德川家之間進行調停工作，但是失敗了，削髮為僧。"],["太田康資",69,78,32,25,41,31,50,"武士","佛教","CCDDDDDCD","",1531,1581,1546,[100,0,0,0,0],"北條家臣，資高之子。後來屬於里見家，參加了第二次國府臺會戰。與武田家、上杉家聯絡，外交方面也很活躍。據說是力敵三十人的豪傑。"],["太田重正",40,33,43,47,66,31,49,"武士","佛教","DDDCDDDDC","",1561,1610,1576,[0,0,0,0,0],"德川家臣，康資之子。起初與父親一起屬於里見家。父親死後，投靠了屬於佐竹家的太田資正。後來為德川家康效力，妹妹作了家康的側室。"],["太田資正",88,74,78,50,86,38,69,"武士","佛教","ABCDBADAD","",1522,1591,1537,[400,100,100,0,100],"扇谷上杉家臣，岩付城主。資賴之次男。主家滅亡後，歸屬於上杉家及佐竹家，終其一生皆在對抗北條家。於豐臣秀吉征伐小田原之際，親訪秀吉之本陣。"],["太田氏資",60,63,54,48,72,36,25,"武士","佛教","CCDDDCDDD","",1542,1567,1557,[100,0,0,0,0],"北條家臣，武藏岩付城主，資正的嫡子。由於被父親疏離，趕走了父親和弟弟，成為岩付城主。三船山會戰的時候，擔任殿軍與里見軍作戰，戰死了。"],["太田氏房",27,31,30,54,53,82,27,"武士","佛教","DDDDDDDDC","",1565,1592,1580,[0,0,0,0,0],"北條家臣，岩付城主。北條氏政之三男。娶太田氏資之女，繼任家督。豐臣秀吉征伐小田原時，居城被圍。戰後，與兄‧氏直一同上高野山。"],["梶原政景",75,67,77,65,37,38,75,"武士","佛教","BCCBAADAD","",1548,1623,1563,[100,100,0,100,200],"佐竹家臣，太田資正的次子。手這阪會戰中打敗小田氏治，成為小田城主。跟隨主家轉封至秋田，但是後來轉而為越前福井藩主結城秀康效力。"],["宮城政業",38,35,53,57,33,67,94,"武士","佛教","DDCDDCDDC","",1495,1589,1510,[0,0,0,0,0],"岩付太田家臣，北條氏政的三子氏房入嗣岩付太田家後，屬於北條家。孫子泰業擔任馬上奉行，主家滅亡後，和主公氏房等人一起上了高野山。"],["成田長泰",56,50,60,52,13,65,78,"武士","佛教","CDDDDCDCD","",1508,1586,1523,[0,0,0,0,0],"山內上杉家臣，忍城城主。主家滅亡後，屬於了上杉謙信。可是，謙信參拜鶴岡八幡宮的時候，他惹得謙信生氣，因此背叛，此後臣屬北條家。"],["成田氏長",69,60,67,63,57,69,53,"武士","佛教","CDDDDDDDC","",1542,1595,1557,[0,0,0,0,0],"北條家臣，忍城城主，長泰的嫡子。豐臣秀吉征伐小田原的時代，他守衛小田原城。居城抵擋住了石田之成的水攻，沒有陷落，主家滅亡後，為蒲生氏鄉效力。"],["成田長忠",45,51,38,58,60,72,69,"武士","佛教","DDDDDDDDC","",1547,1616,1562,[0,0,0,0,0],"北條家臣，忍城城主，長泰的次子。主家滅亡後，為蒲生氏鄉效力。兄長氏長死後，他繼承了遺留的領地。關原會戰中屬於了東軍。也參加了大阪之戰。"],["成田泰季",23,26,40,52,46,70,74,"武士","佛教","DDDDDDDDD","",1516,1590,1531,[0,0,0,0,0],"成田家臣，親泰之子。擔任忍城城代。1566年，兄‧長泰宣佈將家督讓給長忠（長泰之次男）之際，聯合其他重要大臣反對此事。"],["北條氏康",95,79,94,107,82,82,56,"武士","佛教","SBCCADBSS","",1515,1571,1530,[400,100,100,0,300],"後北條家第3代當主，氏綱的嫡子。與武田信玄、上杉謙信等強豪分庭抗禮，建立了關東第一大王國。智勇兼備的名將，作為戰國時期第一民政家也很聞名。"],["北條氏政",75,51,69,83,35,77,52,"武士","佛教","BCCDDDCAA","",1538,1590,1553,[100,100,0,0,0],"後北條家第4代當主，氏康之嫡子。得到優秀的弟弟們以及家臣團的支持，於是確保了北條家的地位。對抗豐臣秀吉的征伐小田原軍失敗而自裁。"],["北條氏直",57,42,35,56,75,86,29,"武士","佛教","DDDCDDCCD","",1562,1591,1577,[0,0,0,0,0],"後北條家第5代當主，氏政的嫡子。不響應豐臣秀吉的上京命令，招致了秀吉的小田原征伐軍的攻擊。守城三個月後投降，上了高野山，病死在那裏。"],["北條氏照",79,74,70,62,77,77,50,"武士","佛教","CBDCDBBCD","",1540,1590,1555,[100,100,0,0,0],"北條家臣，氏康之次男，於軍事外交兩方面輔佐其兄氏政，主要負責攻略下野與下總。於小田原失陷後，依豐臣秀吉之命，與其兄一起自裁。"],["北條氏邦",74,77,62,56,41,87,56,"武士","佛教","BCBCDDCBC","",1541,1597,1556,[100,0,100,0,0],"北條家臣，氏康之三男。建立與上杉家的和睦關係。於豐臣秀吉征伐小田原中，提倡出擊，不被採納。被前田利家攻陷居城缽形城後，投降。"],["北條氏規",73,60,74,70,55,86,55,"武士","佛教","CCBBBDBBB","",1545,1600,1560,[0,0,100,0,100],"北條家臣，氏康之四男。在今川家當人質的時候，結識有相同境遇的德川家康。豐臣秀吉征伐小田原之際，堅守韭山城。被家康說服而開城。"],["北條幻庵",24,2,77,84,69,82,96,"僧侶","佛教","DDDDABDAA","",1493,1589,1508,[0,0,0,0,200],"早雲的三子，為北條家五代效力。擔任箱根權現的第四十世別當。主公氏康之女嫁到吉良家的時候，他贈與了心得書「幻庵心得」。"],["北條綱成",94,94,79,50,89,82,72,"武士","佛教","ASDDBBADC","",1515,1587,1530,[400,400,0,0,300],"北條家臣，福島正成之子。父親死後，投靠北條氏綱，娶了氏綱之女，成為北條家族之人。在河越會戰等戰役中表現活躍，其旗號被稱為「地黃八幡」，令人畏懼。"],["北條氏繁",72,78,66,47,63,82,42,"武士","佛教","CBDCDDBDC","",1536,1578,1551,[100,100,0,0,0],"北條家臣，綱成之子。家中頭號猛將，武勇優秀，不在其父之下。擔任玉繩城主，擊退上杉謙信的關東侵襲軍等等，屢立戰功。"],["北條氏勝",66,56,26,32,25,87,52,"武士","佛教","DCDDDDCDD","",1559,1611,1574,[0,100,0,0,0],"北條家臣，氏繁之子。父親死後，成為玉繩城主。豐臣秀吉征伐小田原的時候，守衛中山城，但是城池陷落，此後守衛居城，最後投降了，戰後為德川家效力。"],["松田憲秀",21,11,76,73,5,17,50,"武士","佛教","DDCDCDDCB","",1540,1590,1555,[0,0,0,0,300],"北條家臣。擔任首席家老。豐臣秀吉征伐小田原的時候，主張堅守小田原城，被採納。後來想叛變到秀吉方，但是失敗了，戰後被迫自殺。"],["大道寺盛昌",39,27,47,79,60,94,83,"武士","佛教","DDCDDDDBB","",1472,1555,1487,[0,0,0,0,0],"北條家臣。歷任鎌倉代官、河越城代。大道寺家人稱「御由緒家」，世代為北條家效力，始祖是與北條早雲一起去駿河的太郎（發專）。"],["大道寺政繁",53,51,67,86,38,90,57,"武士","佛教","DDDDDDCAA","",1533,1590,1548,[0,0,0,0,0],"北條家臣，河越城主。發揮行政方面的才能，為河越城下的繁榮做出了貢獻。投降了豐臣秀吉的小田原征伐軍，由於負責過帶路，秀吉迫他自殺了。"],["遠山綱景",63,66,54,60,52,84,70,"武士","佛教","CDBDDDACD","",1494,1564,1509,[100,0,0,0,0],"北條家臣，江戶眾首席。請連歌師宗牧到居城江戶城，舉行連歌會。第二次國府臺會戰的時候擔任先鋒，與里見軍多次激戰，戰死了。"],["垪和康忠",29,28,65,71,66,90,53,"武士","佛教","DDDDDCCDC","",1542,1595,1557,[0,0,0,0,0],"北條家臣，擔任會議眾。締結越相同盟的時候擔任使者，作為廄橋城代支配東上野等等，在內政、外交方面表現活躍。主家滅亡後，隱居在伊豆。"],["清水康英",70,68,41,21,72,83,59,"武士","佛教","CDCCDDSCD","",1532,1591,1547,[0,0,100,0,0],"北條家臣，伊豆眾首席。作為氏康的親信，在各地立下戰功。豐臣秀吉征伐小田原的時候，他守衛下田城，與豐臣水軍激戰，最後投降。"],["石卷康敬",28,40,40,69,53,91,79,"武士","佛教","DDCDDDDCD","",1534,1613,1549,[0,0,0,0,0],"北條家臣。御馬迴眾之一，擔任會議眾。主公氏直反對上京的時候，他為了辯解去見豐臣秀吉。主家滅亡後，他為德川家效力。"],["板部岡江雪齋",4,3,82,81,33,87,72,"僧侶","佛教","DDDDBDDBA","",1537,1609,1552,[0,0,0,0,300],"北條家臣。擔任右筆會議眾。與德川家康的講和交涉、與豐臣秀吉的調停等等，在對外交涉方面發揮才能。主家滅亡後，為秀吉效力。"],["豬股邦憲",52,69,68,3,28,78,41,"武士","佛教","BDDDCBCDD","",1549,1590,1564,[100,0,0,0,0],"北條家臣。仕於北條氏邦，擔任沼田城代。擅自奪取真田昌幸的支城‧名胡桃城，因此給豐臣秀吉進行征伐小田原的藉口，戰後，被處以釘刑。"],["安藤良整",8,6,33,87,60,87,60,"武士","佛教","DDDDDDDBS","",1534,1594,1549,[0,0,0,0,0],"北條家臣。負責擔任出納方面的奉行，是家中政務之中心人物。他提出了北條家領國的公定升「安藤升」，對主家的發展貢獻極大。"],["梶原景宗",71,62,46,9,65,95,57,"海賊","佛教","CDCBDDSDD","",1533,1590,1548,[0,0,100,100,0],"北條家臣。被北條氏康從紀伊召喚而來，帶領水軍。在與里見家的會戰中相當活躍。主家滅亡後，跟隨舊主氏直前往高野山。氏直死後，便回到紀伊。"],["風魔小太郎",40,85,90,5,44,82,79,"忍者","佛教","CBCDSBDDD","",1537,1616,1552,[400,100,0,0,400],"相州亂波的首領。為收集情報及擾亂敵方而多方奔走，暗中協助北條家的政略。傳聞此人身長七尺二吋，雙目直豎，嘴裏叉出四顆長牙。"],["今川義元",85,70,79,89,44,41,41,"高家","佛教","BDACBDCCA","",1519,1560,1534,[100,0,400,0,200],"今川家第9代當主。打敗異母兄長玄廣惠探，繼承了家業。結成甲相駿三國同盟，消除了後顧之憂，可是上京都的途中，在桶狹間招致了織田信長的奇襲，喪命。"],["今川氏真",10,6,8,70,37,41,76,"高家","佛教","DDDDDDDDC","",1538,1614,1553,[0,0,0,0,0],"今川家第10代當主，義元的嫡男。父親死後，繼承了家業。執迷於蹴鞠與和歌，整日無所作為。結果被德川家康和武田信玄趕出了領國。"],["關口氏廣",23,18,60,63,65,43,39,"高家","佛教","DDCDDDDDC","",1523,1562,1538,[0,0,0,0,0],"今川家臣，瀨名氏俊子。擔任用宗城主。娶今川義元之妹。女兒‧瀨名（築山殿）嫁給德川家康。後來奉其主‧氏真之命，被迫自殺。"],["太原雪齋",87,66,98,96,60,29,59,"僧侶","佛教","ACSDSACBA","",1496,1555,1511,[400,0,400,0,400],"今川家臣，擔任執權。小豆阪會戰中打敗織田軍，促成甲相駿三國同盟等等，對主家的政治、文化、經濟、軍事、外交各方面都作出了重要貢獻。"],["朝比奈信置",65,69,48,23,41,50,54,"武士","佛教","DCDDDCDCD","",1528,1582,1543,[0,100,0,0,0],"今川家臣。小豆阪戰役等行動中立下了戰功。主家滅亡後為武田信玄效力，成為駿河先方眾。武田家滅亡的時候，居城庵原館招致進攻，戰敗，自殺了。"],["朝比奈泰能",70,59,52,56,57,41,50,"武士","佛教","BDBDDDDCC","",1507,1557,1522,[100,0,100,0,0],"今川家臣，擔任掛川城主。1548年的小豆阪會戰中輔佐太原雪齋打敗織田信秀的大軍等等，作為今川家的西方侵襲軍的先鋒表現活躍。"],["朝比奈泰朝",74,71,58,24,96,41,52,"武士","佛教","BACDDDBCD","",1530,1582,1545,[100,100,100,0,0],"今川家臣，泰能之子。將被趕出駿河的主公氏真接到了居城掛川城，與德川軍作戰。經過5個月的防守，終於開城投降，與氏真一起逃往駿河。"],["安倍元真",54,50,58,35,53,43,74,"武士","佛教","CDDDDDDDC","",1513,1587,1528,[0,0,0,0,0],"今川家臣。和岡部正綱一起守衛主家的居城駿府城，但是敗給了武田信玄的駿河侵襲軍，撤退到本貫地安倍。以後屬於德川家，在各地與武田軍作戰。"],["天野景貫",58,46,53,40,22,42,63,"武士","佛教","DDCDDDDDD","",1532,1595,1547,[0,0,0,0,0],"今川家臣，犬居城主。田原本宿的會戰中立下軍功。主家滅亡後，為武田家效力，與德川家作戰。武田家滅亡後屬於北條家，與佐竹家作戰，立下軍功。"],["井伊直政",93,90,72,75,75,90,41,"武士","佛教","BADABBDAB","",1561,1602,1576,[100,400,0,100,200],"德川四天王之一，直親之子。統一穿紅色軍裝的軍兵被稱為「赤鬼」，令人恐懼，經常爭作先鋒。關原會戰中追擊島津軍，殺死了島津豐久。"],["井伊直孝",77,75,59,76,69,91,69,"武士","佛教","CBDBDBDCC","",1590,1659,1605,[100,100,0,100,0],"德川家臣，直政的次子。取代體弱多病的兄長直繼繼承了家業，成為近江彥根藩主。參加了大阪夏季之戰，擊敗了長宗我部盛親、木村重成兩軍。"],["飯尾連龍",41,30,46,32,31,44,39,"武士","佛教","DDDDDDCDC","",1526,1565,1541,[0,0,0,0,0],"今川家臣，曳馬城主。桶狹間會戰後，叛變到了德川家，因此招致了主公氏真的攻擊，戰敗，雙方和解了。後來被氏真叫到駿府城，在同地被謀殺。"],["鵜殿長持",25,20,50,50,63,42,44,"高家","佛教","DDCDDDDDC","",1513,1557,1528,[0,0,0,0,0],"今川家臣，上之鄉城主。娶今川義元妹。鵜殿家為藤原實方後裔，據說鎌倉時代被拔擢為紀伊新宮的別當之子，統領西郡（蒲郡）。"],["鵜殿長照",56,58,34,31,55,42,29,"高家","佛教","DDCDDDDDD","",1533,1562,1548,[0,0,0,0,0],"今川家臣，長持之子。桶狹間會戰後，三河的武將逐漸到了德川家，他是唯一留在今川方的。因此，招致一心要平定三河的德川軍的攻擊，戰敗身死。"],["鵜殿氏長",24,7,23,38,20,27,75,"高家","佛教","DDDDDDDDD","",1549,1624,1564,[0,0,0,0,0],"今川家臣，長照之子。父親戰死的時候，他被德川家康俘虜，去駿府城交換家康的妻子和孩子。主家滅亡後屬於德川家，參加了長篠等會戰。"],["岡部正綱",61,44,52,63,37,26,41,"武士","佛教","CDDDDDDDC","",1542,1583,1557,[0,0,0,0,0],"今川家臣。主家滅亡後為武田家效力，成為清水城主。作為駿河先方眾，參加了三方原會戰等。武田家滅亡後，為德川家效力，為平定甲斐作出了貢獻。"],["岡部長盛",40,49,37,59,41,16,64,"武士","佛教","DDDDDDDDC","",1568,1632,1583,[0,0,0,0,0],"德川家臣，正綱之子。長久手會戰等戰役中立下戰功，主公家康進入關東的時候，在上總、下總獲得1萬2千石的俸祿。後來領受丹波龜山2萬石俸祿。"],["岡部元信",76,73,45,17,67,42,54,"武士","佛教","BCDDDCCCD","",1527,1581,1542,[100,100,0,0,0],"今川家臣。桶狹間會戰中把主公義元的首級帶回了駿河。主家滅亡後，為武田家效力，成為高天神城主，但是招致了德川家康的攻擊，城池陷落，戰死了。"],["奧平貞能",48,42,49,48,40,68,61,"武士","佛教","CDCDDDDDD","",1537,1598,1552,[0,0,0,0,0],"今川家臣。桶狹間之戰後，改仕德川家。曾參與攻打掛川城以及姊川之戰。曾投靠武田信玄，信玄死後改投德川家。活躍於長篠之戰。"],["奧平信昌",67,77,75,22,52,68,60,"武士","佛教","BDBCCDDCD","",1555,1615,1570,[100,0,0,100,200],"德川家臣，貞能之子。曾投靠武田信玄，信玄死後，改投德川家。長篠之戰時，死守長篠城而取得重大勝利。因為這項功績，娶得家康之女‧龜。"],["葛山氏元",19,17,39,68,31,43,50,"武士","佛教","DDDDDDCDB","",1524,1574,1539,[0,0,0,0,0],"今川家臣，葛山城主。減免家臣的年俸、保護領地內社寺等等，在自己領地內實施獨自的政策。主家滅亡後沒落了，武田信玄的六子氏貞繼承了家業。"],["久能宗能",47,43,62,57,33,17,82,"武士","佛教","DDDDDDDCD","",1527,1609,1542,[0,0,0,0,0],"今川家臣，久能城主。主家滅亡前，透過德川家臣高力清長介紹，改投靠家康。家康關東入國之時，成為佐倉城主，後來則又回到久能城。"],["菅沼定盈",55,68,57,54,46,44,61,"武士","佛教","CDBDDDDCD","",1543,1604,1558,[100,0,100,0,0],"德川家臣，野田城主。起初屬於今川家。武田家玄進攻三河的時候，家族中多數人都歸順了信玄，他還一直屬於德川家，被信玄攻下了居城。"],["御宿政友",71,73,6,3,40,3,48,"武士","佛教","CDDCDDCDD","",1567,1615,1582,[100,0,0,100,0],"北條家臣。通稱為勘兵衛。仕奉過今川、武田家後，改仕於結城秀康。但於秀康之子‧忠直執掌時，出走而投奔大阪城，於大阪夏之陣時戰死。"],["德川家康",95,89,94,100,85,90,74,"武士","佛教","SCDBASCAS","治療",1542,1616,1555,[400,100,0,100,300],"江戶幕府的創始人，廣忠之子。桶狹間會戰後自立。通過與織田家的同盟，從屬於豐臣家來擴大勢力。關原會戰中取得勝利，成為征夷大將軍。"],["松平信康",83,85,59,51,80,90,20,"武士","佛教","BCDBDCCDC","",1559,1579,1567,[100,100,0,100,0],"德川家康之長男。娶織田信長之女‧五德，為人剛勇豪邁，頗受厚望。後來信長懷疑他與武田家私通，奉父命自殺。"],["德川秀忠",21,18,83,84,29,78,53,"武士","佛教","DDDDAADDA","",1579,1632,1594,[0,0,0,0,300],"家康的三子。關原會戰的時候，被真田昌幸阻止了從中山道的進軍。可是，父親看中他穩重老實的一面，他成為了江戶幕府2代將軍。"],["松平忠吉",61,70,32,59,66,85,27,"武士","佛教","DCBADCCDC","",1580,1607,1595,[0,0,100,100,0],"德川家康的四子。關原會戰中和岳父井伊直政一起挑起戰端。負傷的情況下還打敗島津義弘軍等等，屢立軍功，戰後，得到尾張清洲62萬石俸祿。"],["松平忠輝",80,82,63,8,76,94,91,"武士","佛教","BCCBDAACD","",1592,1683,1607,[100,100,0,100,0],"德川家康的六子。因為容貌醜陋，自幼被父親疏遠。長大後領受越後高田75萬石俸祿，大阪之戰中遲到，被懷疑與豐臣家串通，戰後被免職。"],["酒井忠次",86,78,64,73,69,88,69,"武士","佛教","ACACCDCCB","",1527,1596,1542,[100,100,100,0,100],"德川四天王的首席，擔任過主公家康的養育工作。家康長大後，他率領東三河眾轉戰各地，立下許多軍功。其才能也得到過豐臣秀吉的稱讚。"],["酒井家次",53,46,44,53,60,88,54,"武士","佛教","DDDDDDDDC","",1564,1618,1579,[0,0,0,0,0],"德川家臣，忠次的嫡男。接受了主公家康的偏諱，家康進入關東的時候他成為臼井城主。在大阪夏季戰役中表現出色，立下大功，被封賞越後高田10萬石俸祿。"],["酒井忠世",33,14,78,83,63,92,64,"武士","佛教","DDDDBDDDB","",1572,1636,1587,[0,0,0,0,200],"德川家臣。大阪冬季、夏季戰役中擔負全軍的參謀，後來和土井利勝、青山忠俊一起負責三代將軍家光的教育工作，擔當幕府的中樞角色，也擔任過老中。"],["酒井忠勝",24,20,70,86,60,82,75,"武士","佛教","DDDDCDDDS","",1587,1662,1602,[0,0,0,0,0],"德川家臣。第一次參加關原會戰時，為家康、秀忠、家光、家綱四代將軍效力，擔負老中、大老，在內政、外交各方面表現出色。被家綱評價為“第一名臣”。"],["本多忠勝",91,97,74,60,94,90,62,"武士","佛教","ASDCBBDBD","乘崩",1548,1610,1563,[100,400,0,0,200],"德川四天王之一。家中頭號猛將，評價比家康還高，慣使名槍“蜻蛉切”，據說參加過五十七次會戰，從未受傷。"],["本多忠政",64,54,58,62,73,91,56,"武士","佛教","CCDCDDDDC","",1575,1631,1590,[0,100,0,0,0],"德川家臣，忠勝的嫡男。參加過征伐小田原、關原會戰、大阪戰役等，領受播磨姬路15萬石俸祿，嫡男忠刻與豐臣秀賴的遺孀千姬結婚。"],["本多忠朝",72,75,54,27,68,92,33,"武士","佛教","DBDCDDDDD","",1582,1615,1597,[0,100,0,100,0],"德川家臣，忠勝的次子。參加了關原會戰，戰後領受上總大多喜5萬石俸祿。大阪夏季戰役中擔任天王寺口的先鋒，從正面突入毛利勝永軍，陣亡。"],["本多重次",66,60,27,72,78,89,67,"武士","一向宗","BDBCDDDDB","",1529,1596,1544,[100,0,100,0,0],"德川家臣，擔任岡崎奉行，外號“鬼作左”。豐臣秀吉之母大政所成為德川家人質的時候，因為過於怠慢而得罪了秀吉，被幽禁處分。"],["本多正信",20,6,101,95,53,90,78,"武士","一向宗","DDDDSSDBA","",1538,1616,1557,[0,0,0,0,600],"德川家臣。投身三河一向起義，背叛主家，流浪諸國之後返回。發揮其在行政和謀略方面的才能，主公家康稱其為“友”。"],["本多正純",25,13,91,92,50,85,72,"武士","佛教","DDDDABDCA","",1565,1637,1580,[0,0,0,0,400],"德川家臣，正信的嫡男。在駿幕城職任職務，與金地院崇傳一起在內政、外交方面表現出色，領受下野宇都宮15萬石俸祿，後來得罪了秀忠，被罷免。"],["榊原康政",90,83,51,46,81,90,58,"武士","佛教","ABCCDCCCD","",1548,1606,1563,[100,100,100,0,0],"德川四天王之一。高舉“無”旗馳騁在戰場上，在各地建立了卓著戰功，晚年，被推舉作老中，以“老臣爭權乃亡國之兆”為由推辭。"],["石川數正",72,51,80,85,38,96,59,"武士","佛教","CDADAADCB","",1533,1592,1548,[0,0,100,0,200],"德川家臣，擔任家老。率領西三河眾，表現出色，小牧長久手會戰後投奔到豐臣家，因此，德川家三河以來的軍制改為了武田流。"],["石川康長",16,24,38,49,47,96,84,"武士","佛教","DDCDDDDDD","",1558,1642,1573,[0,0,0,0,0],"德川家臣，數正之子。跟隨父親離開主家，投奔到豐臣家。父親死後，他繼承信濃松本6萬石俸祿。關原之戰中屬於東軍，後來因為領地隱匿之罪被免職。"],["石川家成",55,62,59,60,58,89,75,"武士","佛教","CDCDDCDCD","",1534,1609,1549,[0,0,100,0,0],"德川家臣，數正的叔父。在三河一向起義平定戰役中立下戰功。今川家滅亡後，就任掛川城主。晚年領受美濃大垣5萬石俸祿，被評價為對家康忠誠不二。"],["大久保忠世",73,76,70,25,86,94,62,"武士","佛教","BDDCCDDCD","",1532,1594,1547,[100,0,0,100,200],"德川家臣，忠員的長子。參加過三方原會戰，長篠會戰等許多會戰，其勇敢和性格和出眾的戰功，連織田信長和豐臣秀吉也給予其高度的評價。"],["大久保忠鄰",44,25,20,77,68,80,75,"武士","佛教","CDDCDDDDB","",1553,1628,1568,[0,0,0,0,0],"德川家臣，忠世的嫡男。擔任德川秀忠的付家老，本來得到秀忠及直參旗本的信賴，但是後來由於政敵本多正信的拆臺而被免職。"],["大久保忠佐",71,79,61,18,78,94,76,"武士","佛教","BDDDDCDCD","",1537,1613,1552,[0,0,0,0,0],"德川家臣，忠員的次子。與兄長忠世一起在各地屢立戰功。其剛勇連織田信長也讚賞不已。關原會戰後，領受駿河沼津二萬石俸祿。"],["鳥居元忠",70,82,40,6,97,90,61,"武士","佛教","BDCDDDDDD","",1539,1600,1554,[100,0,100,0,0],"德川家臣。關原會戰的時候受主公家康之命守衛伏見城，經過13天的攻防，最後與守城兵士一起戰死，其忠節被稱讚為“三河武士之鑑”。"],["服部半藏",56,91,88,1,95,90,54,"忍者","佛教","BDBDSADDD","",1542,1596,1557,[400,0,0,0,400],"德川家臣，半三保長之子。繼承父親的秘密工作，主公家康去伊賀的時候，他負責警衛，平安護送回國。外號“鬼半藏”。"],["平岩親吉",50,43,58,76,89,90,69,"武士","佛教","CDDCDDDDC","",1542,1611,1557,[0,0,0,0,0],"德川家臣。性格溫厚，得到主公家康的極大信賴，擔任家康長子松平信康的傅役，信康自殺後，擔任家康九子義直的傅役。"],["渡邊守綱",62,93,15,4,69,92,78,"武士","一向宗","SDDCDCDDD","",1542,1620,1557,[400,0,0,0,0],"德川家臣。轉戰各地，屢立戰功，外號“槍半藏”，關原會戰中作為旗本參戰，晚年成為尾張德川家的家老，輔佐當主義直。"],["青山忠成",40,30,54,68,58,80,62,"武士","佛教","DDDDDDDDB","",1551,1613,1566,[0,0,0,0,0],"德川家臣。擔任德川秀忠的傅役，關原會戰後，與內藤清成等人一起擔任江戶奉行、關東總奉行。可是，後來得罪了主公家康，下野。"],["板倉勝重",14,10,78,90,75,92,79,"僧侶","佛教","DDDDBDDCS","",1545,1624,1560,[0,0,0,0,100],"德川家臣。本來是僧侶，因為父親和弟弟戰死，才還俗繼承家業。擔任駿府和江戶奉行後，成為京都所司代，負責監視西部諸大名。"],["伊奈忠次",2,3,13,93,45,81,60,"武士","一向宗","DDDDDDDBA","",1550,1610,1565,[0,0,0,0,0],"德川家臣。在其主‧家康身旁參與民政規劃、實行關東全土的檢地與治水，對建立江戶幕府的經濟基礎貢獻頗巨。這種治理地方的方法被稱為「伊奈流」。"],["土井利勝",13,16,73,87,63,81,71,"武士","佛教","DDDDBDDDA","",1573,1644,1588,[0,0,0,0,200],"德川家臣，水野信元之子。也有說法是德川家康的私生子，為秀忠和家光兩代將軍效力，歷任老中、大老等，為江戶幕府的基礎安定作出了很大貢獻。"],["內藤清成",34,36,60,77,55,80,53,"武士","佛教","DDCDDDDDB","",1555,1608,1570,[0,0,0,0,0],"德川家臣。擔負主公家康的侍從，得到家康的信賴，歷任秀忠的傅役和關東總奉行等。可是後來得罪了家康，被幽禁。"],["牧野康成",60,54,56,39,58,91,54,"武士","佛教","CCDCDDCCD","",1555,1609,1570,[100,0,0,0,0],"德川家臣，牛久保城主。關原會戰中屬於德川秀忠軍，上田城進攻中奮勇作戰，但是違反了軍令，被免職，後來被饒恕，但是因健康問題退隱。"],["山口重政",31,38,49,22,33,81,71,"武士","佛教","DDDDDDDDD","",1564,1635,1579,[0,0,0,0,0],"德川家臣。開始時為織田家臣佐久間正勝效力，正勝倒臺後為織田信雄效力，信雄免職後，接受了家康的邀請，不過，得罪了家康被免職。"],["斯波義銀",12,10,21,27,36,22,60,"武士","佛教","DDCDDDDDD","",1540,1600,1555,[0,0,0,0,0],"尾張斯波家第15代當主，義統的嫡男。父親被織田信友殺害後，他依靠織田信長與信友作戰，後來與信長敵對而被流放，浪跡各地。"],["毛利長秀",60,53,32,33,51,18,52,"武士","佛教","CDDDDDDCD","",1541,1593,1556,[0,0,0,0,0],"織田家臣。斯波義統的次男。轉戰各地，平定信濃後，領有信濃伊那郡。本能寺之變後，隸屬於豐臣秀吉麾下，參加九州征伐等役，再度領有信濃伊那郡。"],["津川義冬",36,22,49,60,43,18,41,"武士","佛教","DDCDDDDDD","",1543,1584,1558,[0,0,0,0,0],"織田家臣，斯波義統之三男。任織田信雄家老，擔任松島城主。於小牧長久手合戰之前，因豐臣秀吉的計謀，與岡田重孝等人在長島城被殺。"],["小牧源太",41,75,50,10,66,71,45,"武士","佛教","ACCDDDDDD","",1527,1572,1542,[100,0,0,0,0],"齋藤家臣。被稱做美濃第一的使槍好手。在長良川會戰時，站在義龍那方且取下了道三的首級。也有傳聞說他偷出被示眾的道三首級，鄭重地加以埋葬。"],["毛利新助",56,70,45,43,58,3,47,"武士","佛教","CADDDDDDC","",1535,1582,1550,[0,100,0,0,0],"織田家臣。在桶狹間會戰中取下了敵將今川義元的首級，並在戰後成為黑母衣眾的一員。後來擔任馬迴役，但在本能寺之變時於二條御所戰死。"],["梁田政綱",39,61,72,60,26,12,47,"武士","佛教","DDBDBDDDD","",1532,1579,1547,[0,0,100,0,400],"織田家臣。在桶狹間會戰以斥候的身份讓奇襲成功，因此戰後被賜予尾張沓掛三千貫。後來成為大聖寺的城主，但因一揆再度爆發而被撤換。"],["南光坊天海",3,1,97,94,32,89,107,"僧侶","佛教","CDDSSADAS","",1536,1643,1551,[0,0,0,400,600],"德川家臣。是比叡山窮究教義的天台宗和尚。以其主‧家康之親信的身份，用辛辣的手腕處理國政，被稱為「黑衣宰相」。也有人說他跟明智光秀為同一人。"],["織田信長",92,89,96,105,40,0,48,"武士","無","ACASABCSS","釣瓶擊",1534,1582,1546,[100,100,100,400,200],"信秀的嫡男。在桶狹間擊敗今川義元。自此之後，標榜天下布武，相繼消滅敵對勢力，眼看就要統一天下時，由於明智光秀的謀反，死在本能寺。"],["織田信忠",78,72,59,70,84,0,25,"武士","佛教","BCDADDCCB","",1557,1582,1572,[100,0,0,100,0],"信長的嫡男。在鎮壓松永久秀謀反和甲斐平定戰等中立下大功，繼承信長的家業，領有美濃、尾張二國，本能寺之變的時候，在二條城自殺。"],["織田秀信",36,34,12,49,75,1,25,"武士","佛教","DDDCDDDDD","",1580,1605,1595,[0,0,0,100,0],"信忠的嫡男。本能寺之變後被羽柴秀吉擁立，三歲就繼承織田家，但是實權被秀吉奪去。關原會戰中增援西軍，敗北，在高野山出家。"],["織田信雄",40,21,9,58,6,96,72,"武士","佛教","DDCDDDDDD","",1558,1630,1573,[0,0,100,0,0],"信長的次子。之後成為伊勢國司北田家的養子，繼承家業。本能寺之變後從屬於豐臣秀吉。小田原征伐後，拒絕被德川家康轉封到舊領地，被免職。"],["織田信孝",58,66,19,35,36,92,25,"武士","佛教","CCDCDDDCD","",1558,1583,1573,[100,0,0,100,0],"信長之三子。成為伊勢的豪族神戶具盛的養子，繼承家業。本能寺之變後，聯合柴田勝家對付羽柴秀吉，但是敗北，受秀吉之命自殺了。"],["織田信勝",34,32,67,59,49,79,21,"武士","佛教","DDCDDDDDC","",1536,1557,1551,[0,0,100,0,0],"信秀之次子。也被稱為信行。和被稱為傻瓜的兄長信長相反，從小聰明伶俐，受到家中的好評。被林秀貞等人擁立為下任當主，但是在清洲城被信長謀殺。"],["織田信澄",63,70,40,49,47,79,27,"武士","佛教","BDDBDBDDD","",1555,1582,1570,[100,0,0,100,0],"信勝之子，為伯父信長效力。娶了明智光秀之女為妻。有器量，獲得高度好評，但是本能寺事變的時候被表兄弟信孝殺死。"],["織田信包",60,49,24,57,53,1,71,"武士","佛教","CDBCDCCCD","",1543,1614,1558,[100,0,0,100,0],"信秀之四子。參加了進攻越前和進攻石山本願寺，本能寺事變後為豐臣秀吉效力，擔任秀吉之子秀賴的傅役。女兒成為秀吉的側室，受到寵愛。"],["織田長益",24,7,5,68,31,1,74,"武士","佛教","DDDDDDDDD","",1547,1621,1562,[0,0,0,0,0],"信秀的十子。號有樂齋，喜歡茶道，成為利休七哲之一，兄長信長死後歸屬豐臣家，但是大阪之戰前夕串通德川家撤出了大阪城。"],["織田信光",56,70,51,42,50,1,39,"武士","佛教","BCDDDDDDD","",1516,1555,1531,[0,100,0,0,0],"信定之子，武勇出眾。在與今川家的小豆阪會戰中擔任殿軍。為侄子信長進攻清洲城做出了貢獻，成為那古野城主，但是數月後被家臣謀殺。"],["林秀貞",30,24,70,60,41,78,66,"武士","佛教","DDCDBDDDD","",1514,1580,1529,[0,0,100,0,300],"織田家臣，首席家老。主家的繼承權之爭中擁立信勝，失敗，但是被饒恕，此後沒有顯著的功績，後來擁立信行之事被再次追究，被流放。"],["池田恆興",72,72,39,61,58,0,48,"武士","佛教","CBCCDDDDD","",1536,1584,1551,[0,100,100,0,0],"織田家臣，信長的乳兄弟。在姊川會戰等戰役中表現出色。本能寺之變後成為織田家四宿老之一，加入羽柴秀吉一方，參加小牧長久手會戰，陣亡。"],["池田輝政",74,68,63,73,45,98,49,"武士","佛教","BCDBDDCBC","",1564,1613,1579,[0,100,0,100,0],"織田家臣，恆興的次子。本能寺之變後歸屬豐臣家，在各地表現活躍。關原會戰中屬於東軍，戰後領受播磨姬路52萬石俸祿，人稱“姬路宰相”。"],["河尻秀隆",63,74,22,17,48,0,55,"武士","佛教","DBDCDDDDD","",1527,1582,1542,[0,100,0,0,0],"織田家臣，黑毋衣眾首席。輔佐信長的嫡男信忠，在甲斐平定戰中表現活躍，戰後，被封與甲斐一國。本能寺事變後，死於甲斐的國人一揆。"],["河尻秀長",34,60,30,13,51,1,46,"武士","佛教","DCDDDDDDD","",1554,1600,1569,[0,100,0,0,0],"豐臣家臣，苗木城主，秀隆之子。參加了小牧長久手會戰、小田原征伐戰等。出兵赴朝鮮時在肥前名護屋城加入陣局。關原會戰中屬於西軍，陣亡。"],["佐久間信盛",71,53,38,57,49,13,54,"武士","佛教","BDDDDDDCD","",1527,1581,1542,[100,0,0,0,0],"織田家臣。在各地的會戰中表現活躍，受人敬仰。進攻石山本願寺時擔任總指揮，但是從本願寺撤退後，被叱責行動不利，被流放。"],["佐佐成政",79,84,33,66,61,85,52,"武士","佛教","CBDADCDCA","",1536,1588,1551,[100,0,0,400,0],"織田家臣，歸屬柴田勝家。為進攻北陸做出貢獻，本能寺事變後與羽柴秀吉對立，但是失敗，而後投降。後因經營轉封的領國‧肥後失敗，被勒令自殺。"],["柴田勝家",94,96,54,64,72,85,61,"武士","佛教","CSDCDBDBC","",1522,1583,1537,[100,400,0,0,0],"織田家臣，為天下聞名的猛將。擔任北陸軍的總指揮。本能寺之變後與羽柴秀吉爭鬥，在賤岳合戰中敗北，後於居城‧北庄城自戕。"],["柴田勝豐",12,25,10,31,17,85,27,"武士","佛教","DDCDDDDDD","",1556,1583,1571,[0,0,100,0,0],"柴田家臣，成為叔父勝家的義子，擔任長濱城主。後來與勝家對立，招致聞知此事的羽柴秀吉的攻擊，投降。賤岳會戰後不久死去。"],["瀧川一益",89,81,84,44,67,0,61,"忍者","佛教","CDDSABCDD","",1525,1586,1540,[0,0,0,400,300],"織田家臣。在各地的會戰中表現活躍，人稱“進也瀧川，退也瀧川”。平定甲斐後，成為關東管領。本能寺事變後和北條軍作戰，慘敗，以後失去了威勢。"],["瀧川益重",68,76,31,26,55,1,69,"忍者","佛教","DBDBDCDDD","",1523,1592,1538,[0,100,0,100,0],"瀧川家臣，一益堂兄弟。另一說是姪兒。本能寺之變後，與一益一起投靠柴田勝家。於北伊勢和羽柴秀吉軍展開激戰。後來改仕奉秀吉，參與九州征伐。"],["前田慶次",50,110,40,20,95,10,69,"忍者","佛教","CSBDDDDDD","乘崩",1543,1612,1558,[100,400,0,0,0],"戰國第一奇人。瀧川益重之子。前田利家之兄‧利久養子。善使槍，號稱天下無雙。風雅之道造詣亦高。關原之戰時隸屬於上杉家。"],["丹羽長秀",75,69,73,86,78,0,50,"武士","佛教","CCBABDDAA","",1535,1585,1550,[100,0,0,100,200],"織田家臣，外號“米五郎左”。擔任安土城的建築奉行等等，在行政方面表現活躍，本能寺事變後歸屬羽柴秀吉，領受越前北之莊120萬石俸祿。"],["丹羽長重",65,51,36,43,37,3,66,"武士","佛教","DCDDDDCDD","",1571,1637,1586,[0,0,0,0,0],"豐臣家臣，長秀的嫡男。繼承越前北之莊120萬石俸祿，但是被逐漸減封，關原會戰後失去領地。大阪之戰中參加，並且表現出色，領受陸奧白河10萬石俸祿。"],["羽柴秀吉",87,65,94,104,45,10,61,"庶民","佛教","SDDBBADSS","千成衾",1537,1598,1552,[400,0,0,100,300],"戰國第一的傳奇人物。為織田信長效力，傑出的名聲和智謀是其活躍的武器，漸露頭角。本能寺事變後，相繼打敗明智光秀，柴田勝家等人，稱霸天下。"],["豐臣秀賴",46,20,26,45,69,10,22,"庶民","佛教","DDCCDDDDD","",1593,1615,1603,[0,0,0,0,0],"秀吉的次子。關原會戰後，失落了攝河泉65萬石俸祿的第一大名地位。大阪之戰中受到母親澱夫人等的過份庇護，一仗也沒有打就自殺了。"],["羽柴秀長",74,67,83,93,87,10,51,"庶民","佛教","ADABCDCAA","千成衾",1540,1591,1555,[100,0,0,100,100],"秀吉的同母異父之弟。為兄長的左右手，為其霸業貢獻良多。性溫和，德高望重，擔任秀吉與其他大名的調停工作。先於秀吉死去，諸將為他的死痛惜不已。"],["豐臣秀次",34,45,16,33,33,9,27,"庶民","佛教","DCDCDDDDD","",1568,1595,1583,[0,0,0,0,0],"豐臣家臣，三好吉房（秀吉的義兄）之子。繼承秀吉之位就任關白，秀賴誕生後其亂行無度，人稱“殺生關白”，因謀反之罪被責令自殺。"],["小早川秀秋",38,23,23,16,10,7,20,"武士","佛教","DCDDDDDDD","",1582,1602,1597,[0,0,0,0,0],"木下家定（秀吉的義兄）之子。奉行臣秀吉之命作為小早川隆景的義子，關原會戰中叛變到東軍，為東軍的勝利做出貢獻，但是兩年後猝死。"],["塙直政",60,68,35,70,61,0,44,"武士","佛教","CDCBDDDDB","",1532,1576,1547,[100,0,0,100,0],"織田家臣，赤毋衣眾之一，後來姓原田。主公信長賜與蘭奢待時，擔任奉行。攻打石山本願寺的時候招致起義軍的攻擊，陣亡。"],["前田利家",77,80,62,74,80,0,61,"武士","佛教","BCDBCCDBB","",1538,1599,1553,[100,0,0,100,0],"織田家臣。在許多會戰中表現出色，外號“槍之又左”後來跟隨柴田勝家，為平定北擊做出了貢獻。信長死後，為豐臣秀吉效力，成為五大老之一。"],["前田利長",61,47,61,71,41,95,52,"武士","佛教","CCDCDDCDC","",1562,1614,1577,[0,0,0,100,0],"利家的嫡男。繼承家業後，流傳其要謀反的傳聞，但是由於交出了母親芳春院作人質而避免了被討伐。關原會戰中屬於東軍，領受加賀100萬石俸祿。"],["金森長近",65,67,54,61,47,94,83,"武士","佛教","DBDCDDDCD","",1525,1608,1540,[100,0,0,0,0],"織田家臣，赤母衣眾之一。跟隨柴田勝家為平定北陸做出了貢獻。勝家死後閒居，後來為豐臣秀吉效力，專長茶道，是利休七哲之一。"],["蜂須賀正勝",72,82,87,70,88,10,60,"武士","佛教","ADDCSABBC","",1526,1586,1541,[400,0,0,0,400],"豐臣家臣。幫助建築墨俁一夜城，以後作為秀吉的參謀在民政等方面發揮才能。四國征伐後，領受阿波德島18萬石的俸祿來作為對長宗我部家的控制。"],["蜂須賀家政",64,50,79,82,48,5,80,"武士","佛教","CDDCBCCCB","",1558,1638,1573,[100,0,0,0,200],"豐臣家臣，正勝的嫡男。關原會戰的時候讓兒子至鎮屬於東西，以圖阿波德島藩的安泰。以後也實質地主導藩政，為德島藩的體制確立做出了貢獻。"],["蜂屋賴隆",59,72,41,23,58,1,55,"武士","佛教","CDDCDDDDD","",1534,1589,1549,[100,0,0,0,0],"織田家臣，黑毋衣眾之一。為齋藤家效過力，後來為織田信長效力。以後率領遊軍在各地表現出色。本能寺事變後歸屬豐臣秀吉，領受越前敦賀5萬石俸祿。"],["古田重然",16,27,4,60,14,1,71,"武士","佛教","DDDDDDDDD","",1544,1615,1559,[0,0,0,0,0],"豐臣家臣。就任織部正，利休七哲之一。創始織部燒，是諸大名的茶道師父。大阪之戰的時候，被懷疑串通豐臣方，被勒令自殺。"],["森可成",66,75,60,29,81,1,47,"武士","佛教","BDDCDDDCD","",1523,1570,1538,[100,0,0,0,0],"織田家臣。在尾張統一戰和桶狹間會戰等戰役中表現活躍。擔任宇佐山城主，鞏固琵琶湖的南岸。後來招致淺井、朝倉聯軍的攻擊，眾寡不敵，陣亡。"],["森長可",62,79,31,23,63,1,26,"武士","佛教","CBDDDCDDD","",1558,1584,1573,[0,100,0,0,0],"織田家臣，可成的嫡男。參加過鎮壓長島一向起義和討滅武田家戰役，外號“鬼武藏”。本能寺事變後跟隨豐臣秀吉，在小牧長久手會戰中陣亡。"],["森成利",51,69,72,80,95,0,17,"武士","佛教","CCCABDDCA","",1565,1582,1580,[100,0,100,100,100],"織田家臣。可成的三子。擔任其主‧信長的隨身小姓。聰敏且長相俊秀，受到信長的寵愛。雖其未來很受期待，但在本能寺之變時，追隨信長奮戰而死。"],["平野長泰",54,71,42,32,55,33,69,"武士","佛教","BDCDDDDDD","",1559,1628,1574,[100,0,100,0,0],"豐臣家臣。賤岳七槍之一。在關原合戰時從屬於東軍。大阪之陣的前夕，雖向德川家康告知他要進入大阪城一事，但被深恐生變的家康將之留置於江戶城。"],["生駒親正",54,39,44,67,61,3,68,"武士","佛教","DDCDDDCDC","",1535,1603,1550,[0,0,100,0,0],"豐臣家臣。領讚岐高松17萬石俸祿，主公秀吉死後，他成為三中老之一。關原之戰中屬於西軍，但是由於兒子一正屬於東軍而避免了被免職。"],["佐久間盛政",73,90,24,18,69,85,30,"武士","佛教","CADDDBDDD","",1553,1583,1568,[100,400,0,0,0],"柴田家臣，盛次的嫡男。為叔父勝家效力。外號“鬼玄蕃”的猛將。賤岳作戰時過於深入，釀成柴田軍的敗因。戰後被俘，被斬首。"],["佐久間勝政",55,73,43,28,46,85,43,"武士","佛教","DCDDDDDCD","",1554,1597,1569,[0,100,0,0,0],"柴田家臣，盛次的次子。武勇出眾，被叔父勝家下賜柴田姓。在平定加賀一向起義中表現活躍。賤岳會戰後，為豐臣秀吉效力，接受了豐臣姓。"],["佐久間安政",42,64,35,22,65,85,72,"武士","佛教","CDDDDDDDD","",1555,1627,1570,[0,0,0,0,0],"柴田家臣，盛次的三子。開始時稱保田姓。賤岳會戰後為織田信雄效力。此後相繼為北條家、蒲生家、德川家效力，領受信濃飯山3萬石俸祿。"],["前野長康",63,71,61,25,65,4,67,"武士","佛教","BDDCCDDCD","",1528,1595,1543,[100,0,0,0,200],"豐臣家臣。與蜂須賀正勝一起協助建設墨俁一夜城，以後作為秀吉的得力幹將表現活躍，領受但馬出石5萬石俸祿。後來因為豐臣秀次事件受牽連，自殺了。"],["堀秀政",76,65,71,76,75,2,37,"武士","佛教","BCCBBDDCB","",1553,1590,1568,[100,0,0,100,0],"織田家臣。在各地屢建軍功，還擔任德川家康的響應役等，在文武兩方面都發揮才能。本能寺事變後歸屬豐臣秀吉，受到很好的待遇。"],["堀秀治",53,49,56,64,43,98,30,"武士","佛教","DDDDDDCCD","",1576,1606,1591,[0,0,0,0,0],"豐臣家臣，秀政的嫡男。父親死後，繼承了家業。領受越後春日山45萬石俸祿，關原會戰中屬於東軍，鎮壓了上杉景勝煽動的暴動，保全了領地。"],["村井貞勝",15,10,77,98,61,0,62,"武士","佛教","DDDDCDDAS","",1520,1582,1535,[0,0,0,0,100],"織田家臣，家中頭號吏僚。擔任京都所司代，從事京都的治安維護、宮廷的修築等等，協助主公信長的內政。在本能寺事變中，於二條御用所戰死。"],["淺野長政",44,26,62,77,53,2,64,"武士","佛教","DDCDCDDCA","",1547,1611,1562,[0,0,100,0,0],"豐臣家臣，秀吉的正室寧子的義弟。作為首席奉行參與主家的執政。秀吉死後，與石田三成對立，接近德川家康，以後為德川家效力。"],["淺野幸長",64,72,68,69,58,97,37,"武士","佛教","CCDCDDBCB","",1576,1613,1591,[100,100,0,0,0],"豐臣家臣，長政的嫡男。關原會戰中屬於東軍，戰後，領受紀伊和歌山37萬石俸祿。後來與加藤清正協力，實現了德川家康與豐臣秀賴的會面。"],["淺野良晟",54,68,55,53,48,97,46,"武士","佛教","CDDDDDCDD","",1586,1632,1601,[100,0,0,0,0],"德川家臣，長政的次子。兄長幸長死後他成為紀伊和歌山藩主。大阪夏季戰役中出色的討伐了塙團右衛門等，福島家垮臺後，領受安藝廣島42萬石俸祿。"],["小野木重次",55,61,46,52,72,6,37,"武士","佛教","CDDCDCDDD","",1563,1600,1578,[0,0,0,0,100],"豐臣家臣。參加了征伐小田原等戰役，領受丹波福知山4萬石俸祿。關原會戰中屬於西軍，攻下了田邊城，但是由於西軍主力失敗，開城，自盡。"],["加藤清正",90,92,64,71,80,99,49,"庶民","佛教","ABDBDSBSB","",1562,1611,1577,[400,100,0,100,0],"豐臣家臣，賤岳七條槍之一。出兵朝鮮時表現活躍，留下了“虎加藤”的佳話。秀吉死後，與石田三成對立，關原會戰中屬於東軍，得到了肥後熊本52萬石俸祿。"],["加藤嘉明",73,76,52,46,68,5,68,"武士","佛教","BCDCDDADC","",1563,1631,1578,[400,0,0,100,0],"豐臣家臣，賤岳七條槍之一。智勇雙全，獲得好評。作為豐臣水軍的主力在各地的會戰中表現活躍，關原會戰中屬於東軍，領受伊予松山20萬石俸祿。"],["仙石秀久",33,71,20,16,19,4,63,"武士","佛教","BDDDDDCDD","",1551,1614,1566,[100,0,0,0,0],"豐臣家臣。由於平定淡路島有功，得到淡路州本5萬石俸祿。擔任征伐九州的先鋒時，在戶次川會戰中大敗給島津軍，被沒收了領國，不過後來歸還。"],["寺澤廣高",42,30,55,71,50,0,70,"武士","佛教","DDDDDCACB","",1563,1633,1578,[0,0,0,0,0],"豐臣家臣。出兵朝鮮的時候，擔任肥前名護屋城的建築工程。作為主公秀吉的親信，進行兵力輸送、補給、船舶的運航管理等工作。關原會戰中屬於東軍。"],["戶田勝成",72,76,53,25,84,9,47,"武士","佛教","CBDDDDDDD","",1553,1600,1568,[100,100,0,0,0],"丹羽家臣。主公長秀死後，歸屬豐臣家。參加過征伐小田原等戰役，立過戰功。關原會戰中屬於西軍，陣亡。東軍的諸將對他的死也感到惋惜。"],["中村一氏",58,37,44,61,47,5,46,"武士","佛教","DDDDDDCCB","",1554,1600,1569,[0,0,0,0,0],"豐臣家臣，擔任岸和田城主。主公秀吉死後，成為三中老之一，領受駿河府中14萬石俸祿，關原會戰中屬於東軍，但是在決戰前夕病死。"],["福島正則",93,94,37,51,88,97,63,"庶民","佛教","ASCDDDCCC","",1561,1624,1576,[400,400,0,0,0],"豐臣家臣，賤岳七條槍之首。關原會戰中，作為東軍的主力奮戰，得到了安藝廣島49萬石的俸祿。可是，後來因為居城廣島城擅自修築之罪被免職。"],["堀尾吉晴",61,50,63,72,63,98,68,"庶民","佛教","CDBCDCDCB","",1543,1611,1558,[0,0,100,0,0],"豐臣家臣。性情溫和，外號“佛茂助”主公秀吉死後，成為三中老之一，在關原會戰中兒子忠氏屬於東軍，得到了出雲松江24萬石的俸祿。"],["增田長盛",22,30,58,92,39,23,70,"武士","佛教","DDDDDDDCA","",1545,1615,1560,[0,0,0,0,0],"豐臣家臣，五奉行之一，負責檢地等工作。豐臣秀次死後，領受大和郡山20萬石俸祿，關原會戰的時候在大阪城守衛豐臣秀賴。戰後，被免職。"],["溝口秀勝",52,47,55,55,58,96,62,"武士","佛教","DDDCDDDCD","",1548,1610,1563,[0,0,0,100,0],"丹羽家臣，後來成為織田家重臣。本能寺事變後歸屬豐臣秀吉。出兵朝鮮的時候守衛了肥前名護屋城。關原會戰中屬於東軍，保全了領地。"],["山內一豐",66,48,51,67,21,87,59,"武士","佛教","DDCCDDCCB","",1546,1605,1561,[0,0,0,0,0],"織田家臣，其妻千代的內助之功很有名。本能寺事變後歸屬豐臣秀吉，關原會戰的時候向德川家獻上居城掛川城，戰後，得到土佐高知24萬石俸祿。"],["德永壽昌",25,30,68,63,33,91,63,"武士","佛教","DDDDDDDDC","",1549,1612,1564,[0,0,0,0,0],"柴田家臣。賤岳會戰的時候與主公勝豐一起投入豐臣秀吉的麾下。秀吉死後，遠渡朝鮮向全軍傳達撤退命令，關原會戰中屬於東軍。"],["德山則秀",41,50,41,59,51,88,62,"武士","佛教","DDCDDDDDC","",1544,1606,1559,[0,0,100,0,0],"柴田家臣。跟隨主公勝家參加了鎮壓越前一向起義，成為小松城主。勝家死後，歸屬豐臣秀吉。以後，相繼為丹羽家、前田家、德川家康效過力。"],["百百則信",42,43,50,71,53,3,61,"武士","佛教","DDDCDCDCD","",1548,1609,1563,[0,0,0,0,0],"豐臣家臣。參加過山崎會戰等戰役，立下過戰功。後來成為織田秀信的家老。關原會戰中勸說秀信加盟東軍，但是失敗，屬於西軍，最終戰敗，到處流浪。"],["原長賴",70,75,56,34,61,91,56,"武士","佛教","DBDBDDDDD","",1544,1600,1559,[0,100,0,0,0],"織田家臣。成為柴田勝家的得力手下，賤岳會戰中作為柴田軍的先鋒英勇奮戰，戰後，為豐臣家效力。關原會戰中屬於西軍，表現活躍，但是戰後自殺。"],["塙直之",65,76,7,3,35,11,48,"武士","佛教","DBDADDDDD","",1567,1615,1582,[0,0,0,100,0],"加藤家臣，擔任步槍大將。但是關原會戰的時候與主公嘉明對立，出走，成為浪人。後來進入大阪城，在大阪夏季戰役中與淺野長晟軍作戰，陣亡。"],["平岡賴勝",30,22,70,51,25,23,47,"武士","佛教","CDDDCDDDD","",1560,1607,1575,[0,0,0,0,100],"小早川家臣。流浪各國後，成為小早川家的家老，關原會戰中聯絡黑田長政，使主公秀秋叛變，秀秋死後其為德川家效力。"],["平塚為廣",68,78,54,21,80,9,34,"武士","佛教","BBDCDDDDD","",1566,1600,1581,[0,100,0,100,0],"豐臣家臣。參加了征伐小田原等戰役。關原會戰中屬於西軍，代替生病的大谷吉繼率領大谷軍。與叛變的小早川軍英勇奮戰，陣亡。"],["松野重元",72,74,34,10,68,4,82,"武士","佛教","CDDADDDDD","",1573,1655,1588,[100,0,0,100,0],"小早川家臣。率領步槍隊，被任命為主馬首，關原會戰中不響應主公秀秋的叛變，撤離了戰場。此後為田中吉政、德川忠長效力。"],["毛受勝照",55,70,27,6,69,85,32,"武士","佛教","DCDDDDDDD","",1551,1583,1566,[0,100,0,0,0],"柴田家臣。作為主公勝家的侍從頭領領受1萬石俸祿。賤岳會戰中柴田軍敗走之時，頑強阻止羽柴軍的追擊。讓勝家向越前撤退後，陣亡。"],["毛利勝永",89,82,67,20,73,9,38,"武士","佛教","BADBDDDDD","",1577,1615,1592,[100,0,0,100,0],"豐臣家臣。關原會戰中屬於西軍，被流放土佐，但是逃走後進入大阪城。聲望僅次於真田幸村，在大阪夏秀戰役中表現活躍，但是城池終於陷落，自殺了。"],["齋藤道三",85,79,100,95,1,80,62,"商人","佛教","SCCBSBDAA","",1494,1556,1509,[400,100,0,0,400],"美濃的戰國大名。外號“蝮蛇”，原來是僧人，改行作油商人，後來為美濃守護土岐賴藝效力，趕走賴藝後成為國主。後來與兒子義龍作戰，戰敗身死。"],["齋藤義龍",91,93,75,60,11,34,34,"武士","佛教","CSDDBBDDC","",1527,1561,1542,[100,400,0,0,200],"美濃的戰國大名，道三之子，也說是美濃守護土岐賴藝之子。為了家業與父親對立，殺死父親後成為美濃國主。但是猝死。據說是身長6尺5寸的巨漢。"],["齋藤龍興",23,26,14,40,29,34,25,"武士","佛教","DDCDDDDDD","",1548,1573,1563,[0,0,0,0,0],"美濃的戰國大名，義龍的嫡男。父親死後，繼承了家業。由於美濃三好漢背叛，敗給了織田信長，被流放。此後歸屬朝倉家，在刀禰阪會戰中陣亡。"],["齋藤利三",76,77,73,37,58,56,48,"武士","佛教","CBDBCCDDD","",1534,1582,1549,[100,100,0,0,100],"齋藤家臣。主家滅亡後，成為明智光秀的家老。參加了本能寺事變和山崎會戰，戰敗後被俘，被斬首。女兒是當過德川家光奶媽的春日局。"],["明智光秀",88,85,92,96,42,56,54,"武士","佛教","BCDSAADAS","釣瓶擊",1528,1582,1543,[100,0,0,400,300],"織田家臣。才智過人，教養出眾，得到信長的重用，但是突然發動叛亂，在本能寺擊斃信長。但事變後在山崎會戰中敗北，逃亡時被殺。"],["明智秀滿",69,75,44,41,80,58,45,"武士","佛教","CBDADCDDD","",1537,1582,1552,[100,0,0,100,0],"明智家臣。跟隨岳父光秀，參加了本能寺事變，山崎會戰中守衛安土城，但是由於本軍潰敗，撤退到阪本城，把財寶交給包圍軍，然後自殺了。"],["安藤守就",46,46,74,58,36,88,59,"武士","佛教","CDBDBDDDD","",1523,1582,1538,[0,0,100,0,300],"齋藤家臣，美濃三好漢之一。主家滅亡後為織田信長效力，但是後來被趕走。趁著本能寺之變，起兵欲恢復舊領地，不過與稻葉一鐵作戰，敗戰身死。"],["稻葉一鐵",78,70,72,71,41,96,73,"武士","佛教","BBDDCCDDC","",1515,1588,1530,[100,100,0,0,0],"齋藤家臣，美濃三好漢之一。主家滅亡後為織田信長效力。於姊川會戰中側擊淺井軍，將己方引向勝利。由於性格頑固，而成為“一徹”一詞之起源。"],["稻葉貞通",54,61,41,56,38,95,57,"武士","佛教","DDDDCDDDD","",1546,1603,1561,[0,0,0,0,0],"織田家臣。一鐵的長子。本能寺之變後侍奉豐臣秀吉。關原合戰時跟隨織田秀信隸屬於西軍，而後降伏於東軍。戰後，領有豐後臼杵5萬石。"],["氏家卜全",70,62,52,48,45,3,58,"武士","佛教","CCDDDDDDD","",1513,1571,1528,[100,0,0,0,0],"齋藤家臣，美濃三好漢之一。主家滅亡後，為織田家效力，伊勢平定戰中立下了戰功。長島一向起義討伐戰中織田軍敗北的時候，擔任殿軍，陣亡。"],["氏家行廣",56,66,42,32,53,11,69,"武士","佛教","DCDDDDDDD","",1546,1615,1561,[0,0,0,0,0],"豐臣家臣，卜全之子。參加了小田原征伐戰，得到伊勢桑名2萬2千石俸祿，關原會戰中屬於西軍，戰後流浪。進入大阪城，大阪夏季之戰中為豐臣秀賴殉死。"],["遠藤慶隆",47,50,36,44,51,89,82,"武士","佛教","DDCDDDDDD","",1550,1632,1565,[0,0,100,0,0],"美濃的豪族，郡上八幡城主，為豐臣秀吉效力。小牧長久手會戰的時候，被懷疑與織田家勾結，因此被減封。關原會戰中屬於東軍，戰後恢復了舊領地。"],["可兒才藏",58,94,20,4,28,77,59,"武士","佛教","SDDDDDDDD","",1554,1613,1569,[400,0,0,0,0],"福島家臣，擔任侍大將。向寶藏院胤榮學習槍術。因為在關原會戰中將斬落的17顆首級都用竹子挑著，做上記號，得到了“竹子才藏”的綽號。"],["竹中半兵衛",96,61,102,57,78,8,35,"武士","佛教","ADABSSDCD","治療",1544,1579,1559,[400,0,400,100,600],"齋藤家臣。僅用16人就奪取了主家的居城稻葉山城。他卓越的智謀得到羽柴秀吉賞識，被聘為軍師。跟隨秀吉進攻中國，在戰鬥中病死。"],["竹中重門",71,52,79,69,72,4,58,"武士","佛教","CDDCBBDDC","",1573,1631,1588,[0,0,0,100,200],"豐臣家臣，半兵衛重治之子。關原會戰中屬於東軍，在粕子山中抓住了小西行長。歌藝、文筆出眾，後來著作了豐臣秀吉的傳記《豐鏡》。"],["遠山景任",61,60,56,39,70,0,59,"武士","佛教","DCDDDCDDD","",1513,1572,1528,[0,100,0,0,0],"美濃的豪族，岩村城主。娶了織田信長的叔母。被武田家臣秋山信友攻擊岩村城時，向信長請求援軍，與援軍將領明智光秀一起與武田軍作戰。"],["日根野弘就",49,76,49,39,27,47,82,"武士","佛教","BCDDDDDDD","",1520,1602,1535,[100,100,0,0,0],"豐臣家臣。開始時為齋藤家效力，與織田信長作戰。主家滅亡後加入淺井家，淺井家滅亡後，為豐臣家效力。研究出了會戰中實用的兜“日根野缽”。"],["前田玄以",14,13,86,90,24,1,63,"僧侶","佛教","DDDDBDDDA","",1539,1602,1554,[0,0,0,0,100],"豐臣家臣。開始時是延歷寺的僧人，後來還俗，為織田信忠效力。本能寺事變的時候保護信忠的嫡男秀信逃出。後來成為豐臣家五奉行之一。"],["妻木廣忠",43,44,40,49,79,55,68,"武士","佛教","DDDDDDDDC","",1514,1582,1529,[0,0,0,0,0],"明智家臣，妻木城主。妻木家是美濃守護土岐家的庶流。侄女熙子（弟弟範熙之女）嫁給了主公光秀。山崎會戰中光秀戰敗的時候，在近江阪本自殺。"],["溝尾茂朝",33,66,36,11,83,57,39,"武士","佛教","CDDDDDDDD","",1543,1582,1558,[100,0,0,0,0],"明智家臣，通稱莊兵衛。是主公光秀的親信，深受信賴。山崎會戰敗北後，奉光秀之命為其收屍，藏好光秀的首級後他也自殺了。"],["關盛信",55,53,54,63,66,40,78,"武士","佛教","DDCDDDDDC","",1515,1593,1530,[0,0,100,0,0],"伊勢的豪族，龜山城主。向織田信長的伊勢侵襲軍投降。本能寺事變後追隨豐臣秀吉。後來成為蒲生氏鄉的得力手下，跟隨氏鄉轉封，移居到會津。"],["關一政",45,47,50,38,42,40,74,"武士","佛教","CDDDDDDDC","",1551,1625,1566,[0,0,0,0,0],"伊勢的豪族，龜山城主，盛信之次子。為蒲生家效力，在奧州平定戰中表現活躍，在關原會戰中屬於東軍，領受伯耆黑阪5萬石的俸祿，後來由於內亂被免職。"],["神戶具盛",31,26,30,35,35,37,74,"武士","佛教","DDCDDDDDD","",1526,1600,1541,[0,0,0,0,0],"伊勢的豪族，神戶城主。認織田信長的三子信孝為義子，後來被幽禁在近江日野城，但是信孝出征四國的時候，被解禁，負責留守。"],["長野稙藤",51,38,58,65,49,37,58,"武士","佛教","CDCDDDDCD","",1504,1562,1519,[100,0,0,0,0],"長野工藤家14代家主。長野工藤家與北田家、關家等是勢州四家。與北田家爭奪中伊勢，反覆交戰。"],["長野藤定",52,48,50,59,58,39,36,"武士","佛教","DCDDDDDDC","",1526,1562,1541,[0,0,0,0,0],"長野工藤家第15代當主，與北田家爭奪南伊勢的支配權。後來收北田具教的次男為養子，使得兩家和睦相處。後來則隸屬於北田家。"],["長野具藤",33,49,40,54,73,44,18,"高家","佛教","CDCDDCCDC","",1558,1576,1573,[0,0,0,0,0],"長野工藤家第16代當主，北田具教之子。北田家與長野家交好之際，為長野家之養子。與父親一起對抗織田信長的伊勢侵略軍，後來被織田信雄所殺。"],["細野藤敦",41,50,66,71,61,39,63,"武士","佛教","DDCDCDDDC","",1540,1603,1555,[0,0,0,0,100],"長野工藤家臣，藤光的嫡男。針對織田信長的伊勢侵襲軍，主張抗戰，堅守安濃城持續抗戰，但是後來講和了。本能寺事變後為豐臣家效力。"],["分部光嘉",65,56,42,55,42,39,49,"武士","佛教","CCDDDDDDD","",1552,1601,1567,[100,100,0,0,0],"長野工藤家臣，細野藤光之次子。針對織田信長的伊勢侵襲軍，主張恭順，歸屬繼承了長野家的織田信包，後來為豐臣秀吉效力，成為伊勢上野城主。"],["長尾種常",50,60,56,46,26,31,64,"武士","佛教","DDDDDDDCD","",1541,1605,1556,[0,0,0,0,0],"神戶家臣。是山路紀伊守正幽的長子，起初稱為山路久之丞。在織田信雄接收神戶城後服侍福島正則。在關原會戰中於岐阜城外與西軍交戰。"],["北畠晴具",63,71,65,75,58,43,60,"高家","佛教","CCADCDDDB","",1503,1563,1518,[100,100,400,0,0],"伊勢國司北田家第7代當主。與伊勢神宮的門前町宇治山田的町眾（山田三方）等對立，長期爭鬥。專長弓馬，和歌和書也很好。"],["北畠具教",70,97,21,50,63,44,48,"高家","佛教","ADCDDCCDC","混戰",1528,1576,1543,[400,0,0,0,0],"伊勢國司‧北田家第8代當主，晴具之子。敗於織田信長，收信長次男信雄當養子。後來被殺。向塚原卜傳學得「一之太刀」秘訣。"],["北畠具房",15,16,10,22,51,43,33,"高家","佛教","DDCDDDCDD","",1547,1580,1562,[0,0,0,0,0],"伊勢國司北田家第9代當主，具教之子。父親被織田信雄殺死後，瀧川一益在安濃郡河內幽禁他三年，被釋放後不久就病死了。"],["木造雄利",62,52,78,47,50,21,67,"僧侶","佛教","DDDCACDDC","",1543,1610,1558,[0,0,0,100,200],"織田家臣。木造俊茂之子。娶瀧川一益之女後改姓瀧川。小牧長久手合戰後被命為軍師輔佐豐臣秀吉。關原合戰時因隸屬西軍而失去所領。"],["木造具政",53,51,64,57,20,37,54,"高家","佛教","DDCDDDCDC","",1530,1584,1545,[0,0,100,0,0],"北畠家臣，北畠晴具之子。繼承木造家。背棄其兄具教，投降織田信長。後來隸屬於織田信雄。於小牧長久手之戰，敗於蒲生氏鄉軍。"],["木造長正",32,36,44,64,61,37,50,"高家","佛教","DDCDDDCDD","",1554,1604,1569,[0,0,100,0,0],"織田家臣，木造城主。具政之子。其主‧信雄被貶後，成為織田秀信的家老。於關原之戰時，企圖說服秀信協助東軍，但是失敗。戰後改仕於福島正則。"],["鳥屋尾滿榮",67,57,75,68,78,43,69,"武士","佛教","BCCDABBCD","",1508,1577,1523,[100,0,100,0,300],"北畠家臣。稱石見守，被譽為文才武略、智謀過人。織田信雄謀殺北畠家一族後，他和北畠具親一起結合舊臣起兵，但是戰死了。"],["藤方朝成",49,46,63,52,16,72,67,"武士","佛教","DDCDCDDDD","",1530,1597,1545,[0,0,0,0,200],"北畠家臣。向織田信長的伊勢侵襲軍投降，為繼承了北畠家的織田信雄效力，後來奉信長之命，謀殺了舊主具教。本能寺事變後跟了豐臣秀吉。"],["藤方安正",42,41,49,37,34,67,51,"武士","佛教","DDDCDDDDD","",1571,1622,1586,[0,0,0,0,0],"織田家臣。開始時為織田信包效力，信包被免職後，為豐臣秀次效力。秀次事件之後，應德川家康之邀，被賜與下總5百萬石俸祿，以後為德川家效力。"],["九鬼嘉隆",78,74,55,44,65,3,58,"海賊","佛教","CDDBDASCD","",1542,1600,1557,[100,0,0,100,0],"織田家臣。志摩海賊眾之一。在木津川口會戰中敗北，因此建造「鐵甲船」並擊潰毛利水軍。得此番功績後，晉昇為大名，從而得到「海賊大名」的奇名。"],["向井正綱",75,70,57,12,75,91,68,"海賊","佛教","CDCBDBSDD","",1557,1625,1572,[0,0,100,100,0],"武田家臣。因父親正重受到德川軍攻擊而戰死的緣故，繼任為家督。主家滅亡後侍於德川家而擔任御船奉行，以德川水軍之核心人物之身份活躍。"],["武田信虎",93,96,54,50,22,44,80,"武士","佛教","CSDDDBDDD","",1494,1574,1509,[0,400,0,0,0],"甲斐守護。平定了甲斐，但是被反對其嚴苛的政策方針的嫡男信玄流放到駿河，以後在各地流浪，沒有再回甲斐。"],["武田信玄",110,88,96,94,10,63,52,"武士","佛教","BSADSCDCS","啄木鳥",1521,1573,1536,[100,400,100,0,600],"甲斐守護，信虎的嫡男。反對父親嚴苛的政策，將父親趕走，自己作了當主。率領精強的騎兵軍團，以臨機應變的智謀，讓織田信長大吃苦頭，人稱“甲斐之虎”。"],["武田義信",80,79,30,45,90,44,29,"武士","佛教","DACDDDDDC","",1538,1567,1553,[0,400,0,0,0],"信玄的長子。在川中島會戰等戰役中表現活躍。反對進攻妻子的娘家今川家，企圖謀反，但是失敗了，被幽禁在東光寺，2年後死亡，也有說是自盡的。"],["武田勝賴",89,93,26,40,53,70,36,"武士","佛教","DACDDADBD","",1546,1582,1561,[0,400,100,0,0],"甲斐的戰國大名，信玄的四子。繼承家業後，用強硬的政策擴大領土。由於長篠會戰的大敗，家臣們瓦解，敗給織田軍後，在天目山自盡。"],["仁科盛信",73,81,54,50,83,63,25,"武士","佛教","CBDDDDDCD","",1557,1582,1572,[100,100,0,0,0],"武田信玄的五子。繼承了信濃的豪族仁科家的家業。奉兄長勝賴之命守衛信濃高遠城。頑強抵抗織田信長軍，但是寡不敵眾，戰敗後自盡。"],["武田信繁",87,83,83,82,98,63,36,"武士","佛教","BACDBDDDB","",1525,1561,1540,[100,100,100,0,100],"信虎的次子。文才武略，聲望也高，作為兄長的副將表現出色。川中島會戰中奮死守衛主營，陣亡。後人評價他是真正的武將。"],["武田信豐",70,62,51,43,45,63,35,"武士","佛教","DCDDDDDDD","",1547,1582,1562,[0,100,0,0,0],"信繁之子，信濃小諸城主。由於父親在川中島會戰中陣亡，他繼承了家業。利用父親遺傳的軍事才能輔佐主公勝賴。織田信長進攻甲斐的時候，被謀殺。"],["武田信廉",23,48,38,60,37,63,54,"武士","佛教","DDCDDCDDC","",1528,1582,1543,[0,0,100,0,0],"信虎的三子。二哥信繁死後，作為家族中的代表輔佐長兄信玄。由於容貌酷似信玄，也充當過替身。專長繪畫，留下了人物畫等作品。"],["小山田信茂",72,71,73,70,24,71,37,"武士","佛教","BDADCCDDD","",1545,1582,1560,[100,0,0,0,200],"武田家臣，出羽守信有之子。率領專長投石的部隊在各地的戰鬥中表現活躍。投降了織田信長的甲斐侵襲軍，但是勝賴死後，被冠以叛徒之名斬首。"],["穴山信君",38,19,52,74,15,58,41,"武士","佛教","DDCDCDDDB","",1541,1582,1556,[0,0,0,0,100],"武田家臣，得力手下。會戰中主要守衛主營。武田家滅亡後，投降了德川家康。得知本能寺事變後，從界鎮返回本國的途中被殺。"],["秋山信友",74,78,75,69,80,58,48,"武士","佛教","BBCDCBDCD","",1527,1575,1542,[100,100,0,0,200],"武田家臣。統帥伊那眾，作戰勇猛，被德川家康評價為“武田軍的猛牛”，守衛美濃岩村城，與織田信長軍作戰，戰敗後被俘，被斬首。"],["高坂昌信",91,75,85,71,88,57,51,"武士","佛教","BADDBDDCC","",1527,1578,1542,[100,400,0,0,200],"武田家四名臣之一。從主公信玄的侍從提昇到侍大將。武略和兵法在家中首屈一指，綽號“逃彈正”，據說是《甲陽軍鑑》的原著者。"],["馬場信房",86,77,76,77,94,57,60,"武士","佛教","CADDCDDCA","",1515,1575,1530,[100,100,0,0,100],"武田家四名臣之一。參加了許多會戰，從來沒有受到傷，綽號“不死身的鬼美濃”，長篠會戰的時候為了讓主公勝賴逃走，擔任殿軍，陣亡。"],["內藤昌豐",82,70,82,79,85,57,53,"武士","佛教","DBBDBDDCA","",1522,1575,1537,[0,100,400,0,300],"武田家臣，武田四名臣之一。武田信繁死後，成為其主‧信玄的副將格。擅長軍事經略，身為箕輪城主，治理西上野方面。於長篠之戰戰死。"],["飯富虎昌",84,91,41,39,65,44,61,"武士","佛教","DADDDDDCD","",1504,1565,1519,[0,400,0,0,0],"武田家臣。率領統一著紅色軍裝的部隊，綽號“甲山的猛虎”，擔任信玄的長子義信的傅役，但是追究義信謀反未遂事件的責任，自盡了。"],["山縣昌景",88,94,69,63,87,57,45,"武士","佛教","DSDDCBDDD","",1530,1575,1545,[0,400,0,0,200],"武田家四名臣之一，飯富虎昌之弟。和兄長一樣，統一著紅色軍裝。在內政、軍事、外交各方面輔佐主公信玄，在長篠會戰中，全身中彈身亡。"],["土屋昌恆",55,76,34,12,81,70,26,"武士","佛教","BCDDCDDDD","",1556,1582,1571,[100,100,0,0,100],"武田家臣，金丸虎義的五子。繼承土屋家的家業。在甲斐天目山為保衛主公勝賴，孤軍奮戰，最後陣亡。他這次的奮戰，被稱為“單手千人斬”。"],["山本勘助",84,74,97,72,40,64,68,"武士","佛教","BBCCSSDSD","啄木鳥",1493,1561,1508,[100,100,100,100,400],"武田家臣。能文能武，擔任主公信玄的軍師。第四次川中會戰中，制定的戰法被上杉謙信識破，為了承擔責任，突入亂軍之中戰死了。"],["小幡虎盛",71,77,51,21,72,59,56,"武士","佛教","CDBDDCDDD","",1505,1561,1520,[100,0,400,0,0],"武田家臣，甲陽五名臣之一，綽號“鬼虎”，一生中多次得到表彰。晚年擔任高阪昌信的副將，留下了著名的遺言。"],["小幡景憲",74,62,76,4,18,59,91,"武士","佛教","DDCCBDDBD","",1572,1663,1587,[0,0,0,100,400],"甲州流兵學者，昌盛（虎盛之子）之子。成為德川秀忠的侍從，後來出走。大阪之戰後返回。集甲州流兵學之大成，教授了眾多門徒。"],["原虎胤",81,92,30,9,39,55,67,"武士","佛教","ADDDDBDCD","",1497,1564,1512,[400,0,0,0,0],"武田家臣，甲陽五名臣之一，下總千葉家臣原家的一族。一生參加了38次會戰，專長攻城，有情有義，綽號“夜叉美濃”。"],["多田滿賴",69,80,74,13,58,56,62,"武士","佛教","BDBDBCDDD","",1501,1563,1516,[100,0,0,0,300],"武田家臣，甲陽五名臣之一，出身美濃。傳說他在信州虛空藏山的鹿砦消滅了地獄妖婆‧火車鬼。是家中最專長指揮夜襲的人。"],["跡部勝資",15,30,58,36,29,71,35,"武士","佛教","DDDDDDDDD","",1547,1582,1562,[0,0,0,0,0],"武田家臣。跡部家是信濃佐久郡出身的名家，也擔任過甲斐守護代。與原昌胤一起擔負主公勝賴的近侍。武田家滅亡時在諏訪陣亡，被評說為佞臣。"],["初鹿野昌次",52,60,53,30,55,71,79,"武士","佛教","DCDDDDDCD","",1545,1624,1560,[0,0,0,0,0],"武田家臣。繼承了在川中島會戰中陣亡的初鹿野源五郎的家業。主家滅亡後，為德川家康效力，在小牧長久手會戰、征伐小田原、大阪之戰等戰役中表現活躍。"],["大久保長安",4,2,62,98,17,78,68,"庶民","佛教","DDDDDDDDS","",1545,1613,1560,[0,0,0,0,0],"德川家臣。利用主家的勢力和新技術採掘金銀礦，設立一里塚和傳馬宿等等，在幕府的民政、財政方面做出了極大的貢獻，綽號“天下的總代官”。"],["真田幸隆",83,60,99,84,70,59,61,"武士","佛教","BDSDSADAB","",1513,1574,1528,[400,0,400,0,600],"武田家臣。信州先方眾，憑借智謀攻下了主公信玄攻不下來的信濃戶石城，其智謀得到了信玄的讚賞。以後，作為信玄的參謀之一表現活躍。"],["真田信綱",69,78,50,33,73,59,38,"武士","佛教","BCDDDDDDD","",1537,1575,1552,[100,100,0,0,0],"幸隆的長子。父親退隱後，作為信州先方眾之一轉戰各地，勇名遠播，長篠會戰中揮舞3尺3寸長的大刀奮戰，遍體中槍彈，陣亡。"],["真田昌幸",97,76,98,91,48,60,64,"武士","佛教","SBBCSBDS
