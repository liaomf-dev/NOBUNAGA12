A","火牛計",1547,1611,1562,[400,100,0,100,800],"幸隆的三子，豐臣秀吉認為他是歷代少有的謀將。以數千兵士折騰正向關原行軍的德川秀忠軍3萬8千人，將其牽制在信濃。"],["真田信幸",76,69,70,86,80,58,92,"武士","佛教","BCBCCCDAA","",1566,1658,1581,[100,100,0,100,0],"昌幸之長子。因為娶了德川家臣本多忠勝之女，關原之戰中與父親和弟弟分開，屬於東軍，以後也為德川家盡忠，保住了真田家。"],["真田幸村",105,100,89,36,99,60,48,"武士","佛教","ASDCBBDSD","乘崩",1567,1615,1582,[100,400,0,100,200],"昌幸的次子。隱居在紀伊九度山，從那裏進入大阪城，大阪戰役中，以少數兵馬奮戰德川的大軍，此戰中的表現被稱讚為“真田日本第一兵”。"],["真田大助",64,71,29,16,95,60,15,"武士","佛教","CCDDDDDDD","",1600,1615,1615,[100,100,0,0,0],"幸村之子，出生在父親隱居的紀州九度山。與父親一起進入大阪城，英勇奮戰，夏季戰役中待在城內，城池陷落時為豐臣秀賴殉死。"],["矢澤賴綱",74,70,71,68,65,61,79,"武士","佛教","BDBDCDDDB","",1518,1597,1533,[0,0,100,0,0],"真田家臣，海野棟綱之子，真田幸隆之弟。侄子昌幸攻打上野沼田城後，成為沼田城代。第一次上田會戰的時候，守衛了沼田城，武勇出眾。"],["矢澤賴康",71,75,48,49,66,62,72,"武士","佛教","BDCDDBDCD","",1553,1625,1568,[100,0,0,0,0],"真田家臣，賴綱之子。武勇不在其父之下，據說與北條家神川會戰的時候，單手持大長刀橫衝直撞，殺敵無數。"],["村上義清",92,89,71,51,49,25,70,"武士","佛教","CSDDCBDCD","",1503,1573,1518,[100,400,0,0,100],"信濃的豪族，葛尾城主。兩次打退武田信玄軍的攻擊，勇猛遠近聞名，可是，敗給真田幸隆的智謀，丟掉了居城，得到了越後的長尾景虎的庇護。"],["村上國清",63,72,57,60,58,25,57,"武士","佛教","CBDDDDDDC","",1546,1603,1561,[0,100,0,0,0],"上杉家臣，義清之子。與武田信玄作戰失敗，和父親一起逃到越後，以後為上杉家效力，改姓山浦。與德川家康締結和議等等，做出了貢獻。"],["屋代政國",60,54,52,61,51,27,62,"武士","佛教","DCDDDDDDC","",1525,1587,1540,[0,0,0,0,0],"信濃的豪族，屋代城主。開始時屬於村上義清，但是投降了武田信玄的信濃侵襲軍。武田家滅亡後，跟隨成為信濃海津城主的織田家臣森長可。"],["屋代勝永",52,46,58,45,42,27,65,"武士","佛教","DDDDDCDDD","",1558,1623,1573,[0,0,0,0,0],"武田家臣，滿正之子，成為伯父政國的義子。主家滅亡後，幫助德川家康平定信濃，以後為德川家效力。大阪冬季、夏季兩次戰役中擔任旗奉行。"],["須田滿親",55,50,81,74,55,23,72,"武士","一向宗","CCDDBDDDB","",1526,1598,1541,[100,0,0,0,300],"信濃的豪族，指導了信濃的一向起義。後來為上杉景勝效力，負責對付北陸的一向起義。擔任信濃海津城主，與德川家康的信濃侵襲軍作戰。"],["須田長義",71,66,78,53,61,23,36,"武士","一向宗","BCDCBDDCD","",1579,1615,1594,[400,0,0,100,200],"上杉家臣。梁川城代，滿親之子。關原會戰中，與本莊繁長合力，在福島口擊敗伊達政宗軍。大阪夏季戰役也立下軍功，得到了德川秀忠的表彰。"],["高梨政賴",70,57,50,40,63,24,51,"武士","佛教","CDADDBDCC","",1508,1559,1523,[0,0,400,0,0],"信濃的豪族。住在信濃中野小館，高梨家是清和源氏，以住在高井郡高梨的井上盛滿為始祖。敗給武田信玄的北信濃侵襲軍，投靠了越後的長尾景虎。"],["高梨秀政",51,66,40,54,50,24,44,"武士","佛教","CDBDDDDDD","",1528,1572,1543,[100,0,100,0,0],"信濃的豪族，政賴之子，屬於上杉家。主公謙信出兵關東的時候，守正謙信的居城春日山城，第四次川中島會戰的時候，擔任上杉軍的先鋒。"],["高梨賴親",41,38,48,42,45,24,46,"武士","佛教","DDDCDDDDD","",1557,1603,1572,[0,0,0,0,0],"信濃的豪族，秀政之子。本能寺事變後，上杉景勝給了其安源寺2千貫的地，回到居城中野小館。後來跟隨景勝移封到會津，離開了居城。"],["蘆田信蕃",62,68,59,22,51,24,35,"武士","佛教","CCDDDCDDD","",1548,1583,1563,[100,100,0,0,0],"武田家臣，擔任遠江二俁城主。與父親信守一起和德川軍作戰，主家滅亡後，為德川家效力，參加了進攻信濃，進攻信濃岩尾城時，中彈陣亡。"],["島津忠直",46,40,45,42,37,30,70,"武士","佛教","DDDDDDDDD","",1534,1604,1549,[0,0,0,0,0],"信濃的豪族，長沼城主。被武田信玄趕出居城，投靠了上杉謙信，以後為上杉家效力。武田家滅亡後，恢復了舊領地。後來跟隨主家移封到會津。"],["小笠原貞慶",60,71,40,63,70,2,49,"武士","佛教","DASDDDDCD","",1546,1595,1561,[0,400,400,0,0],"德川家臣，長時的嫡男。流浪各國後，得到德川家康的援助，恢復了舊領地，以後為德川家效力。讓兒子秀政娶了家康的孫子，加強了關係。"],["二木重吉",50,47,66,61,83,3,86,"武士","佛教","CCDDCDDCD","",1530,1616,1545,[0,0,0,0,100],"小笠原家臣。本能寺事變後，在德川家康的幫助下，從深志城趕走上杉家麾下的小笠原貞種，恢復了主家的舊領地。後來著作了《二木家記》。"],["犬甘政德",57,52,34,35,80,5,39,"武士","佛教","DCDDDDDDC","",1516,1555,1531,[0,0,0,0,0],"小笠原家臣。主公長時被武田信玄趕走後，仍然艱守居城犬甘城進行抵抗，可是，出迎長時大軍的途中與武田軍遭遇，交戰，敗北。"],["犬甘久知",61,66,62,37,73,5,74,"武士","佛教","CCDDDCDDD","",1546,1620,1561,[100,0,0,0,0],"小笠原家臣，政德的三子。以侍大將的身份參加攻打信濃日岐城等各地的會戰，表現活躍。後來作為首席家老，被給與家中最高的1千6百石俸祿。"],["諏訪賴忠",35,36,41,62,61,13,70,"僧侶","佛教","DCDDDDDCD","",1536,1606,1551,[0,0,0,0,0],"武田家臣，滿鄰之子。在主家統治下就任諏訪大社大祝，主家滅亡後，平定諏訪而自立，曾經歸屬北條家，後來為德川家效力，保全了本來領地。"],["保科正俊",66,88,28,18,42,73,84,"武士","佛教","SCDDDDDDD","",1509,1593,1524,[400,100,0,0,0],"武田家臣，信濃高遠城主。作為信濃先方眾參加了各地的會戰，綽號“槍彈正”，作為戰國三彈正之一被記述在《甲陽軍鑑》中。"],["木曾義在",46,39,77,83,76,83,65,"武士","佛教","DCCDBDDDA","",1493,1558,1508,[0,0,100,0,200],"信濃木曾谷的豪族。性格溫和，盡力改善和從父親義元時代就對立的飛驒的三木家的關係，安定領地內的治安。人稱“風流太守”。"],["木曾義康",56,63,60,64,63,80,65,"武士","佛教","CBDDDDDDC","",1514,1579,1529,[100,100,0,0,0],"信濃木曾谷的豪族，義在的嫡男。與村上義清、小笠原長時、諏訪賴重一起稱為“信濃的四大將”，頑強抵抗武田信玄的攻擊，但是失敗，投降了。"],["木曾義昌",61,60,63,52,33,81,55,"武士","佛教","DCDDDDDDC","",1540,1595,1555,[0,100,0,0,0],"信濃木曾谷的豪族，義康的嫡男。娶了武田信玄的女兒，後來與織田信長有來往，成為了武田家滅亡的原因。本能寺事變後屬於德川家康，被轉封到下總。"],["山村良候",34,36,69,66,65,88,58,"武士","佛教","DDCDCDDCD","",1544,1602,1559,[0,0,0,0,200],"木曾家臣，良利之子。主家轉封後也留下木曾。關原會戰的時候屬於東軍，被西軍俘虜，但是後來釋放，戰後，德川家康讓他負責木曾福島。"],["山村良勝",40,38,59,71,78,87,71,"武士","佛教","DDDDDCDDC","",1563,1634,1578,[0,0,0,0,0],"木曾家臣，良候之子。關原會戰中屬於東軍，與千村良重一起平定了木曾，還攻打了尾張犬山張。後來為尾張德川家效力，參加了大阪戰役。"],["三木嗣賴",62,58,58,61,54,48,56,"高家","佛教","CDCDDDDDC","",1516,1572,1531,[0,0,100,0,0],"飛驒的豪族，直賴之子。繼承了飛驒國司姊小路家的家業，改姓姊小路，聯合上杉謙信，結交武田信玄，與江馬家進行軍事、外交戰。"],["三木自綱",70,60,77,66,47,48,47,"高家","佛教","CBCDBBDCD","",1540,1587,1555,[0,100,0,0,300],"飛驒的豪族，良賴的長子。討伐周圍的貴族，統一了飛驒。本能寺事變後與佐佐成政聯合，對抗羽柴秀吉，但失敗後，隱居在京都，直到死去為止。"],["三木顯綱",50,45,63,41,32,53,39,"高家","佛教","DDCDDCDDC","",1544,1583,1559,[0,0,0,0,0],"姊小路家臣，姊小路良賴的次子。毒殺義父鍋山安室，趕走義母，奪取了鍋山城，後來因為企圖對兄長賴綱謀反，與妻子一起被暗殺。"],["三木國綱",19,34,64,40,12,47,39,"高家","佛教","DDDDDCDDD","",1546,1585,1561,[0,0,0,0,0],"姊小路家臣，娶了主公賴綱之妹。敗給金森長近率領的飛驒侵襲軍，被俘虜，但是被饒了性命。後來，不滿長近的統治，發動謀反，失敗身死。"],["內島氏理",46,40,36,65,35,94,44,"武士","佛教","CDDDDDDDD","",1541,1585,1556,[0,0,0,0,0],"飛驒的豪族，歸雲城主。投降豐臣家臣金森長近的飛驒侵襲軍，但是由於地震，居城被埋沒，山崩引發洪水，滅亡了。現代留有埋藏著寶藏的傳說。"],["江馬時盛",35,37,42,53,37,93,64,"武士","佛教","DCDDDDDCD","",1509,1573,1524,[0,0,0,0,0],"飛驒的豪族，諏訪城主。與三木家爭鬥，與武田家締結友好，但是與主張和上杉家構築關係的嫡男輝盛對立，被輝盛的刺客殺死。"],["江馬輝盛",56,55,69,60,4,93,47,"武士","佛教","DDCDCCDDD","",1535,1582,1550,[0,0,100,0,200],"飛驒的豪族，時盛的嫡男。殺害和自己意見不和的父親，趕走弟弟信盛，掌握了江馬家。趁著本能寺之變想打倒姊小路賴綱，但是反而被殺。"],["鹽屋秋貞",36,31,44,71,58,44,62,"商人","佛教","DDCDDCDDC","",1521,1583,1536,[0,0,0,0,0],"飛驒的土豪，尾崎城主。歸屬上杉謙信，在越中和飛驒表現活躍，被謙信任命為目代。謙信死後，歸屬織田信長，但是在與越中土豪進行的戰鬥中陣亡。"],["上杉謙信",120,105,74,54,100,15,48,"武士","佛教","BSCDCACCD","車輪",1530,1578,1545,[400,700,100,0,200],"越後的戰國大名，為景的次子。上杉憲政讓給他關東管領職，改姓上杉，“毘”字旗飄揚，在戰場馳聘的形象令人神恐懼，人稱“越後之龍”。"],["上杉景勝",93,87,71,84,98,10,68,"武士","佛教","BACBCBCBA","車輪",1555,1623,1570,[400,400,100,100,0],"出羽米澤藩主，長尾政景之子，成為上杉謙信的義子。謙信死後，在御館之亂中取得勝利，繼承了家業。關原會戰中屬於西軍，與最上伊達軍作戰。"],["上杉景虎",35,44,25,55,31,79,25,"武士","佛教","CDDDDDCDC","",1554,1579,1569,[0,0,0,0,0],"北條氏康之七子。越相同盟成立的時候去了越後。後來作了上杉謙信的義子。謙信死後，在「御館之亂」中與上杉景勝爭奪家業，戰敗身死。"],["長尾政景",85,76,69,75,58,19,38,"武士","佛教","CABDCDCCB","",1526,1564,1541,[0,400,0,0,100],"長尾家臣，房長之子。和父親一起與主家敵對，但是後來和解，娶了主公景虎之姐。此後輔佐景虎，表現活躍，在和宇佐美定滿乘船遊玩時溺死。"],["上杉景信",52,31,43,61,42,2,51,"武士","佛教","DCCDDCDDD","",1527,1578,1542,[0,0,100,0,0],"上杉家臣。主公謙信就任關東管領的時候，和謙信一起改姓上杉。作為家族的重要人物轉戰各地。御館之亂中屬於上杉景虎方，陣亡了。"],["色部勝長",65,77,40,31,50,16,75,"武士","佛教","DBDDDCDCD","",1493,1568,1508,[0,400,0,0,0],"上杉家臣，平林城主，上條之亂以後成為家臣。川中島會戰中表現活躍，受到了表彰。本莊繁長謀反的時候，在進攻繁長的居城本莊城的過程中病死了。"],["色部顯長",73,75,40,25,71,14,38,"武士","佛教","CBDDDDDDC","",1549,1587,1564,[100,100,0,0,0],"上杉家臣，平林城主，勝長之子，主公謙信授與他名字。父親死後，他繼承了家業。鎮壓本莊繁長謀反中表現活躍，以後，被授與高於繁長的地位。"],["色部長實",58,69,55,40,61,16,37,"武士","佛教","DCDDDCDDD","",1555,1592,1570,[0,100,0,0,0],"上杉家臣，平林城主，勝長之子。兄長顯長死後，他繼承了家業。鎮壓出羽仙北暴動等作戰中表現活躍。參加豐臣秀吉出兵朝鮮行動中，患了重病，死亡。"],["大熊朝秀",8,12,69,81,19,88,65,"武士","佛教","DDDDCDDDA","",1517,1582,1532,[0,0,0,0,100],"長尾家臣，越後箕冠城主。作為主公景虎的親信參與政務，趁著景虎的出家騷動發動叛亂，但是失敗了，以後為武田家效力，在甲斐天目山陣亡。"],["柿崎景家",90,95,12,64,45,14,62,"武士","佛教","BSDDDADCD","",1513,1575,1528,[100,400,0,0,0],"上杉家臣，家中頭號猛將。主公謙信說“越後七郡中無出其右者”作為上杉軍的主力表現活躍，但是被懷疑勾結織田信長，被殺。"],["河田長親",60,49,81,73,54,15,41,"武士","佛教","CCCCBDDDB","",1540,1581,1555,[0,0,100,100,300],"上杉家臣，近江出身。主公謙信上京的時候，他接受邀請，成為家臣。為主家進攻北陸做出了巨大貢獻。後來成為越中松倉城主，與織田信長軍作戰。"],["北條高廣",80,82,44,33,6,87,70,"武士","佛教","BBDDDBDDC","",1517,1587,1532,[100,100,0,0,0],"上杉家臣，擔任廄橋城主。負責經營關東等等，表現活躍。接受武田信玄和北條氏康等人的邀請，屢屢發動謀反，但是被饒恕，返回。"],["北條景廣",72,73,42,19,55,2,31,"武士","佛教","DCDDDCDCD","",1548,1579,1563,[0,100,0,0,0],"上杉家臣，高廣之子。與父親在廄橋城，幫助主公謙信經營關東，御館之亂的時候擔任上杉景虎方的核心，但是後來被上杉景勝暗殺。"],["齋藤朝信",87,80,82,76,79,15,64,"武士","佛教","BACDBCCCA","",1527,1591,1542,[100,400,100,0,200],"上杉家臣。在川中島會戰和下野佐野進攻戰等戰役中表現活躍，得到“越後的鐘馗”的綽號。謙信死後歸屬景勝，沒有私欲，在行政方面也發揮了優秀的才能。"],["新發田綱貞",42,39,75,72,38,89,49,"武士","佛教","DDCDBDDDB","",1512,1561,1527,[0,0,0,0,300],"上杉家臣，新發田五十公野城主，稱伯耆守。上條定憲與長尾為景作戰的混亂之際，他開始加入了長尾方，但是後來又轉入上條方，與長尾軍作戰。"],["新發田長敦",60,63,57,73,46,89,42,"武士","佛教","CDDDDDDBC","",1538,1580,1553,[0,0,0,0,0],"上杉家臣，新發田五十公野城主，綱貞之子。上條定憲之亂平息以後，幫助返回上條方國人眾的長尾家。御館之亂的時候屬於上杉景勝。"],["新發田重家",71,81,31,20,35,12,41,"武士","佛教","DBDDDBCDC","",1546,1587,1561,[0,400,0,0,0],"上杉家臣。御館之亂的時候屬於上杉景勝，為勝利做出了貢獻。可是對給與自己的恩賞不滿，勾結織田信長，守住居城新發田城發動謀反，失敗後自盡了。"],["直江景綱",63,51,80,83,85,12,69,"武士","佛教","CDCDBDDDA","",1509,1578,1524,[0,100,100,0,200],"上杉家臣，與板城主。深得主公謙信的厚愛，作為親信在內政和外交方面發揮了出色的作用。後來從謙信的舊名景虎中拜領了一字，從實綱改名為景綱。"],["直江兼續",88,78,90,91,99,10,59,"武士","佛教","BADBSACAS","車輪",1560,1619,1575,[100,400,0,100,400],"上杉家臣，擔任首席家老。得到豐臣秀吉的高度評價，作為陪臣還享受到出羽米澤30萬石俸祿。關原會戰的時候屬於西軍，給德川家康送去了“直江信”。"],["中條藤資",72,78,70,52,55,88,94,"武士","佛教","ABDDCCDDD","",1480,1574,1495,[100,400,0,0,200],"上杉家臣。主公為景與關東管領上杉顯定作戰的時候，跟隨為景在各地表現活躍。短暫背叛，但是不久返回。後來參加川中島會戰，受到了表彰。"],["本莊繁長",88,90,39,24,48,99,74,"武士","佛教","CADDDBCCC","",1539,1613,1554,[100,400,0,0,0],"上杉家臣，本莊城主。討伐叔父小川長資，奪回居城，繼承了家業。與武田信玄勾結，發動謀反，但是被饒恕，返回了。以後在各地的會戰中表現出色。"],["本莊實乃",48,37,77,74,71,98,69,"武士","佛教","DDCDBDDBB","",1511,1580,1526,[0,0,0,0,100],"上杉家臣，槴尾城主。主公景虎進大阪尾城以來，成為親信。景虎第一次上戰場的時候，輔佐景虎。後來景虎繼承了長尾家，他參與政權的核心。"],["安田景元",66,69,47,39,63,89,49,"武士","佛教","CBDDDCDCD","",1514,1563,1529,[100,100,0,0,0],"上杉家臣，安田城主。上條定憲之亂的時候跟隨長尾為景，表現活躍。北條高廣背叛主家的時候，將此消息稟報給直江景綱，跟隨主公謙信與高廣作戰。"],["安田顯元",57,62,60,63,73,89,42,"武士","佛教","DCCDDDDDD","",1538,1580,1553,[0,0,100,0,0],"上杉家臣，安田城主，景元之子。擔任信濃飯山城主，防備武田家。御館之亂的時候支持上杉景勝，表現活躍，後來因為恩賞問題發生糾葛，自盡了。"],["安田能元",49,52,63,74,67,14,65,"武士","佛教","DDCDDDDCB","",1557,1622,1572,[0,0,0,0,0],"上杉家臣，安田城主。其兄顯元因為賞賜問題而自殺，於是繼承其兄的位置。追隨主家移封到會津，擔任二本松城代。屬於會津三奉行之一。"],["安田長秀",62,74,54,44,78,20,67,"武士","佛教","DBCDDDDDD","",1516,1583,1531,[0,100,100,0,0],"上杉家臣，身居其主謙信之側。活躍於川中島之戰，授與「血染感謝狀」，在御館之亂支持上杉景盛，和新發田重家交戰時病故。"],["宇佐美定滿",78,55,97,42,36,12,75,"武士","佛教","BCBDSADAD","",1489,1564,1504,[100,0,100,0,400],"上杉家臣，據說是越後流軍學鼻祖。上條定憲之亂的時候屬於上條方，但是定憲死後返回。參與國政等等，表現活躍，但是與長尾政景乘船遊玩的時候溺死了。"],["鬼小島彌太郎",38,94,2,1,92,15,60,"武士","佛教","ACBDDDDDD","",1522,1582,1537,[400,100,100,0,0],"上杉家臣，年幼時即常在其主謙信身旁，參加川中島之戰。為勇猛無雙的豪傑，光是叫「鬼小島」的名字都會令人害怕。於是留下為數不少的傳說。"],["甘粕景繼",77,70,24,29,61,12,61,"武士","佛教","CBBDDBDCD","",1550,1611,1565,[0,100,0,0,0],"上杉家臣，酒田城主。追隨主家移封會津擔任白石城代。關原之戰時，主張抗戰。後來伊達軍趁居城無人之際而攻擊，於是失去居城。"],["岩井信能",37,33,50,76,58,12,67,"武士","佛教","DDCDDDDCA","",1553,1620,1568,[0,0,0,0,0],"上杉家臣，御館之亂中支持上杉景勝，成為信濃飯山城主。整頓城下町，建築了近世飯山町，景勝轉封會津後，他成為會津三奉行之一。"],["春日元忠",52,28,56,77,52,14,49,"武士","佛教","DDDCDDDDA","",1559,1608,1574,[0,0,0,0,0],"上杉家臣，一開始仕於武田家。為直江兼續心腹，頗得兼續的信賴。稱為「直江被官的棟樑」。即使在軍事方面，也曾在攻打最上家的時候活躍。"],["志田義秀",68,60,49,70,56,12,72,"武士","佛教","DCDCDDDDC","",1560,1632,1575,[0,0,0,100,0],"上杉家臣。在川中島會戰時，繼承父親義時之後位。曾擔任酒田城主。在關原會戰時，有牽制最上家的背後等傑出表現。後來成為米澤藩的執事，負責統括藩政。"],["水原親憲",73,75,34,13,64,12,70,"武士","佛教","DCDBDBCDD","",1546,1616,1561,[0,100,0,100,0],"上杉家臣，水原館主。御館之亂的時候支持上杉景勝，景勝移封會津後，他擔任豬苗城代，在大阪戰役中立下軍功，得到了德川秀忠的表彰。"],["平林正恒",30,30,51,71,54,30,72,"武士","佛教","DDDCDDDDC","",1550,1622,1565,[0,0,0,0,0],"武田家臣。在主家滅亡時，雖然失去居城牧之島，但後來得到上杉景勝的支援而取回，接著便侍奉上杉家。追隨主家轉封至會津，而擔任白河城代。"],["神保長職",61,57,52,69,40,81,67,"武士","佛教","CCDDDDDCB","",1505,1572,1520,[100,0,0,0,0],"越中豪族，富山城主。將神保家擴展成越中的最大勢力，但是卻敗於上杉謙信而投降。後來由於意見的對立造成家中分裂，神保家於是再度衰敗。"],["神保長城",58,40,28,37,35,86,46,"武士","佛教","DDBDDDDDC","",1537,1583,1552,[0,0,0,0,0],"越中豪族，父親‧長職流放其兄‧長住後繼任家督。父親死後實權反掌握在家臣‧小島職鎮的手中。長住回到越中之後，才歸還神保家的家督位置。"],["神保氏張",46,44,41,57,49,81,64,"武士","佛教","CDDDDCDDC","",1528,1592,1543,[0,0,100,0,0],"越中的豪族，是森山城主。起先侍奉上杉家，後來轉而侍奉織田家的佐佐成政。追隨成政移封肥後，與國人一揆作戰。成政死後改侍奉德川家。"],["小島職鎮",52,36,72,65,16,86,64,"武士","佛教","DDCDABDDD","",1523,1587,1538,[0,0,0,0,300],"神保家臣，越中日宮城主。與主公長職一起屬上杉家。長職死後，他把握了主家的實權。後來幽禁了返回越中的神保長住，成為主家滅亡的原因。"],["寺島職定",48,45,23,63,42,73,64,"武士","一向宗","DDCDDDDDC","",1510,1574,1525,[0,0,0,0,0],"神保家臣，池田城主。擔任交涉椎名家的工作，也活躍於民政方面。主家內亂之際連同神保長住一起投靠武田方，卻遭到上杉謙信的攻擊而敗北。"],["水越勝重",42,31,48,71,66,78,64,"武士","佛教","DDDDDDDBC","",1513,1577,1528,[0,0,0,0,0],"神保家臣，參與了建築富山城和瀧山城。主家衰落後，和一向起義軍一同與上杉謙信作戰，但是戰敗，抓到一向起義軍的頭領向上杉軍投降，保住了性命。"],["寺崎盛永",60,47,34,24,37,74,36,"武士","佛教","CDDDDDDCD","",1545,1581,1560,[100,0,0,0,0],"越中的豪族，願海寺城主。很早就為神保家效力，討伐敵對勢力等行動中表現活躍。後來歸屬織田家，但是由於叛變到上杉家而招致攻擊，敗北後被迫自盡。"],["畠山義續",54,33,26,64,48,83,72,"武士","佛教","DCDDDDBCD","",1518,1590,1533,[0,0,0,0,0],"能登守護，義總的嫡男。相繼的內亂中失去了權力，後來與兒子義綱協力恢復了實權，但是招致重臣們的反感，被趕出了能登。"],["畠山義綱",66,48,44,72,79,83,57,"武士","佛教","DCBDDDBCA","",1536,1593,1551,[0,100,100,0,0],"能登守護，義續的嫡男。與父親一起盡力恢復實權，但是被重臣們趕走，以失敗告終。此後，多次試圖進入能登，均以失敗告終。"],["畠山義慶",41,38,12,45,61,85,18,"武士","佛教","DCDDDDCDC","",1556,1574,1566,[0,0,0,0,0],"能登的戰國大名。義綱的嫡子。祖父‧義續及父親被流放後，年幼時即受重臣們的擁立。不久後因被捲入重臣們的紛爭中，而遭到某人殺害。"],["畠山義隆",50,47,48,44,54,83,19,"武士","佛教","DDCDDDDCD","",1557,1576,1572,[0,0,0,0,0],"能登的戰國大名，義綱之子。兄長義慶成為當主時，他任二本松伊賀守，輔佐義慶。義慶死後，他繼承了畠山的家業，但是不久就猝死了。"],["上條政繁",68,71,49,61,51,84,90,"武士","佛教","CBCDDCBDC","",1553,1643,1568,[100,100,0,0,0],"上杉家臣，畠山義續的次子。成為上杉謙信的義子，繼承了上條家。轉戰上野、越中等地。謙信死後，與上杉景勝對立，出走，以後為德川家效力。"],["長續連",62,44,71,62,42,77,59,"武士","佛教","CDCDCDCDC","",1518,1577,1533,[100,0,0,0,100],"畠山家臣，畠山七人眾之一。鎮壓溫井、三宅一黨的叛亂等表現活躍，作為主要的重臣，掌握著畠山家的實權。後來與織田信長聯結，被上杉謙信殺死。"],["長連龍",55,52,61,56,63,77,73,"武士","佛教","DDDDDDCCD","",1546,1619,1561,[0,0,0,0,0],"畠山家臣，續連的次子。父親和兄長綱連死後，他還俗，繼承家業。臣從於織田信長，成為能登福水城主，恢復了舊領地。後來成為前田利家的得力手下。"],["溫井總貞",35,21,77,63,9,88,64,"武士","佛教","CDDDACDDC","",1491,1555,1506,[0,0,0,0,300],"畠山家臣。和歌的造詣極深，深得主公義總的寵愛。打敗遊佐家，掌握了主家的實權，使得領地內動搖。後來被力圖奪回權利的主公義綱殺死。"],["溫井景隆",49,31,70,54,25,88,49,"武士","佛教","DDCDCDDDC","",1533,1582,1548,[0,0,0,0,100],"畠山家臣，續宗之子。祖父總貞死後，被迫離開，趕走主公義綱後返回。後來投入織田家，本能寺事變後，想要恢復領地而起兵，戰敗身死。"],["遊佐續光",50,46,75,65,11,84,54,"武士","佛教","DDCDACCDB","",1527,1581,1542,[0,0,100,0,300],"畠山家臣，秀賴之子。與溫井家之政權鬥爭失敗，出走，但是和解後返回。後來呼應上杉家，統治能登，後來被織田家虜獲斬首。"],["遊佐盛光",26,14,60,45,22,84,34,"武士","佛教","DDDDCDDDD","",1547,1581,1562,[0,0,0,0,200],"畠山家臣，續光之子。作為老臣參與國政。聯合上杉家，趕走長家。織田家的勢力擴張過來時，就招致長家的攻擊，被俘獲，斬首。"],["三善一守",55,48,43,33,32,68,68,"武士","佛教","DDDDDDDCD","",1547,1615,1562,[0,0,0,0,0],"畠山家臣，越中池田城主。投降上杉謙信的能登侵襲軍。謙信死後，投靠佐佐成政，跟隨成政移封到肥後。成政死後，移住到能登羽咋郡，退隱。"],["朝倉義景",34,25,34,60,3,50,40,"武士","佛教","DDDDDDDCD","",1533,1573,1546,[0,0,0,0,0],"朝倉家第5代當主，孝景的嫡男。與將軍足利義昭聯合，擔任織田信長包圍網的一部分，但是逐漸失去威勢。刀禰阪會戰中敗北，眾叛親離，自盡了。"],["朝倉景鏡",64,45,72,42,7,21,49,"武士","佛教","DCDDBCDDD","",1525,1574,1540,[0,100,0,0,200],"朝倉家臣，景高之子。擔任追擊織田信長的總指揮。主公義景在刀禰阪會戰失敗後，他串通信長，迫使義景自盡。後來，被一向起義軍殺死。"],["朝倉教景",95,90,91,77,88,51,78,"僧侶","佛教","AABDAACDB","",1477,1555,1492,[100,400,100,0,300],"朝倉家臣，朝倉家初代當主敏景之子。擔任軍奉行，向周邊諸國出兵，使國內外盡知朝倉家的武威。討伐加賀一向起義的時候發病，回國後去世。"],["朝倉景紀",68,59,52,57,50,52,69,"武士","佛教","BCCDDBCCD","",1503,1572,1518,[100,100,0,0,0],"朝倉家臣，朝倉家第3代當主貞景之子，成為朝倉教景的義子。擔任敦賀城主，和義父一起轉戰加賀、若狹、近畿等地，表現活躍，後來成為了敦賀郡司。"],["朝倉景隆",58,64,36,48,56,52,77,"武士","佛教","CDCDDCDDC","",1494,1571,1509,[100,0,100,0,0],"朝倉家臣。是朝倉敏景之弟、經景之孫。在朝倉宗滴因病回國後，擔任討伐一向一揆之大將而出陣至加賀。後來陸續失去三子，自己也隨即身亡。"],["朝倉景健",67,70,33,25,18,72,39,"武士","佛教","CBDDDDDCD","",1536,1575,1551,[100,100,0,0,0],"朝倉家臣，景隆之子。姊川會戰中作為朝倉軍的總指揮英勇奮戰。主家滅亡後，歸屬織田信長，但是由於投降了一向起義軍，惹得信長大怒，令他自盡。"],["魚住景固",17,18,32,68,37,53,43,"武士","佛教","DDDDDDDDB","",1531,1574,1546,[0,0,0,0,0],"朝倉家臣。作為一乘谷四奉行之一參與國政。投降織田信長的越前侵襲軍，保全了自己的領地，成為越前守護代，但是招致富田長繁的進攻，戰敗身死。"],["河合吉統",40,27,60,71,78,51,52,"武士","佛教","DDCDDDDDA","",1521,1573,1536,[0,0,0,0,0],"朝倉家臣。為一乘谷四奉行之一，參與國政的規劃，並曾為了救援淺井家而出戰近江。據說在刀禰阪合戰的時候，被織田軍所殺。"],["富田景政",57,98,13,10,58,4,69,"劍豪","佛教","BDDDDDDDD","混戰",1525,1594,1540,[400,0,0,0,0],"朝倉家臣，富田流劍術始祖。號稱勢源。主家滅亡後改仕於前田家，活躍於多場戰役。隱居後成為七尾城守將，曾經指導豐臣秀次劍術。"],["富田重政",55,95,48,10,73,3,71,"劍豪","佛教","ADDDDDDCD","混戰",1554,1625,1569,[400,0,0,0,0],"前田家臣。綽號“名人越後”，中條流劍術的高手。在能登末森城的戰鬥中立下頭功。在征伐小田原、關原會戰、大阪兩次戰役中也表現活躍。"],["前波吉繼",20,24,64,54,42,72,33,"武士","佛教","DDDDCCDDC","",1541,1574,1556,[0,0,0,0,300],"朝倉家臣。早早投降織田信長的越前侵襲軍，負責帶路。因為此項功績，成為越前守護代，但是招致對此事不服氣的富田長繁的進攻，戰敗身死。"],["真柄直隆",51,92,15,5,93,50,34,"武士","佛教","BDCDDDDDD","",1536,1570,1551,[400,0,100,0,0],"朝倉家臣。和弟弟直澄都是家中頭號的剛勇之士，威名遠播，姊川會戰中自己方敗走時，與德川軍奮戰，和兒子隆基一起陣亡。"],["山崎長德",42,37,31,24,14,69,68,"武士","佛教","CDDDDCDCD","",1552,1620,1567,[0,0,0,0,0],"朝倉家臣。主家滅亡後，跟隨明智光秀，參加了本能寺之變。光秀死後，跟隨柴田勝家，參加了賤岳會戰。勝家死後，為前田家效力，後來為德川家效力。"],["淺井久政",30,24,31,69,96,50,47,"武士","佛教","DDDDDDDDB","",1526,1573,1541,[0,0,0,0,0],"近江的戰國大名，小谷城主，亮政之子。由於採取投入六角家麾下的政策，家臣們極為不滿，後來將家業讓給兒子長政。淺井家滅亡時他自盡了。"],["淺井長政",90,85,70,51,93,73,28,"武士","佛教","BACBCBDDC","",1545,1573,1560,[100,400,100,100,200],"近江的戰國大名，小谷城主，久政之子。娶織田信長的妹妹市為妻，但是他更看重與朝倉家的友誼，與信長敵對。居城被攻下後，將市和女兒們託付給信長，自盡。"],["赤尾清綱",64,69,52,70,77,66,59,"武士","佛教","CCCDDDDBC","",1514,1573,1529,[100,100,0,0,0],"淺井家臣，與海北綱親、雨森彌兵衛並稱“海赤雨三將”。在主家的居城小谷城設置了赤尾曲輪。主家滅亡時被俘，被斬首。"],["阿閉貞徵",11,31,40,23,16,55,54,"武士","佛教","DDDDDDDDC","",1528,1582,1543,[0,0,0,0,0],"淺井家臣，山本山城主。主家滅亡後跟隨織田信長，參加了信長的進攻越前行動。本能寺事變後跟隨時明智光秀，光秀死後，和兒子貞大一起被殺。"],["磯野員昌",81,79,36,15,30,73,49,"武士","佛教","CBBDDCDCD","",1534,1583,1549,[0,100,400,100,0],"淺井家臣，佐合山城主。姊川之戰時擔任先鋒奮戰不懈。後來降於織田信長。雖擔任新庄城主，卻遭到責罰，領地被收回而出奔至高野山。"],["遠藤直徑",68,87,66,8,93,50,29,"武士","佛教","BBDCDCDCD","",1541,1570,1556,[100,400,0,0,0],"淺井家臣，家中頭號猛將，人人皆知。向主公長政獻計暗殺知田信長，但是沒有被採納。姊川會戰的時候，一個人突入信長的主營，陣亡。"],["海北綱親",71,65,76,39,68,65,64,"武士","佛教","CBDDBBDDC","",1509,1573,1524,[100,100,0,0,300],"淺井家臣，畫家海北友鬆的父親。豐臣秀吉稱他為“我的軍法之師”，是員勇將。擔任武者奉行，在各地表現活躍。主家滅亡時陣亡。“海赤雨三將”之一。"],["片桐且元",55,70,39,60,70,2,59,"武士","佛教","CDDCDDDDC","",1556,1615,1571,[100,0,0,100,0],"豐臣家臣，賤岳七條槍之一。作為主公秀賴的傅役，為了主家的生存而奔忙，但是由於被懷疑勾結德川家康，離開了大阪城。以後跟隨了德川家康。"],["藤堂高虎",77,64,95,93,1,94,74,"武士","佛教","BCDBSABSB","",1556,1630,1571,[100,0,0,100,400],"除了德川家康，還為7名主公效力過，每更換一次主公俸祿都有所增加，領受伊勢安濃津32萬石俸祿。會戰中經常擔任先鋒，英勇奮戰，還負責過許多城的建築。"],["宮部繼潤",62,48,77,65,32,3,71,"僧侶","佛教","DDBDBCDCD","",1528,1599,1543,[0,0,100,0,300],"淺井家臣。開始時是比叡山的僧人，主家滅亡後，為織田信長效力。擔任羽柴秀吉率領的中國征伐軍的先鋒，成為了因幡鳥取城主。晚年成為了秀吉的屬下。"],["石田三成",52,20,85,99,98,20,40,"庶民","佛教","DDDDBBCAS","",1560,1600,1575,[0,0,0,0,100],"豐臣家臣，作為五奉行之一參與國政。主公秀吉死後，作為西軍總指揮與德川家康在關原作戰，但是指揮不了諸將，戰敗，在京都被斬首。"],["大谷吉繼",90,78,91,89,99,20,41,"武士","佛教","ACBBBBCAA","強襲",1559,1600,1574,[400,100,0,100,200],"豐臣家臣，關原會戰中屬於西軍。為了親友石田三成，帶病奮戰，擊退藤堂高虎軍，但是招致叛變的小早川秀秋軍攻擊，戰敗，自盡了。"],["大野治長",25,14,42,56,74,21,45,"武士","佛教","DDDDDCDCC","",1570,1615,1585,[0,0,0,0,0],"豐臣家臣。片山桐元離開大阪城後，整頓大阪城內。大阪戰役中擔任豐臣方的指導者。大阪城陷落的時候，為主公秀賴殉死。"],["木村重成",47,74,31,16,83,20,22,"武士","佛教","DBDCDDDDD","",1593,1615,1608,[0,0,0,100,0],"豐臣家臣，定光之子。是主公秀賴的兄弟，擔任侍從。與德川家和解的時候擔任豐臣家的使者，大阪夏季戰役中與井伊直孝軍作戰，陣亡了。"],["田中吉政",59,52,45,63,35,98,61,"武士","佛教","CDDCDDDCC","",1548,1609,1563,[100,0,0,0,0],"豐臣家臣，開始時跟隨宮部繼潤。擔任豐臣秀次的家老，領受三河岡崎5萬石俸祿。關原會戰中屬於東軍，抓住了石田三成，領受筑後柳川32萬石俸祿。"],["長束正家",8,11,20,96,25,23,44,"武士","佛教","DDDDDDDBA","",1556,1600,1571,[0,0,0,0,0],"丹羽家臣。主家沒落後為豐臣家效力，成為五奉行之一。精通算術，負責主家收繳賦稅等財政工作。關原會戰中屬於西軍，戰後自盡了。"],["脅阪安治",62,72,40,25,17,6,72,"武士","佛教","CDDCDDCCD","",1554,1626,1569,[100,0,0,100,0],"豐臣家臣，賤岳七條槍之一。主公秀吉征伐中國的時候，打敗“丹波的紅鬼”赤井直正，立下大功。關原會戰中，叛變到東軍，保全了領地。"],["渡邊勘兵衛",60,86,46,6,4,61,78,"武士","佛教","ADDDDBDDD","",1562,1640,1577,[400,0,0,0,0],"阿閉家臣。主家滅亡後，先後為豐臣、中村、增田、藤堂家效力過。豐臣秀吉征伐小田原時，他第一個攻入伊豆山中城，得到秀吉的讚賞。大阪之戰後成為浪人。"],["六角義賢",58,72,55,37,30,33,77,"武士","佛教","CDSDDBDCD","",1521,1598,1536,[100,0,400,0,0],"近江的戰國大名，定賴之子。向江南擴張勢力。保護了被三好家趕出京都的足利將軍家，為其四方奔走。後來敗給了織田信長的上洛軍，失去了領地。"],["六角義治",36,70,17,28,16,33,68,"武士","佛教","DDADDDDDD","",1544,1612,1559,[0,0,400,0,0],"近江的戰國大名，義賢之子。謀殺了首席家老後藤賢豐，失去了家臣的信賴。敗給了織田信長的上洛軍，在各國流浪。晚年擔任了豐臣秀賴的箭術教練。"],["蒲生定秀",63,60,65,61,50,7,71,"武士","佛教","CCDDCDDCC","",1508,1579,1523,[100,100,0,0,100],"六角家臣。作為六角軍的先鋒出征各地，表現活躍，勇名遠播。主公義治謀殺後藤賢豐的“觀音寺騷動”的時候，負責義治和家臣們之間的調停。"],["蒲生賢秀",53,52,62,60,58,7,50,"武士","佛教","DCCDDDDDC","",1534,1584,1549,[0,0,100,0,0],"六角家臣，定秀之子。織田信長上京的時候，由於信長的三子信孝成為妹夫神戶具盛的義子這一層關係，加入織田家。本能寺事變的時候保護了信長的夫人和孩子。"],["蒲生氏鄉",90,82,84,89,78,4,39,"武士","佛教","BADABBCAS","釣瓶擊",1556,1595,1571,[100,100,0,400,200],"織田家臣，賢秀之子。娶了主公信長之女。本能寺事變後為豐臣秀吉效力，表現活躍，領受陸奧會津92萬石俸祿。文才武略，據說秀吉也懼怕他的才能。"],["蒲生秀行",46,42,28,49,43,4,29,"武士","佛教","DCDDDCCDC","",1583,1612,1598,[0,0,0,0,0],"豐臣家臣，氏鄉的嫡男。繼承了陸奧會津92萬石俸祿，但是由於家中內亂，被減封為下野宇都宮18萬石，關原會戰中屬於東軍，恢復了陸奧會津60萬石俸祿。"],["後藤賢豐",49,43,60,73,69,29,44,"武士","佛教","DDCDDDDDB","",1519,1563,1534,[0,0,0,0,0],"六角家臣，與進藤家一起並稱“六角家的兩藤”。主公義賢父子上京的時候，負責護衛。在所謂的“觀音寺騷動”中被主公義治殺死。"],["後藤高治",14,10,40,35,24,29,45,"武士","佛教","DDDDDDDDD","",1544,1589,1559,[0,0,0,0,0],"六角家臣，賢豐的次子。“觀音寺騷動”中父親死亡，他繼承了家業。與進藤家並稱“兩藤”，是義治的重臣，但是敗給織田信長的上洛軍後投降。"],["毛屋武久",44,62,57,15,48,9,74,"武士","佛教","DCDDDCDDD","",1554,1628,1569,[0,100,0,0,0],"黑田家臣，近江出身。為柴田勝家等幾家效力過，後來為黑田家效力。專於偵察，於關原合戰中向德川家康稟報「敵軍為寡勢」的有利情報，因而獲得了獎賞。"],["三雲成持",50,58,48,45,61,29,63,"武士","佛教","CDDDDDDDC","",1540,1603,1555,[0,0,0,0,0],"六角家臣。兄長賢持死後，他繼承了家業。《六角氏式目》中和父親定持一起署名。主家滅亡後，流浪了一段時間，後來為織田信雄、蒲生氏鄉效力。"],["山崎片家",45,39,49,37,37,32,44,"武士","佛教","DDCDDDDCD","",1547,1591,1562,[0,0,0,0,0],"六角家臣，山崎城主。與主公義治不和，遂為織田信長效力。本能寺事變後，一度屬於明智光秀，但是後來為豐臣秀吉效力，領攝津三國2萬3千石俸祿。"],["山崎家盛",31,30,42,50,40,32,47,"武士","佛教","DDDDDDDDC","",1567,1614,1582,[0,0,0,0,0],"豐臣家臣，片家的嫡男。負責伏見城的建築工程等等。關原會戰中屬於西軍，但是由於親戚池田輝政的努力而避免了被免職，領受因幡若櫻3萬石俸祿。"],["吉田重政",52,82,37,8,32,29,59,"武士","佛教","DDSDDDDDD","",1522,1581,1537,[0,0,700,0,0],"六角家臣，吉田流弓術之祖重賢之子。拒絕向主公義賢傳授弓術，而後出走，一度為朝倉家效力。數年後返回，向義賢傳授了弓術。"],["朽木元綱",42,48,68,67,19,61,83,"武士","佛教","DDDDCDDDC","",1549,1632,1564,[0,0,0,0,300],"近江的豪族。晴綱之子。織田信長撤離越前的時候，負責帶路，以後屬於織田家。本能寺事變後為豐臣秀吉效力。關原會戰中叛變到了東軍。"],["橫山喜內",84,87,60,42,95,18,50,"武士","佛教","BADBDCDDD","",1550,1600,1565,[100,100,0,400,0],"蒲生家臣。在征伐九州時立功，受賜蒲生之姓與「鄉」字，名為蒲生鄉舍。後來離開蒲生家而侍奉石田三成。在關原會戰時壯烈戰死。"],["森田凈雲",72,73,63,46,73,43,71,"忍者","佛教","BDCDCCDDC","",1510,1581,1525,[100,0,100,0,300],"伊賀的豪族，領地是豬田鄉。據說是豪族聯合的中心人物之一。面對織田信長的伊賀侵襲軍，守著一個宮城奮戰，終因寡不敵眾而陣亡。"],["植田光次",69,75,65,26,58,39,74,"忍者","佛教","CDBDCDDCD","",1512,1586,1527,[100,0,0,0,100],"伊賀豪族，伊賀十二人眾的中心人物。織田信雄侵略伊賀之際，討伐信雄之臣拓植三郎左衛門而擊退織田軍。後來仍敗給織田軍，逃到三河。"],["大館義實",10,24,25,70,68,40,64,"武士","佛教","DDCDDCDDC","",1537,1601,1552,[0,0,100,0,0],"足利家臣，關岡城主。連仕義輝、義昭兩代。幕府滅亡後失去領地，住在境。後來隨同派兵朝鮮，得到伊賀領地。為著名盔甲研究者。"],["瀧野吉政",61,70,72,32,56,38,49,"忍者","佛教","CDDCBDDDC","",1553,1602,1568,[100,0,0,100,200],"伊賀之豪族，柏原城主，貞清之子。率領國內的豪族連合軍頑強抵抗織田信長的伊賀侵略軍，但仍敗北。戰後，將居城交出給筒井順慶。"],["百地三太夫",60,87,93,11,69,50,74,"忍者","佛教","BDBCSADCD","",1517,1591,1532,[400,0,100,0,400],"伊賀之豪族。跟服部、藤林並為伊賀上忍家之一。雖然使用忍術擊退了織田信雄的伊賀侵略軍，但後來受到織田信長的大軍攻擊，據說因此戰死。"],["足利義輝",74,97,25,56,79,38,29,"高家","佛教","ADBDDDDDD","混戰",1536,1565,1551,[400,0,400,0,200],"室町幕府13代將軍，從上泉信綱那裏學到新陰流的精華。努力恢復失去的幕府權利，但是後來招致松永久秀等人的奇襲，孤軍奮鬥，最後自盡。"],["足利義昭",28,14,92,82,30,50,60,"高家","佛教","DDBDACDDB","",1537,1597,1552,[0,0,100,0,400],"室町幕府15代將軍。在織田信長的支持下就任將軍職，但是後來與信長對立，與周圍諸國聯合形成“信長包圍網”。自己也起兵，但是敗給信長，被趕出了京都。"],["一色藤長",13,10,44,75,85,36,60,"高家","佛教","DDDDDDDDB","",1536,1596,1551,[0,0,0,0,0],"足利家臣，擔任御供眾。與細川藤孝努力救出被禁閉的其主義昭。後來義昭流放京都後，努力奔走，期望能恢復義昭的將軍職位。"],["蜷川親長",15,6,71,69,61,51,76,"高家","佛教","DDDDCDDDB","",1534,1610,1549,[0,0,0,0,100],"足利家臣。在主家滅亡後服侍長宗我部家。關原會戰時，長宗我部家被撤掉後，活躍於鎮壓一揆。後來因對禮制的知識受到賞識而侍奉德川家。"],["京極高吉",26,30,60,58,69,35,73,"高家","佛教","DDCDDDDDC","",1508,1581,1523,[0,0,0,0,0],"足利家臣。為主公義輝效力，義輝死後，為了逃到近江的義輝之弟義昭而奔走。義昭就任將軍後，與織田信長對立，隱居在上平寺。"],["京極高次",43,38,53,52,35,43,46,"高家","佛教","DDDDDDCCD","",1563,1609,1578,[0,0,0,0,0],"豐臣家臣，高吉之子。因為妻子和妹妹的緣故為豐臣秀吉效力。領受近江大津6萬石的俸祿。關原會戰中屬於東軍，鎮守居城，在大津阻止住西軍的一部分。"],["細川藤孝",75,67,89,98,70,55,76,"武士","佛教","BCACADCBA","",1534,1610,1549,[100,0,400,100,200],"足利家臣。主公義輝去世後，為義輝之弟義昭的擁立做出了貢獻。此後由於對形勢的正確判斷，保住了細川家的命脈，作為通今博古的文化人也很有名。"],["細川忠興",74,77,75,86,46,55,82,"武士","佛教","BCCACBCBA","",1563,1645,1578,[100,100,100,400,200],"織田家臣，藤孝之子。娶了明智光秀的女兒，但是本能寺事變後屬於豐臣家。關原會戰中屬於東軍，領受豐前中津39萬6千石俸祿。利休七哲之一。"],["和田惟政",64,55,70,62,64,44,41,"忍者","基督教","CDDDBBDCC","",1530,1571,1545,[100,0,0,0,100],"足利家臣。主公義輝橫死後為義輝之弟義昭效力，支持就任將軍。保護天主教，向織田信長介紹了傳教士路易斯‧弗洛伊斯。"],["薄田兼相",30,77,3,1,39,27,37,"武士","佛教","CCDBDCDDD","",1578,1615,1593,[100,0,0,100,0],"豐臣家臣。大阪冬季戰役中，守備博勞淵砦失敗，被嘲弄為“橙武者”。大阪夏季戰役中奮勇作戰，陣亡。據說他就是消滅野獸的那個豪傑岩見重太郎。"],["波多野晴通",59,51,49,43,48,27,44,"武士","佛教","CDDDDDDDC","",1521,1565,1536,[0,0,0,0,0],"管領細川家臣，稙通之子。幾次招致三好軍的攻擊。努力擊退，但是後來投降松永久秀，被趕出城。久秀之侄秀六進入了居城八上城。"],["波多野秀治",70,66,53,31,58,23,30,"武士","佛教","BDCDDDDCD","",1549,1579,1564,[100,0,100,0,0],"丹波的豪族，八上城主，晴通之子。從三好家奪回居城，擴大了勢力。招致明智光秀的攻擊，守城作戰，但是後來投降，被押解到安土，處以磔刑。"],["波多野秀尚",58,64,31,36,54,23,24,"武士","佛教","CCDDDDDDC","",1555,1579,1570,[0,100,0,0,0],"晴通之子。和兄長秀治一起守衛丹波八上城與明智光秀軍對抗，經過一年半的攻防，最後投降。和兄長一起被押往安土，處以磔刑。"],["波多野宗高",61,70,58,67,74,27,64,"武士","佛教","CBBDDCDCC","",1509,1573,1524,[100,100,0,0,0],"波多野家臣，冰上城主，又名「丹波鬼」的勇將。正親町天皇即位之際，隨同其主秀治獻上金銀財寶，擔任朝倉家的援軍赴越前而戰死。"],["內藤如安",41,35,56,66,49,23,77,"武士","基督教","DDDCDCBDD","",1549,1626,1564,[0,0,0,0,0],"豐臣家臣。曾接受弗洛依斯的洗禮。出兵朝鮮時和小西行長一同進行了媾和的交涉。在德川家康行禁教令時，和高山重友一起被流放至馬尼拉。"],["赤井直正",84,85,72,30,51,24,48,"武士","佛教","BADDCDDBC","",1530,1578,1545,[100,400,0,0,200],"丹波的豪族，時家的次子。兄長家清戰死後，輔佐年輕的侄子忠家。擊退明智光秀的丹波平定軍，武勇出眾，綽號“丹波的赤鬼”。"],["荒木氏綱",72,77,63,12,88,25,49,"武士","佛教","BCDDDBDDD","",1535,1584,1550,[100,100,0,0,0],"丹波的豪族，細工所城主。武藝出眾，廣為人知。波多野家滅亡後，拒絕為明智光秀效力，讓兒子氏清去效力。氏清在山崎會戰中陣亡。"],["紉井教業",79,80,48,19,79,21,44,"武士","佛教","DABDDDDCD","",1532,1576,1547,[100,100,100,0,0],"波多野家臣，紉井城主。武勇出眾，與綽號“赤鬼”的赤井直正並列，綽號“青鬼”。招致羽柴秀吉的中國侵襲軍的攻擊，陣亡了。"],["一色義幸",51,50,37,47,47,68,65,"武士","佛教","DDCDDDDDC","",1498,1563,1513,[0,0,0,0,0],"丹後的戰國大名，與鄰國若狹武田家時常交戰。一色家是清和源氏足利家的一門，與山名、赤松、京極家在幕府中有重要地位。"],["一色義道",70,64,35,29,64,69,46,"武士","佛教","CDCBDDDCD","",1533,1579,1548,[0,0,100,100,0],"丹後的戰國大名，義幸之子。由於庇護被趕出京都的將軍足利義昭，招致織田軍的攻擊。英勇善戰，但是由於家臣沼田勘解由通敵，戰敗，自盡了。"],["一色滿信",65,60,50,52,61,72,24,"武士","佛教","CDCCDDDDC","",1558,1582,1573,[0,0,100,100,0],"丹後的戰國大名，義道之子。父親死後，依靠家臣稻富祐直，與細川藤孝軍作戰。後來由於明智光秀的調停，雙方和睦，娶了藤孝的女兒，但是由於再次背叛被殺。"],["一色義清",54,62,41,37,56,72,47,"武士","佛教","DDDCDDDCD","",1535,1582,1550,[0,0,0,100,0],"丹後的戰國大名，侄子義定被細川藤孝謀殺後，進入丹後弓木城，繼承一色家。可是，由於被細川忠光包圍了城池，突入敵陣戰死了。"],["稻富祐秀",57,72,70,25,42,73,59,"武士","佛教","DBDSCADCD","",1508,1567,1523,[0,100,0,400,100],"一色家臣，丹後忍木城主。稱相模守。向佐佐木少輔次郎義國學習砲術，加入了創意。後來教授孫子祐直砲術，奠定了稻富流砲術的基礎。"],["稻富祐直",63,70,46,13,58,73,60,"武士","佛教","DBDSDADDD","",1551,1611,1566,[0,100,0,400,0],"一色家臣，稻富流砲術的始祖。主家滅亡後屬於細川忠興，擔任步槍教師。後來為德川家效力，作為幕府步槍方為國友鍛冶集團的組織化而努力。"],["本願寺顯如",96,65,87,94,48,50,49,"僧侶","一向宗","SDDABBDAA","",1543,1592,1555,[400,0,0,100,300],"本願寺11世法主，證如之子，抵抗武家勢力，引領日本各地一向宗門徒起義。特別是罵織田信長為“佛敵”，持續抗爭了10年。"],["本願寺教如",75,66,81,62,76,50,56,"僧侶","一向宗","BDDBBDDDB","",1558,1614,1573,[100,0,0,100,200],"本願寺12世法主，顯如的長子。性格激烈，與織田信長和睦後也主張徹底抗戰。父親死後，為了爭奪法主之位與弟弟準如對立，建立了東本願寺。"],["本願寺證惠",65,55,58,75,65,51,80,"僧侶","一向宗","BDCBDDDBB","",1494,1574,1509,[100,0,100,0,0],"蓮淳之子，擔任伊勢長島願證寺的住持。率領一向宗門徒頑強抵抗織田信長的討伐軍，但是在信長的焦土化作戰前失敗，跳入了木曾川。"],["下間賴龍",56,44,57,70,51,52,59,"僧侶","一向宗","DDDCDDCCD","",1521,1580,1536,[0,0,0,0,0],"石山本願寺的坊官，於顯如就任本願寺11世法主時，就任坊官。愛好茶道，《天王寺屋會記》留下了他邀請津田宗達等人召開茶會的記錄。"],["下間賴照",74,59,67,53,54,50,49,"僧侶","一向宗","BDDACCCDC","",1526,1575,1541,[100,0,0,100,100],"本願寺的坊官。奉法主顯如之命，指導越前的一向宗門徒，與織田信長抗爭。後來信長施展與比叡山及長島一樣的焦土化作戰，因而死於信長手下。"],["下間仲孝",72,46,83,73,71,51,65,"僧侶","一向宗","BDBCBDCBC","",1551,1616,1566,[100,0,0,100,300],"本願寺的坊官。賴照之子。在石山會戰中表現活躍。織田信長與本願寺和議的時候，代表法主顯如進行談判。專長能樂，著有《童舞抄》。"],["下間賴廉",92,95,90,24,77,52,89,"僧侶","一向宗","ADDSBBCCD","",1537,1626,1552,[400,0,0,400,400],"本願寺的坊官。石山會戰中，代表法主顯如指揮全軍，徹底抗擊織田信長。信長死後，被豐臣秀吉任命為本願寺町奉行。"],["窪田經忠",55,53,62,21,45,51,59,"武士","一向宗","DDCDCDDDD","",1511,1570,1526,[0,0,100,0,100],"加賀的豪族，安吉城主，稱大炊介。開始時為安吉家長效力，但是1550年家長讓出安吉城，他成為城主。擔任加賀一向起義軍的頭領。"],["七里賴周",71,56,77,57,32,51,64,"僧侶","一向宗","BDDBCBDDD","",1517,1581,1532,[100,0,0,0,200],"加賀的本願寺代官。因應一向宗門徒的請求，討伐富田長繁，但是翌年投降了織田信長的討伐軍，後來奉法主顯如之命殺死了松任城主鏑木賴信。"],["鈴木重泰",60,65,56,20,50,51,39,"武士","一向宗","DDDBDDDCD","",1541,1580,1556,[0,0,0,100,0],"據說是紀州雜賀的鈴木家的一族，被本願寺派遣到加賀，建築鳥越城，指導加賀的一向宗門徒。後來被柴田家殺死，首級被送到安土。"],["德田重清",61,67,44,26,39,51,64,"武士","一向宗","DBDDDDDDD","",1516,1580,1531,[0,100,0,0,0],"加賀豪族，岩淵‧千代城主。稱為志摩守。加賀一向暴動軍的中心人物。抵抗織田信長的加賀侵略軍，但是被柴田勝家所殺，首級被送到安土城。"],["服部友貞",63,56,41,25,61,51,64,"武士","一向宗","CDDBDDCCD","",1515,1579,1530,[100,0,0,0,0],"伊勢的豪族，以鰍浦砦為據點，聯合伊勢長島願證寺抵抗織田信長，後來，齋藤龍興等敗給過信長的眾多武將投身到服部黨，與信長作戰。"],["細川晴元",62,39,45,73,36,48,49,"高家","佛教","DCDDDDDDB","",1514,1563,1529,[0,100,0,0,0],"攝津的戰國大名，與三好元長聯合，討滅細川高國，樹立了政權。後來討滅敵對的元長，但是元長之子長慶擁立細川氏綱，戰敗後逃到了近江。"],["三好長慶",91,67,92,94,15,56,41,"武士","佛教","ACBCAACAA","",1523,1564,1538,[100,0,100,100,400],"細川家臣，奪取了主家的實權，擴大勢力，趕走主公晴元，成功地掌握了畿內。可是，無法承受嫡男義興和弟弟們的死，病死了。"],["三好義興",70,65,43,67,54,57,21,"武士","佛教","CDDCDDCDC","",1542,1563,1557,[100,0,0,100,0],"長慶的嫡男，擔任幕府的御供眾。和六角家、畠山家的戰鬥都取得了勝利，表現活躍，未來不可限量，但是22歲時猝死。據說是被松永久秀毒殺的。"],["三好義賢",85,76,81,86,64,57,35,"武士","佛教","BCDCBCBDA","",1527,1562,1542,[100,0,0,100,300],"元長的次子，兄長長慶進入畿內後，負責本國阿波的經營。作為長慶的左右手，在內政、軍事方面表現活躍，但是在和泉久米田會戰中陣亡。專長茶道。"],["三好長治",42,40,21,29,31,55,24,"武士","佛教","DDDDDCCDC","",1553,1577,1568,[0,0,0,0,0],"義賢之子，父親死後，在篠原長房的輔佐下繼承家業，但是被讒言迷惑，和細川真之一起殺死長房。後來與和長宗我部元親勾結的真之作戰，戰敗身死。"],["十河存保",72,75,47,43,56,57,32,"武士","佛教","CBDCDDBCD","",1554,1586,1569,[100,0,0,100,0],"三好義賢之子，成為叔父十河一存的義子。跟隨豐臣秀吉，奪回了被長宗我部家奪去的讚岐。征伐九州時擔任先鋒，在豐後戶次川會戰中陣亡了。"],["安宅冬康",67,61,53,55,64,54,34,"武士","佛教","CCBCDDACD","",1530,1564,1545,[0,0,100,0,0],"三好元長之三子，繼承了安宅家，率領淡路水軍，幫助兄長三好長慶，表現活躍，但是由於寸永久秀的讒言，被兄長殺死。專長歌和書法，精通茶會。"],["安宅信康",57,39,40,48,42,54,29,"武士","佛教","DDCDDDADD","",1549,1578,1564,[0,0,0,0,0],"冬康之子，父親死後繼承家業，統率淡路水軍。開始時與石山本願寺聯合，但是後來投降織田信長的畿內平定軍。在木津川會戰中與毛利水軍作戰。"],["十河一存",83,93,55,19,61,52,29,"武士","佛教","BADCDDBDC","",1532,1561,1547,[100,400,0,0,0],"三好元長的四子，繼承了十河家，成為讚岐十河城主。作為家中頭號的猛將而聞名，綽號“鬼十河”。去有馬權現的途中落馬，摔死了。"],["三好義繼",60,49,36,44,66,52,24,"武士","佛教","DCDDDDCCD","",1549,1573,1564,[0,0,0,0,0],"十河一存之子。三好長慶死後，在三好三人眾的輔佐下繼承了宗家。投降了織田信長，但是由於保護了被趕出京都的足利義昭，而招致織田軍的攻擊，戰敗身死。"],["三好康長",41,31,79,77,31,75,79,"武士","佛教","DDCDBDDBC","",1508,1587,1523,[0,0,0,0,300],"三好長慶的叔父，“笑岩”之號很有名。敗給織田信長的上洛軍，成為其臣下。引誘了許多阿波、讚岐的國眾到信長方。本能寺事變後追隨了豐臣秀吉。"],["三好政康",64,68,53,53,27,51,87,"武士","佛教","CDDCDDCDD","",1528,1615,1543,[0,0,0,100,0],"三好家臣，三好三人眾之一。和松永久秀一起殺害了將軍足利義輝。敗給織田信長的畿內平定軍，而後逃亡。後來為豐臣家效力，在大阪夏季戰役中陣亡。"],["三好長逸",68,60,64,56,48,51,64,"武士","佛教","CDDCCCCDC","",1514,1578,1529,[100,0,0,0,200],"三好家臣，三好三人眾的首席。和主公義繼、松永久秀等人反復離合聚散，導致家中的混亂。後來敗給織田信長的畿內平定軍，逃亡之後去向不明。"],["三好政勝",50,66,52,45,51,60,95,"武士","佛教","CDDDDDBDC","",1536,1631,1551,[100,0,0,0,0],"細川家臣，攝津夏並城主，政長之子。與殺害父親的三好長慶爭鬥，長慶死後，與三好三人眾和解。投降了織田信長的畿內平定軍。後來為豐臣、德川家效力。"],["荒木村重",74,70,42,65,25,52,51,"武士","佛教","BDCBDDDBD","",1535,1586,1550,[400,0,0,100,0],"池田家臣，攝津有岡城主。為織田家效力，負責經營攝津，但是聯合本願寺、毛利家，發動叛亂，戰敗後逃亡。後來成為茶人，是利休七哲之一。"],["池田長正",58,54,31,40,47,60,44,"武士","佛教","DDCDDDDDC","",1519,1563,1534,[0,0,100,0,0],"攝津的豪族，池田城主，信正之子。父親被細川晴元逼迫自殺後，他繼承了家業。臣服於三好長慶，在與波多野家和河內畠山家的戰鬥中立下過戰功。"],["池田勝正",42,36,34,32,54,52,39,"武士","佛教","DDDDDDDDD","",1539,1578,1554,[0,0,0,0,0],"攝津的豪族，池田城主，長正之子。投降了織田信長的畿內平定軍，與伊丹家、和田家一起被稱為“攝津三守護”，但是被三好家一族放逐。"],["池田知正",60,55,45,47,35,60,59,"武士","佛教","DDDDDCDCD","",1544,1603,1559,[0,0,0,0,0],"攝津的豪族，池田城主，長正之子，兄長勝正出走後，他繼承了家業。聯合三好三人眾與織田信長敵對，但是後來投降。臣屬於支配攝津的荒木村重。"],["石成友通",47,44,67,35,58,51,44,"武士","佛教","DDDCCBBDD","",1529,1573,1544,[0,0,0,0,300],"三好家臣，三好三人眾之一，受到了和三好家族同樣的待遇。響應足利義昭將軍起兵，防守山城澱城，但是招致細川藤孝等人的大軍攻擊，戰敗身死。"],["香川元景",46,50,54,51,21,48,67,"武士","佛教","DDCDDDBDC","",1519,1586,1534,[0,0,0,0,0],"細川家臣，讚岐天霧城主。主家沒落後投靠三好家，後來與織田信長串通，但是投降了長宗我部元親的讚岐侵襲軍，認元親的次子親和為義子，讓出了家業。"],["篠原長房",28,31,71,74,73,55,60,"武士","佛教","DDDDBDCBB","",1513,1573,1528,[0,0,0,0,100],"三好家臣，制定了成為主家經營領國的基礎的分國法《新國製式》。地位次於三好三人眾，但是被聽信了同族篠原自遁讒言的主公長治殺死。"],["津田重久",36,33,56,32,34,51,85,"武士","佛教","CDDDDDDDC","",1549,1634,1564,[0,0,0,0,0],"細川家臣。主家滅亡後，為三好、足利將軍家等效過力，後來為明智光秀效力，參加了山崎會戰。光秀死後，他為豐臣秀吉效力，參加了賤岳會戰等戰役。"],["中川清秀",48,72,19,14,44,49,41,"武士","佛教","BDDCDDDCD","",1542,1583,1557,[100,0,0,100,0],"池田家臣，攝津茨木城主。討伐和田惟政等戰鬥中表現活躍。後來屬於荒木村重。村重逃亡後，他跟隨羽柴秀吉，在山崎會戰中立下了軍功。在賤岳會戰中陣亡了。"],["松永久秀",81,62,100,95,1,93,66,"商人","佛教","BDCCSSDSA","",1511,1577,1526,[100,0,0,100,600],"三好家臣，篡奪主家，殺死將軍足利義輝，火燒東大寺大佛殿，少有的梟雄。屬於織田信長，但是發動了謀反，最後失敗，與「平蜘蛛」一起炸死。"],["松永久通",59,28,80,60,5,93,39,"商人","佛教","CDDCBADAC","",1538,1577,1553,[100,0,0,0,400],"三好家臣，大和多聞山城主，久秀之子。追隨父親，參與了謀殺將軍足利義輝等行動。後來屬於織田信長，但是和父親一起又背叛了信長，最後失敗，自殺了。"],["高山友照",48,45,57,54,32,84,68,"武士","佛教","DDCDDDDDC","",1527,1595,1542,[0,0,0,0,0],"織田家臣。屬於荒木村重，成為了攝津高槻城主。贊成村重的謀反，村重敗走後，投到了越前的柴田勝家。後來在各地流浪。是著名的天主教徒。"],["高山重友",68,56,66,72,51,91,62,"武士","基督教","CDDBCBCAC","",1553,1615,1568,[100,0,0,100,100],"織田家臣，攝津高槻城主，友照之子。在各地的會戰中表現活躍，但是由於拒絕改宗，被免職。流浪之後，奉江戶幕府之命被流放到呂宋。"],["柳生宗嚴",62,105,35,20,85,91,79,"劍豪","佛教","SDDDDDDDC","混戰",1527,1606,1542,[400,0,0,0,0],"大和的豪族。拜上泉信綱為師，學到真傳，開創了柳生新陰流。後來被德川家康招去傳授柳生新陰流。以後，柳生家成為了德川家的兵法教師。"],["柳生宗矩",41,92,81,66,10,81,75,"劍豪","佛教","BDDDBDDCB","混戰",1571,1646,1586,[100,0,0,0,300],"德川家臣，宗嚴之子。擔任兵法教師，向主公秀忠傳授柳生新陰流。秀忠死後為秀忠之子家光效力。後來成為大目付，成為1萬石的大名。"],["安見直政",39,41,72,62,28,84,37,"武士","佛教","DDDDCDDCD","",1534,1571,1549,[0,0,0,0,300],"畠山家臣，河內交野城主。擔任河內守護代。將主公高政趕到紀伊，擁立了高政之弟昭高。後來投降了織田信長的畿內平定軍，與本願寺作戰。"],["遊佐信教",52,51,76,43,44,83,50,"武士","佛教","DDCDBDDDD","",1524,1574,1539,[0,0,0,0,0],"畠山家臣，長教之子，擔任河內守護代。將主公高政趕到紀伊，擁立了高政之弟昭高。也要暗殺昭高，但是後來被織田信長殺死。"],["小西行長",77,63,70,84,61,20,41,"商人","基督教","CDDBBASDA","",1559,1600,1574,[100,0,0,100,100],"豐臣家臣。界的富商小西隆佐之子。出兵朝鮮的時候擔任先鋒。關原會戰中屬於西軍而戰，但是戰敗，被斬首。作為熱心的天主教徒而聞名。"],["筒井順慶",51,48,77,81,42,5,35,"僧侶","佛教","CDCDBDDDB","",1549,1584,1550,[100,0,0,0,300],"大和的國眾。順昭的嫡子。因為父親順昭早逝，2歲就繼承了家業。與松永久秀爭鬥，被趕出居城筒井城，但是後來從屬織田信長，恢復了勢力。"],["慈明寺順國",41,24,71,64,56,3,49,"僧侶","佛教","DDBDCCDDC","",1531,1580,1546,[0,0,0,0,200],"筒井家臣，筒井順興之三男。繼承慈明寺家督。娶其兄順昭之女。順昭去世之際，據說全族擁立影武者默阿彌，將順昭死亡的消息秘而不宣。"],["筒井定次",37,33,21,38,24,9,53,"僧侶","佛教","DDDDDDDCD","",1562,1615,1577,[0,0,0,0,0],"豐臣家臣，慈明寺順國之子。成為叔父順慶的義子，繼承了家業，但是因為行為不良而被免職。大阪冬季戰役的時候，因為勾結大阪方之罪被勒令自殺。"],["島清興",90,96,74,21,94,15,60,"武士","佛教","BSDCAADAC","",1540,1600,1555,[100,400,0,100,300],"筒井家臣。後來成為浪人，被石田三成以高俸祿招去。被世人稱讚的名將，才能超過三成。關原會戰中縱橫馳騁，英勇犧牲。"],["松倉重信",46,47,75,68,68,6,50,"武士","佛教","CDBCBDDCC","",1543,1593,1558,[100,0,100,0,100],"筒井家臣，和島清興、森好之一起被稱為筒井家三老臣。主公定次轉封到伊賀上野的時候，他建築伊賀名張城，得到8千3百石俸祿。"],["森好之",34,22,60,74,54,11,64,"武士","佛教","DDCDDCDDB","",1526,1590,1541,[0,0,100,0,0],"筒井家臣，與島清興、松倉重信一起被稱為筒井家三老臣。在家中佔有重要的地位，但是由於和主公定次對立，返回大和務農了。"],["井戶良弘",55,50,66,44,35,15,79,"武士","佛教","DCDDCDDDD","",1533,1612,1548,[0,0,0,0,200],"筒井家臣。井戶城主。後來將居城讓給其子覺弘後，侍奉織田信長。因在各地立下功績，而得到山城慎島兩萬石。但因為在山崎會戰時跟隨明智光秀而被裁撤。"],["箸尾高春",49,48,55,60,40,5,74,"武士","佛教","DDDCDDDCD","",1546,1620,1561,[0,0,0,0,0],"筒井家臣。領有知行四萬石，娶了其主順慶的妹妹。不追隨筒井家轉封伊賀，而跟隨豐臣秀長。在關原會戰後失去領地，後來進入大阪城。"],["鈴木重意",79,89,70,47,82,57,70,"武士","一向宗","BDDSBDCCD","",1515,1585,1530,[100,0,0,400,100],"紀伊的土豪，雜賀城主。率領用步槍武裝起來的傭兵軍團雜賀黨。與本願寺聯合，同織田信長作戰。後來被進入紀伊的豐臣家臣藤堂高虎欺騙，自殺了。"],["鈴木重兼",51,45,84,83,69,58,49,"武士","一向宗","DDCABCCCA","",1540,1589,1555,[0,0,100,100,200],"紀伊的土豪，佐大夫的嫡子。住在平井，人稱「平井的孫市」。做事深思熟慮，在雜賀黨背後擔當部族間的調整和政治工作。"],["鈴木重秀",95,99,92,13,70,57,39,"武士","一向宗","CBDSAABDD","組隊擊",1546,1585,1561,[100,0,0,700,300],"紀伊的土豪，佐大夫的三子，通稱「雜賀孫市」。率領雜賀的步槍眾守衛石山本願寺，對抗織田信長軍。據說石山投降後為豐臣秀吉效力了。"],["鈴木重朝",74,78,77,15,49,52,62,"武士","一向宗","DBDSBCBDC","",1561,1623,1576,[0,0,0,400,200],"豐臣家臣，重秀之子。參加了出兵朝鮮行動。關原會戰中屬於西軍，殺死守衛伏見城的鳥居元忠，立下了戰功。戰後，成為浪人，後來為水戶德川家效力。"],["太田定久",54,52,56,43,59,59,59,"武士","佛教","DDCCDDDCD","",1531,1590,1546,[0,0,100,0,0],"紀伊豪族，太田城主。與雜賀黨展開多次對抗。於小牧長久手合戰之際，應德川家康之邀而戰。豐臣秀吉紀州征伐之際，居城遭遇水攻而敗。"],["岡吉正",40,74,49,9,62,61,42,"武士","一向宗","DDDADCDDD","",1548,1590,1563,[0,0,0,100,0],"紀伊的豪族，雜賀黨的一員。守衛石山本願寺，表現活躍。射擊技藝高超，織田信長來進攻時，他狙擊信長，使其大腿受了重傷。"],["土橋守重",62,57,40,18,71,61,64,"武士","一向宗","CDDCDDBDD","",1518,1582,1533,[100,0,0,0,0],"紀伊的豪族，與4個兒子一起守衛石山本願寺作戰，打擊了信長軍。後來離開石山本願寺，但是由於回到領地後繼續抵抗，被謀殺了。"],["山名祐豐",58,50,53,64,45,83,69,"高家","佛教","DCDDDDDCD","",1511,1580,1526,[0,100,0,0,0],"但馬守護。成為叔父誠豐的義子，繼承了家業。派遣弟弟豐定去因幡，支配了但馬、因幡兩國。後來招致羽柴秀吉軍的攻擊，戰敗，投降了。"],["山名豐定",52,51,56,60,63,83,48,"高家","佛教","CDCDDDDDC","",1512,1560,1527,[0,0,100,0,0],"因幡守護。鳥取城主。叔父誠豐死後，奉兄長祐豐之命去了因幡。討伐了自稱因幡守護、與主家對抗的山名誠通等等，努力在因幡經營。"],["山名豐國",21,52,12,30,19,79,78,"高家","佛教","DDCDDDDDD","",1548,1626,1563,[0,0,0,0,0],"因幡守護。鳥取城主。豐定的三子。殺了武田高信，奪回了居城。屬於羽柴秀吉，但是被勾結毛利家的家臣們趕走了。後來，擔任了秀吉的御咄眾。"],["垣屋續成",51,37,67,58,31,79,88,"武士","佛教","CDDDBBDDC","",1482,1570,1497,[100,0,0,0,300],"山名家臣，樂樂前城主。陪伴主公致豐就任但馬守護，成為守護代，掌握了領國經營的實權。後來與田結莊是義對立，遭是義奇襲，自殺了。"],["垣屋光成",55,53,51,48,50,79,69,"武士","佛教","CDDDDDDDC","",1523,1592,1538,[100,0,0,0,0],"山名家臣，續成之子。與殺害父親的田結莊是義作戰，殺死了是義。後來投降了羽柴秀吉的中國征伐軍，參加了進攻鳥取城等戰役，在因幡領受1萬石俸祿。"],["田結莊是義",43,46,64,40,38,89,57,"武士","佛教","DDDDCDDDD","",1518,1575,1533,[0,0,0,0,200],"山名家臣，但馬鶴城主。被列為山名四天王之一。主張從屬織田家，與親毛利家的垣尾續成對立。殺了續成，但是被續成之子光成殺死。"],["中村春續",49,52,70,42,37,84,52,"武士","佛教","DDCDCCDCD","",1529,1581,1544,[0,0,100,0,100],"山名家臣。將投降了羽柴秀吉的主公豐國趕出了因幡鳥取城，從毛利家請來吉川經家。可是，敗在秀吉切斷水源的手段之下，自殺了。"],["森下通與",52,54,62,33,42,91,44,"武士","佛教","DCDDDDDCD","",1537,1581,1552,[0,100,0,0,0],"山名家臣，與中村春續一起趕走主公豐國，屬於吉川經家，守衛因幡鳥取城。可是敗在秀吉切斷水源的手段之下，與經家、春續等人一起自殺。"],["吉岡定勝",68,72,53,17,48,91,74,"武士","佛教","BCDDDBDDC","",1532,1606,1547,[100,100,0,0,0],"山名家臣，因幡防己尾城主。對抗羽柴秀吉的中國征伐軍，奪下千成瓢簞的馬標，揚下勇名。可是，因為鳥取城陷落而逃亡，去投奔女兒夫婦，回歸務農生活。"],["南條宗勝",67,60,73,43,51,98,77,"武士","佛教","CCBDBDDDC","",1498,1575,1513,[100,0,100,0,300],"南條家第7代當主。伯耆羽衣石城主。招致尼子經久的攻擊，被趕出了居城，成為浪人。後來在毛利元就的援助下成功地奪回了居城，之後臣屬毛利家。"],["南條元續",61,47,70,64,59,99,42,"武士","佛教","DCDDCDDCD","",1549,1591,1564,[0,100,0,0,200],"南條家第8代當主，伯耆羽衣石城主。宗勝之子。為豐臣秀吉效力，參加了征伐九州等行動。由於生病，將任務交給了弟弟元清，但是抱病參加了小田原征伐戰。"],["尼子晴久",70,59,34,66,47,11,47,"武士","佛教","BCCDDDCCC","",1513,1560,1528,[0,100,100,0,0],"出雲的戰國大名。月山富田城主。擔任中國8個國的守護。中了毛利元就的計謀，消滅了家族的新宮黨，導致實力衰弱。在與毛利軍交戰的時候猝死。"],["尼子義久",21,27,22,28,50,11,70,"武士","佛教","DDDDDDDDD","",1540,1610,1555,[0,0,0,0,0],"出雲的戰國大名。月山富田城主。晴久的嫡子。守衛居城，與毛利元就的出雲遠征軍作戰，但是殺死了首席家老宇山久兼等等，敗給了元就的離間計。"],["尼子勝久",49,51,20,32,73,1,25,"武士","佛教","DDDDDDCCD","",1553,1578,1568,[0,0,0,0,0],"誠久之子。被山中鹿之介等人擁戴，力圖復興尼子家。投靠織田信長，試圖進入出雲，但是失敗了，後來在播磨上月城之戰中敗給毛利軍，自殺了。"],["赤穴盛清",37,31,50,52,20,6,66,"武士","佛教","CDDDDDDDC","",1529,1595,1544,[0,0,0,0,0],"尼子家臣，出雲瀨戶山城主。光清之子。父親的死感動了主公晴久，為他增加了領地。後來投降毛利元就的出雲侵襲軍，成為了毛利家臣。"],["宇山久兼",61,47,39,76,87,5,55,"武士","佛教","DDBDDDCDB","",1511,1566,1526,[0,0,100,0,0],"尼子家臣，擔任首席家老。在月山富田城防衛戰中，拿出自己的錢購買糧食分發給城兵。後來被中了毛利元就離間計的主公義久殺死了。"],["小笠原長雄",57,52,42,56,44,5,49,"武士","佛教","CDDDDDDCD","",1520,1569,1535,[0,0,0,0,0],"大內家臣，石見溫湯城主。主公義隆死後，屬於了尼子家。進入大森銀山，據為自己的領地。後來招致毛利元就軍的進攻，抵抗不住，失敗，投降了。"],["龜井玆矩",44,40,66,83,27,4,55,"武士","佛教","CDDDCCBDA","",1557,1612,1572,[0,0,0,0,100],"尼子家臣。主家滅亡後，為豐臣家效力，成為因幡鹿野城主。致力於基礎設施建設，振興領地內的產業。而且得到許可向海外派遣交易船隻。"],["佐世清宗",36,29,47,70,54,6,49,"武士","佛教","DDCDDDCDB","",1521,1570,1536,[0,0,0,0,0],"尼子家臣，擔任次席家老。主要在內政方面表現活躍，也參加了進攻毛利元就的居城吉田郡山城。頑強抵抗元就的出雲侵襲軍，最後投降。"],["佐世元嘉",32,12,58,55,26,5,74,"武士","佛教","DDDDDDCDC","",1546,1620,1561,[0,0,0,0,0],"尼子家臣，清宗之子。與父親一起投降了毛利元就的出雲侵襲軍。以後為毛利家效力，出兵朝鮮和關原會戰的時候，負責留守主家的居城廣島城。"],["立原久綱",62,34,74,44,83,2,82,"武士","佛教","CCDDBBDDC","",1531,1613,1546,[100,0,0,0,300],"尼子家臣，與侄子山中鹿之介一起擁立尼子勝久，努力復興主家。播磨上月城陷落後，被毛利軍抓住，但是逃脫，去了京都。後來去了阿波。"],["本城常光",76,82,41,10,30,4,49,"武士","佛教","ABDDDDCCD","",1513,1562,1528,[100,400,0,0,0],"尼子家臣。擔任石見山吹城主，守衛大森銀山。擊退毛利元就和吉川元春的攻擊，勇名遠播。後來投降了元就，元就擔心其豪勇，將其殺死。"],["三澤為清",41,33,62,57,39,5,52,"武士","佛教","DDDDCCDDC","",1536,1588,1551,[0,0,0,0,0],"尼子家臣，出雲三澤城主。一度屬於大內義隆，但是義隆侵攻出雲失敗後歸順。後來投降了毛利元就的出雲侵襲軍。子孫為長府毛利家效力。"],["山中鹿之介",74,85,67,16,100,1,33,"武士","佛教","ABBDDDCDD","",1545,1578,1560,[400,100,100,0,0],"尼子家臣。據說曾對著彎月祈禱「讓我嚐盡七難八苦……」。擁立尼子勝久，企圖復興主家，但是在播磨上月城敗給了毛利軍，在護送至安藝的途中被殺害了。"],["別所就治",74,68,60,51,40,63,61,"武士","佛教","BCDDDCDCD","",1502,1563,1517,[100,100,0,0,0],"播磨的豪族，三木城主。別所家是赤松家的庶流。趁著赤松宗家的衰落擴張勢力，得到了東播磨八郡。後來歸屬細川晴元和三好長慶，在各地作戰。"],["別所安治",57,51,55,62,62,63,38,"武士","佛教","DDCDDDDDC","",1532,1570,1547,[0,0,100,0,0],"播磨的豪族，三木城主。就治的嫡子。擊退了三好長慶的侵襲軍。將軍足利義昭被三好三人眾襲擊的時候，派遣弟弟重棟，得到了織田信長的獎賞。"],["別所長治",79,71,60,50,76,63,22,"武士","佛教","BCBDDDDBD","",1558,1580,1573,[100,100,0,0,0],"播磨豪族，三木城主。安治之嫡子。身為織田信長中國征伐軍的先鋒，但是後來卻變成敵對狀態。守城戰與羽柴秀吉對峙達兩年之久，要求饒恕守城兵性命而自殺。"],["淡河定範",64,70,72,49,89,57,39,"武士","佛教","DBCDBCDDD","",1539,1578,1554,[0,100,0,0,400],"別所家臣，淡河城主。守住居城抵抗羽柴秀吉軍。後來進入了三木城，輔佐其主長治。於攻打羽柴家臣谷衛好之戰時，負傷而自殺。"],["加須屋真雄",64,72,34,31,47,59,45,"武士","佛教","BDDDDCDDD","",1562,1607,1577,[100,0,0,0,0],"豐臣家臣，出身於播磨。賤岳七本槍之一。關原之戰時隸屬於西軍，參加攻擊伏見城等戰事。戰後雖然被貶，後來還是被拔擢擔任幕臣。"],["赤松晴政",16,21,27,29,34,69,52,"高家","佛教","DDDDDDDDC","",1513,1565,1528,[0,0,0,0,0],"播磨守護。家臣浦上村宗的傀儡，後來與細川晴元串通，在「大物崩」之戰中殺死村宗，但是招致了尼子晴久的攻擊，等等事件之後，經營領國祇是徒有其名了。"],["赤松義祐",34,31,47,57,42,72,39,"高家","佛教","DDDDDDDDC","",1537,1576,1552,[0,0,0,0,0],"晴政之子，與織田信長串通，但是與浦上政宗作戰失敗，沒落了。赤松家是村上源氏一脈，始祖是為建立建武政府作出貢獻的赤松則村（元心）。"],["赤松則房",35,39,56,55,56,72,39,"高家","佛教","DDDDDDDDC","",1559,1598,1574,[0,0,0,0,0],"豐臣家臣，義祐之子。得到播磨置鹽1萬石俸祿。參加了賤岳會戰、小牧長久手會戰、征伐四國，增加了阿波住吉1萬石俸祿。也參加了出兵朝鮮戰役。"],["赤松政秀",69,61,70,44,77,73,49,"武士","佛教","CCBDCDDCD","",1521,1570,1536,[100,0,100,0,200],"赤松家臣，播磨龍野城主。把主公晴政接到居城。殺死浦上政宗、與別所安治聯合與小寺政職和黑田職隆作戰等等，表現活躍，據說後來被毒殺。"],["小寺政職",61,57,55,72,43,45,57,"武士","佛教","DDCDDDCCB","",1525,1582,1540,[0,0,100,0,0],"赤松家臣，御著城主。則職之子。與別所家友好。後來隸屬於織田家，與別所家共同協助荒木村重的謀反。遭到羽柴秀吉軍攻擊而敗北逃亡。"],["黑田職隆",50,43,71,76,45,6,61,"武士","佛教","DDCDCDDDB","",1524,1585,1539,[0,0,0,0,100],"小寺家臣，姬路城主。討伐播磨豪族香山重道而建立功績，於是娶得其主政職之養女，升任家老。後來得到賜姓「小寺」以及「職」這個字。"],["黑田官兵衛",91,60,99,91,35,6,58,"武士","佛教","ADCBSSCBA","火牛計",1546,1604,1561,[400,0,0,100,400],"豐臣家臣，擔任主公秀吉的參謀，為秀吉統一天下做出了重要貢獻。可是，其卓越的戰略才能令人畏懼，俸祿僅限制在豐前中津21萬石。"],["黑田長政",78,74,82,86,44,7,55,"武士","佛教","BCDBBABBB","",1568,1623,1583,[100,100,0,100,200],"豐臣家臣，官兵衛孝高的嫡子。征伐九州等戰役中表現活躍。關原會戰中屬於東軍，得到筑前福岡52萬石俸祿。以後對德川幕府採取恭順的態度。"],["後藤又兵衛",85,88,57,16,92,12,55,"武士","佛教","BADCDBCCD","",1560,1615,1575,[100,100,0,100,0],"黑田家臣。擔任侍大將，但是被懷疑謀反，淪為浪人。後來應豐臣秀吉之邀，進入大阪城。聲望很高，奮戰德川軍，但是在大阪夏季戰役中戰死。"],["母里太兵衛",71,90,41,13,82,6,59,"武士","佛教","ADDCDCCDD","",1556,1615,1571,[400,0,0,100,0],"黑田家臣。與後藤又兵衛並列為家中首屈一指的猛將。飲乾福島正則敬的一大杯酒，拜領了名槍「日本號」，現在還保留「黑田節」。"],["宮本武藏",27,102,53,11,77,25,61,"劍豪","佛教","ADDDDDDDD","混戰",1584,1645,1599,[100,0,0,0,0],"創出獨特的劍法「二天一流」，生涯六十六戰皆無敗績的劍豪。晚年擔任細川忠信的客座，一邊鑽研書畫與禪，一邊著作了「五輪書」。"],["後藤勝元",69,59,41,42,54,64,41,"武士","佛教","DCCDDDDCD","",1538,1579,1553,[0,100,0,0,0],"美作豪族，三星城主，勝國之子。鄰近的豪族皆歸其管轄，並與尼子家和浦上家友好，造就後藤家的興盛。後來敗於宇喜多直家而自殺。"],["竹內久盛",52,84,25,9,39,58,92,"武士","佛教","BDDDDDDDC","混戰",1503,1595,1518,[100,0,0,0,0],"美作豪族，一之瀨城主。敗於宇喜多直家的美作侵略軍，而變成其屬下。以戰場上的格鬥技為基礎，創立日本最古老的柔術流派竹內流柔術。"],["原田忠佐",34,50,42,45,46,65,44,"武士","佛教","DDDDDCDCD","",1577,1621,1592,[0,0,0,0,0],"宇喜多家臣。行佐（貞佐之子）之子，豐臣秀吉派兵朝鮮之際，追隨其主秀家渡海但是由於麾下的步兵違反軍令，被迫回國而隱退。"],["浦上宗景",62,56,71,57,25,53,70,"武士","佛教","CDCDBBCCD","",1512,1582,1527,[100,0,100,0,300],"備前的戰國大名。與擔負播磨室津城主的兄長政宗爭鬥，在備前擴大勢力。可是，後來被擁有勢力的家臣宇喜多直家攻擊，被趕出了居城。"],["島村盛實",12,11,67,27,11,53,64,"武士","佛教","DDDDBDDDC","",1495,1559,1510,[0,0,0,0,100],"浦上家臣，入道名為貫阿彌。在砥石城襲擊宇喜多能家，迫使他自殺，獨佔了家中的實權。可是，後來被懷疑謀反，被能家之孫宇喜多直家殺死。"],["明石景親",42,39,74,63,22,19,69,"武士","佛教","DDCDBCDDC","",1520,1589,1535,[0,0,0,0,200],"浦上家臣，備前阪根城主。參加了明禪寺會戰等戰役。宇喜多直家進攻主家的居城天神山城的時候，他接應直家，造成主家滅亡。以後為直家效力。"],["明石全登",82,75,58,62,91,19,64,"武士","基督教","BDCADACDC","",1551,1615,1566,[100,0,100,400,0],"宇喜多家臣，景親之子。主家內亂之後，他管理國政。關原會戰中擔任宇喜多軍的先鋒。後來進入大阪城，大阪之戰中率領天主教武士奮戰。"],["延原景能",66,60,70,45,51,55,54,"武士","佛教","DBDDBCDDD","",1528,1582,1543,[0,100,0,0,200],"浦上家臣，主家滅亡後為宇喜多家效力。與花房職秀一起討伐三星城主後藤勝基和飯岡城主星賀藤內等的浦上家餘黨。公認的智勇兼備之士。"],["宇喜多直家",77,71,99,93,3,10,53,"武士","佛教","CCBCSACBA","",1529,1582,1544,[100,0,100,100,600],"浦上家臣，乙子城主。使用各種陰謀手段排除敵人，建立了家中最大的勢力。最後趕走主公宗景，掌握了備前一國，少有的謀將。"],["宇喜多秀家",69,58,41,56,79,10,83,"武士","佛教","CCDCDDBDC","",1572,1655,1581,[100,0,0,100,0],"豐臣家臣，直家的嫡子。得到主公秀吉的寵愛，成為五大老之一，但是由於內亂喪失了大半重臣。關原會戰中屬於西軍，戰後被流放到八丈島。"],["宇喜多忠家",70,57,53,70,62,7,73,"武士","佛教","CCDCDBCDB","",1536,1609,1551,[100,0,100,0,0],"宇喜多家臣，興家之子。為兄長直家的創業做出了極大貢獻。兄長死後，他輔佐侄子秀吉。出兵朝鮮的時候，跟隨擔任豐臣軍總督的秀家渡海。"],["宇喜多詮家",61,69,18,20,42,17,49,"武士","佛教","DBDCDDCDC","",1567,1616,1582,[0,100,0,100,0],"宇喜多家臣。忠家之子。因主家的內亂而出走，加入德川家。因關原會戰時的戰功而領有石見濱田兩萬石。在大阪之陣時，救出了家康的孫女‧千。"],["岡利勝",70,74,72,69,70,10,60,"武士","佛教","BDDCCBCBB","",1532,1592,1547,[400,0,0,100,200],"宇喜多家臣，宇喜多三老之一，專長刀槍之術，出征了40餘次會戰的勇將。也修築過備前岡山城和建設城下町。出兵朝鮮的時候病死了。"],["岡家利",52,48,39,44,56,10,49,"武士","佛教","DDDDDCDCD","",1566,1615,1581,[0,0,0,0,0],"宇喜多家臣，利勝之子。主家內亂的時候出走，為德川家康效力。可是，由於大阪之戰中兒子平內屬於大阪方，惹得家康不滿，自殺了。"],["長船貞親",67,52,73,71,50,5,59,"武士","佛教","DCCDBBBDB","",1529,1588,1544,[0,100,100,0,300],"宇喜多家臣，宇喜多三老之一。參加了明禪寺會戰等各地的會戰，幫助主公直家創業。戶川秀安退隱後，他負責國政。後來被妹夫殺死。"],["長船綱直",33,28,65,79,59,9,40,"武士","佛教","DDDDCCDCA","",1558,1598,1573,[0,0,0,0,100],"宇喜多家臣，貞親之子。執行主家的國政，在領內進行檢地和整備城下町等等。由於恃著主公秀家的寵愛而專權，被敵對勢力毒殺了。"],["戶川秀安",64,69,74,73,54,99,59,"武士","佛教","CCDDBDCCB","",1533,1592,1548,[100,100,0,0,200],"宇喜多家臣，宇喜多三老之一。參加了明禪寺會戰，兒島八濱會戰等許多會戰，幫助主公直家創業。後來擔任首席家老，處置國政。"],["戶川達安",55,68,62,58,47,99,60,"武士","佛教","CCDDDDDDC","",1567,1627,1582,[100,0,0,0,0],"宇喜多家臣，秀安的嫡子。在出兵朝鮮等行動中表現活躍。是熱心的日蓮宗徒，與天主教的長船綱直等人對立。後來引起內亂，離開了主家，為德川家效力。"],["花房正幸",63,72,64,60,48,98,81,"武士","佛教","DDADCADDD","",1524,1605,1539,[0,0,400,0,300],"宇喜多家臣，備前蟲明城主。支持主公直家創業的重臣之一。聞名的弓術名家，在各地活躍，也是細川藤孝傳授過知識的文人。"],["花房正成",51,45,75,71,62,98,68,"武士","佛教","DDCDBDDCC","",1555,1623,1570,[0,0,100,0,100],"宇喜多家臣，正幸之子。跟隨羽柴秀吉征伐中國的時候，建設水攻備中高松城。後來由於主家的內亂而出走，為德川家效力。"],["花房職秀",60,87,14,8,46,98,67,"武士","佛教","BBCDDDBDD","",1549,1616,1564,[100,0,100,0,0],"宇喜多家臣。屢立頭功的武勇之士。後來為主公秀家諫言。引起主公不滿，不得已出走。關原會戰中屬於東軍，得到備中高松8千石俸祿。"],["清水宗治",84,80,63,20,85,54,45,"武士","佛教","BBCDDDCBD","",1537,1582,1552,[400,100,100,0,100],"毛利家臣，備中高松城主。頑強抵抗織田信長的中國征伐軍，但是招致羽柴秀吉的水攻，陷入苦戰。以保全守城兵士的性命為條件達成和解，自殺了。"],["中島元行",68,66,36,51,78,50,62,"武士","佛教","CDCDDBDDD","",1552,1614,1567,[100,0,100,0,0],"毛利家臣。經山城主。繼承於明禪寺會戰時戰死的父親輝行之後位。迎娶清水宗治之女，與宗治一起活躍於各地的會戰。後來著作了「中國兵亂記」。"],["三村家親",74,69,46,48,46,59,53,"武士","佛教","CBDDDDDCD","",1513,1566,1528,[100,100,0,0,0],"備中的豪族，鶴首城主。統一周圍的豪族，成為備中最大的勢力。企圖進攻備前、美作，和宇喜多直家展開抗爭，但是後來被直家暗殺。"],["三村元親",54,54,61,41,54,59,34,"武士","佛教","DDCDDDDDC","",1541,1575,1556,[0,0,0,0,0],"備中的豪族，家親之子，父親死後繼承了家業。屬於毛利家，想恢復勢力，但是由於父親的敵人宇喜多直家和毛利家聯合，他叛離毛利家，但是招致進攻，自殺了。"],["三村親成",41,39,65,61,18,53,58,"武士","佛教","DDDDCDDDC","",1522,1580,1537,[0,0,0,0,100],"三村家臣。家親之弟。侄子元親為了恢復勢力而私通織田信長的時候，他反對被趕走。後來帶領毛利軍殺了元親，成為了備中鶴首城主。"],["杉原隆重",65,67,42,33,51,55,49,"武士","佛教","DCDDDDCCD","",1532,1581,1547,[0,100,0,0,0],"毛利家臣，起初為備後神邊城主杉原理興效力，理興死後，被吉川元春推薦為神邊城代。以後作為元春率領的山陰方面軍的先鋒表現活躍。"],["乃美宗勝",64,70,57,21,59,38,65,"海賊","佛教","DDDBDBSDC","",1527,1592,1542,[0,0,0,100,0],"毛利家臣。統率小早川水軍。嚴島會戰的時候將村上水軍拉攏到己方，為毛利軍的勝利作出了貢獻。木津川口會戰中擔任總大將，打敗織田水軍。"],["毛利元就",92,69,105,98,51,36,74,"武士","佛教","BCSCSBCCS","三矢訓",1497,1571,1512,[400,0,400,0,800],"安藝的戰國大名，使用各種計謀擴大勢力，成為中國10國之主，少有的謀將。嚴島會戰中用種種計謀算計陶晴賢，打敗了5倍於自己的敵人。"],["毛利隆元",76,74,72,85,79,36,40,"武士","佛教","CDBDBCCDA","三矢訓",1523,1563,1538,[100,100,400,0,200],"安藝的戰國大名，元就的嫡子。成為大內家的人質，由大內義隆加冠完成成人儀式。在父親的指導下經營中國，遠征出雲途中猝死。"],["毛利輝元",60,51,26,62,71,31,72,"武士","佛教","CDCDDDCCD","",1553,1625,1568,[0,0,100,0,0],"安藝的戰國大名，隆元的嫡子，祖父元就死後，繼承家業。屬豐臣家成為五大老之一，關原會戰中屬於西軍，戰後，被減封了防長2國。"],["吉川元春",95,94,78,61,82,41,56,"武士","佛教","BSACBACDB","三矢訓",1530,1586,1545,[100,400,400,0,300],"毛利元就的次子，繼承了安藝的豪族吉川家，攻打山陰地區。家中頭號猛將，沒有敗績，據說在營中抄寫了40卷「太平記」。"],["吉川元長",75,81,51,49,74,41,39,"武士","佛教","DBDCDDCDD","",1548,1587,1563,[0,400,0,0,0],"元春的長子。武勇不亞於其父，隨同豐臣秀吉征伐九州，也經常取得勝利。父親退隱後，他繼承了家業，父親死後不久他也病死了。"],["吉川廣家",74,60,79,80,42,41,64,"武士","佛教","BDBCBDBAB","",1561,1625,1576,[100,0,0,100,300],"元春之三子，關原會戰中，預料到西軍會失敗，通過外交工作欲保全毛利宗家。可是宗家被減封了防長2國，家中批判他是叛徒。"],["小早川隆景",87,76,92,94,90,31,64,"武士","佛教","BCSBABABA","三矢訓",1533,1597,1548,[100,0,400,100,400],"毛利元就的三子，繼承了安藝的豪族小早川家，攻擊山陰地區。本能寺事變後，為了保全毛利宗家而接近豐臣秀吉，成為五大老之一。"],["穗井田元清",71,66,53,56,64,36,46,"武士","佛教","DBDDDCCDC","",1551,1597,1566,[0,100,0,0,0],"毛利元就的四子，繼承了備中的豪族穗井田家。攻擊山中鹿之介佔據的播磨上月城等等，在各地立下戰功。後來恢復毛利姓，成為長府毛利家之祖。"],["毛利秀元",66,69,30,50,62,31,71,"武士","佛教","CDCDDDBCD","",1579,1650,1594,[100,0,100,0,0],"穗井田元清之子，成為表兄弟輝元的義子。豐臣秀吉出兵朝鮮的時候，指揮毛利軍。關原會戰的時候奔赴主戰場，留下了「宰相的空飯盒」逸話。"],["熊谷信直",68,72,46,29,54,41,86,"武士","佛教","BCDDDCDDD","",1507,1593,1522,[100,0,0,0,0],"安藝武田家臣。後來與主家對立，而投靠毛利家。女兒嫁給元就次男吉川元春之後，成為一門眾而得到重用。擔任吉川軍先鋒，轉戰各地。"],["熊谷元直",51,39,24,40,34,41,50,"武士","佛教","DDDDDDDDC","",1555,1605,1570,[0,0,0,0,0],"毛利家臣，信直之孫。參加各地的會戰，表現活躍。受到黑田官兵衛的影響，成為了天主教徒。後來拒絕主公輝元的改宗命令，一家全都成了死罪。"],["宍戶隆家",52,51,37,61,50,43,74,"武士","佛教","CCDDDDCDC","",1518,1592,1533,[0,0,0,0,0],"安藝豪族。對抗毛利元就，但是後來娶元就之女‧五龍為妻，而使兩家和好、成為毛利家的一門眾。與吉川元春一同參與軍事行動，活躍於各地之戰役。"],["桂元澄",50,48,67,71,48,36,69,"武士","佛教","DDCDBDDBD","",1500,1569,1515,[0,0,0,0,100],"毛利家臣。擔任安藝櫻尾城主，負責包括嚴島神社在內的神領的管理、支配。嚴島會戰中給陶晴賢送去假信，成功地把晴賢引誘到嚴島。"],["志道廣良",43,33,77,76,56,35,90,"武士","佛教","DDDDADDDA","",1467,1557,1482,[0,0,0,0,400],"毛利家臣，盡力維持主公元就的毛利家。後來應元就的要求，輔佐元就的兒子隆元。告訴隆元「君是船，臣是水……。」等作當主的道理。"],["口羽通良",49,37,75,81,69,42,69,"武士","佛教","DDCDBCDCA","",1513,1582,1528,[0,0,0,0,200],"毛利家臣，志道廣良的次子。輔佐吉川元春經營山陰方面。主公元就死後，成為四人眾之一，輔佐輝元，參與國家的政務。"],["福原貞俊",50,48,80,78,70,31,81,"武士","佛教","CDCDADDBA","",1512,1593,1527,[0,0,100,0,300],"毛利家臣。擔任首席家老，輔佐小早川隆景，經營山陽方面。主公元就死後，成為四人眾之一，輔佐當主輝元，參與主家的國政。"],["國司元相",70,78,49,45,77,36,98,"武士","佛教","BCDDDBBDD","",1493,1591,1508,[100,100,0,0,0],"毛利家臣。於郡山之戰時，曾經擊倒敵將34人。後來成為五奉行之一。代替其主隆元到達京都的時候，得到將軍足利義輝傳授「槍之鈴」。"],["兒玉就忠",29,29,63,74,62,35,55,"武士","佛教","DDCDCDDBB","",1507,1562,1522,[0,0,0,0,100],"毛利家臣，從元就繼承家業後就作為親信，表現活躍。五奉行制成立後，成為其中一員。高瞻遠矚，很有辦事能力，元就給了他高度評價。"],["兒玉就方",66,71,48,32,54,35,75,"海賊","佛教","DDBCDBSDD","",1513,1588,1528,[0,0,0,100,0],"毛利家臣，經過兄長元忠的推薦，為元就效力。陶晴賢的勢力被逐出安藝後，他成為安藝革津城主。率領毛利水軍在北九州和山陰的海上轉戰。"],["堅田元慶",28,30,42,62,59,36,54,"武士","佛教","DDDDDDDCD","",1568,1622,1583,[0,0,0,0,0],"毛利家臣，原本姓粟屋，主公輝元賜姓堅田，因而改名。小早川隆景轉封伊予後，他成為備後三原城主。關原會戰中作為輝元的代表出戰。"],["佐波隆秀",45,43,58,48,38,47,74,"武士","佛教","DDCDDDDDD","",1522,1596,1537,[0,0,0,0,0],"石見的豪族，屬於大內家，但是主家滅亡後為毛利家效力，在石見平定戰中立下戰功。主公輝元出兵朝鮮的時候，負責守衛輝元的居城廣島城。"],["南方就正",54,46,55,43,50,38,59,"武士","佛教","DDDDDDDCC","",1540,1599,1555,[0,0,0,0,0],"毛利家臣，周防石田岳城主。得到大友宗麟援助的大內輝弘糾合大內家舊臣在周防發動叛亂的時候，追擊撤退到防府的輝弘軍，將其殺死。"],["市川經好",33,27,72,69,34,38,58,"武士","佛教","DDDDBDCDB","",1526,1584,1541,[0,0,0,0,300],"吉川家臣。與父親吉川經世一起致力於毛利元就次男元春之繼承吉川家。後來隸屬毛利家。大內家滅亡後擔任山口奉行，掌握防長兩國之行政。"],["吉川經安",57,67,44,52,56,42,49,"武士","佛教","DCDDDDDCD","",1525,1574,1540,[0,100,0,0,0],"毛利家臣。主家平定石見後，建築物不言城，作為居城。後來招致了因領地問題而背叛主家的福屋隆兼的攻擊，但是和兒子經家一起將其擊退。"],["吉川經家",73,77,43,23,87,42,34,"武士","佛教","BDCDDDDBD","",1547,1581,1562,[100,100,0,0,0],"毛利家臣，經安之子。接受山名豐國的流放，進入因幡鳥取城與羽柴秀吉軍作戰。不過敗給了秀吉斷絕水源的戰法，以保全守城兵士性命為條件，自殺了。"],["安國寺惠瓊",14,6,85,91,15,31,62,"僧侶","佛教","DDDDADDCA","",1538,1600,1553,[0,0,0,0,400],"毛利家臣，武田信重之子。武田家滅亡時逃出，出家為僧，成為外交僧。曾經預言織田信長與豐臣秀吉的未來而聞名。關原之戰時隸屬西軍，被斬首。"],["平賀元相",44,34,51,49,48,36,98,"武士","佛教","DDDDDCCDC","",1547,1645,1562,[0,0,0,0,0],"毛利家臣。廣相之子。受封豐臣之姓。關原之戰後，由於主家減封，俸祿被減四分之一，於是隱居而後上京都。後來移住其孫‧就忠所在之萩城。"],["大內義長",22,20,12,36,56,79,25,"高家","佛教","DDDDDDCCD","",1532,1557,1547,[0,0,0,0,0],"大內家第32代當主，大友義鑑的次子。大內義隆死後，被陶晴賢擁立，繼承了大內家。嚴島會戰中晴賢戰死了，招致毛利軍的不斷侵攻，自殺了。"],["青景隆著",9,8,70,60,6,59,42,"武士","佛教","DDDDCDDDB","",1514,1556,1529,[0,0,0,0,200],"大內家臣，為奉行人。與杉重矩對立，但是後來和解了。向陶晴賢說相良武任之讒言，製造晴賢謀反的契機。與毛利家之戰時戰死。"],["天野隆重",53,62,61,30,49,42,81,"武士","佛教","CDCDDDDCD","",1503,1584,1518,[100,0,0,0,0],"大內家臣，主家滅亡後屬於毛利家。尼子家滅亡後，成為出雲月山富田城代，擊退了山中鹿之介。後來輔佐元就的五子元秋，支配了出雲。"],["飯田興秀",27,53,69,72,30,59,63,"武士","佛教","DCBDBDDDB","",1493,1556,1508,[0,0,100,0,0],"大內家臣，擔任奉行人。主要在九州方面效力。讚成陶晴賢的謀反，主公義隆死後，為繼承了主家的義長效力。精通弓馬。"],["陶晴賢",90,85,72,75,50,64,34,"武士","佛教","ABBDCABCB","",1521,1555,1536,[100,400,100,0,200],"大內家臣，興房之子。被譽為「西國無雙的侍大將」，逼主公義隆自殺，奉大友晴英為當主，使主家成為傀儡。在嚴島會戰中敗給了毛利元就，自殺了。"],["杉重良",26,34,27,35,22,53,27,"武士","佛教","DDDDDDCDD","",1552,1579,1567,[0,0,0,0,0],"大內家臣。由於祖父重矩和父親重輔被陶晴賢所殺，他歸屬毛利家，娶了福原貞俊之女。後來屬於了大友家，但是被背叛大友家的高橋鑑種殺死。"],["問田隆盛",31,30,53,62,38,65,42,"武士","佛教","DDDDDDDDC","",1513,1555,1528,[0,0,0,0,0],"大內家臣，擔任石見守護代。陶晴賢謀反之際，贊同晴賢，仕奉繼承主家的義長。在滯留晴賢的居城若山城之際，遭到杉重輔的襲擊而戰死。"],["內藤隆春",25,20,47,66,51,54,72,"武士","佛教","DDCDDDCDC","",1528,1600,1543,[0,0,0,0,0],"大內家臣。主家滅亡後屬於毛利家。因為姐姐是毛利隆元之妻的緣故，得到了重用，竭力維持防長兩國的治安。晚年去了大阪，向本國傳達中央情勢。"],["仁保隆慰",50,41,62,67,43,43,64,"武士","佛教","DDDDCCDDD","",1513,1577,1528,[0,0,0,0,100],"大內家臣，擔任奉行人。主公義隆死後，他為陶晴賢擁立的大內義長效力。主家滅亡後，歸屬到毛利家，被任命為豐前門司城番和規矩郡代官職。"],["弘中隆兼",62,64,63,51,82,64,45,"武士","佛教","BCDDCDCCD","",1510,1555,1525,[100,0,0,0,200],"大內家臣，擔任安藝守護代。陶晴賢謀反後，他為大內義長效力。後來奉晴賢之命謀殺了江良房榮。跟隨晴賢參加了嚴島會戰，戰敗身死。"],["吉見正賴",52,50,71,68,74,3,75,"僧侶","佛教","CDDDBDDDC","",1513,1588,1528,[0,0,0,0,300],"大內家臣。娶了主公義隆的姐姐。為了打敗陶晴賢，為義隆報仇而起兵，與毛利元就聯合同晴賢作戰。晴賢在嚴島會戰中戰敗身死後，他歸屬了毛利家。"],["吉見廣賴",33,31,43,64,67,3,78,"武士","佛教","DDCDDCDDC","",1535,1613,1550,[0,0,0,0,0],"毛利家臣，正賴之子。攻擊出雲白鹿城等戰役中立下了功勳。正室、繼室相繼亡故，嫡子在出兵朝鮮的時候戰死了等等，背景十分不幸的武將。"],["益田藤兼",59,54,60,59,40,65,67,"武士","佛教","DDCDDDDDC","",1529,1596,1544,[0,0,100,0,0],"大內家臣，益田城主。主家滅亡後跟隨毛利家，在山陰平定戰中表現出色。晚年非常崇信佛教。家臣品川大膳與山中鹿之介單挑，戰敗了。"],["益田元詳",11,10,53,87,71,65,82,"武士","佛教","DDDDDDDBA","",1558,1640,1573,[0,0,0,0,0],"毛利家臣，藤兼之子。山陰平定戰中表現出色。關原會戰後主家被減封的時候，負責重整財政，為確立長門萩藩財政的基礎作出了貢獻。"],["大西賴武",52,51,57,32,46,58,59,"武士","佛教","DCDDDDDCD","",1519,1578,1534,[0,100,0,0,0],"阿波豪族，白地城主。稱為出雲守。大西家出身於三好郡大西村。侵略三好郡與讚岐豐田郡等地，統治大井莊。與長宗我部軍對戰時戰死。"],["大西賴晴",36,40,18,45,50,52,34,"武士","佛教","CDDDDDCDC","",1544,1578,1559,[0,0,0,0,0],"阿波豪族，白地城主。稱為上野介。大西家據說是清和源氏小笠原家或者是近藤家的後裔。與父親賴武在伊予對戰長宗我部元親之際，戰死。"],["七條兼仲",30,90,1,2,48,48,34,"武士","佛教","BDDDDDCDD","",1548,1582,1563,[400,0,0,0,0],"阿波的豪族，七條城主。中富川會戰中戰敗身死。力氣奇大的豪傑，武勇廣為流傳。據說大山寺舉行的「力餅大會」就是紀念他的活動之一。"],["小笠原成助",70,59,46,22,28,63,54,"武士","佛教","BCCDDDBDD","",1528,1582,1543,[100,0,100,0,0],"三好家臣，一宮城主。娶其主長慶之妹。於和泉久米田之戰，三好軍大吃敗仗之際整頓軍隊從容撤退，頗得讚賞。後來被長宗我部元親所殺。"],["寒川元鄰",50,41,53,47,65,59,41,"武士","佛教","DDCDDDDCD","",1541,1582,1556,[0,0,0,0,0],"讚岐豪族，虎丸城主。隸屬於三好家。安富家與篠原家企圖討伐寒川家之際，將領地與居城獻給其主長治，而倖免於難。後來在阿波中富川合戰中戰死。"],["高原次利",40,31,23,59,42,56,87,"武士","佛教","DDDDDDBDC","",1532,1619,1547,[0,0,0,0,0],"讚岐豪族。代代領有直島、男木島、女木島等地。豐臣秀吉攻擊備中高松城之際，擔任海陸嚮導的工作。後來在備前兒島郡增加了俸祿。"],["羽床資載",55,50,38,46,59,70,49,"武士","佛教","DDCDDCDDD","",1533,1582,1548,[0,0,100,0,0],"讚岐的豪族，羽床城主。招致長宗我部元親的攻擊，聽從元親的勸告，以次子資吉為人質投降了。進攻十河存保的居城讚岐十河城的時候病死了。"],["河野通直",40,38,23,55,19,29,93,"武士","佛教","DDDDDDBCD","",1479,1572,1494,[0,0,0,0,0],"伊予的戰國大名，湯築城主。相繼有家臣謀反和別國的侵攻，苦思對策。欲把家業讓給女婿來島通康，招致家臣的反對，發生了內亂。"],["河野通宣",48,51,41,54,49,32,54,"武士","佛教","DDCDDDADC","",1527,1581,1542,[0,0,100,0,0],"伊予的戰國大名，湯築城主。由於兄長晴通早逝，他繼承了家業。相繼招致大野家等家臣的謀反和毛利家等別國的侵攻，苦思對策。"],["河野通直",34,33,34,56,62,25,23,"武士","佛教","DDDCDCBCD","",1564,1587,1579,[0,0,0,0,0],"伊予的戰國大名，湯築城主，出身於庶流池原河野家。敗給長宗我部元親，成為其家臣，與豐臣秀吉的四國征伐軍作戰，失敗了。由於被免職，移居到了安藝。"],["大野直昌",70,66,54,47,83,28,56,"武士","佛教","BCDDDDBCD","",1534,1590,1549,[100,100,0,0,0],"河野家臣，大除城主。土佐一條家與毛利家攻入河野領地之際，成功擊退對方兵力。降於豐臣秀吉的四國征伐軍，追隨其主通直移往安藝。"],["金子元宅",65,72,62,21,77,29,34,"武士","佛教","DBCDDCCDD","",1551,1585,1566,[0,100,100,0,0],"伊予的豪族，金子城主。為長宗我部元親統一四國作出了貢獻。極有人格魅力的武將。抵抗豐臣秀吉的四國征伐軍，但是失敗，自殺了。"],["平岡房實",70,68,64,65,91,30,59,"武士","佛教","DDBDCDCCB","",1515,1574,1530,[0,0,100,0,100],"河野家臣，伊予荏原城主，擔任奉行人。與背叛主家的大野家和和田家戰鬥，另一方面還防守周圍諸國的大友家等的侵入，為了主家東奔西走。"],["平岡直房",41,39,51,38,73,30,54,"武士","佛教","DDCCDCDDD","",1551,1605,1566,[0,0,0,0,0],"河野家臣。主家滅亡後，伊予領主加藤嘉明出兵關原，領國空虛的時候，他為了復興主家而起兵，但是戰敗了，以後為毛利家效力。"],["村上武吉",88,84,68,19,40,36,71,"海賊","佛教","CDBBCASDD","",1533,1604,1548,[100,0,400,100,200],"能島村上水軍的首領。在嚴島合戰中對毛利軍的勝利貢獻頗鉅。之後便為毛利家效命，在木津川口合戰中大勝織田水軍等功績，使其勇名響遍各地。"],["來島通康",74,70,48,45,49,23,48,"海賊","佛教","CDBCDCSDC","",1519,1567,1534,[100,0,400,0,0],"河野家臣。來島村上水軍首領。受其主‧通直指名為其繼承人，因反對意見眾多而不能實現。嚴島合戰中，協助毛利軍，為勝利做了貢獻。"],["西園寺實充",68,61,71,70,64,54,61,"高家","佛教","CDBDBCBDB","",1511,1572,1526,[100,0,100,0,200],"伊予的豪族，黑瀨城主。與宇都宮豐綱的戰役中失去嫡子公高，以侄子公廣為義子。文武全才，上京都的時候參加了三條公朝邸的和歌會。"],["西園寺公廣",55,40,29,51,52,54,49,"高家","佛教","DDCDDDCDD","",1538,1587,1553,[0,0,0,0,0],"伊予的豪族，黑瀨城主。成為叔父實充的義子，繼承了家業。後來投降豐臣秀吉的四國征伐軍，但是被警戒西園寺舊臣叛亂的戶田勝隆謀殺。"],["北之川親安",44,60,42,50,34,52,49,"武士","佛教","DCDDDDDCD","",1534,1583,1549,[0,100,0,0,0],"西園寺家臣，三龍城主，西園寺十五將一員。娶長宗我部家臣波川玄蕃的女兒為妻，不過最後因為玄蕃企圖謀反，受到長宗我部元親的攻擊，戰敗而死。"],["土居清宗",70,58,72,63,66,54,77,"武士","佛教","CBBCADADC","",1483,1560,1498,[100,100,100,0,300],"西園寺家臣，伊予大森城主。西園寺十五將之一。經常擊退土佐一條家和大友家的侵襲軍。得到了主公實充的信賴。在與大友家的戰鬥中陣亡了。"],["土居清良",70,66,71,65,70,54,83,"武士","佛教","BCDCBDCDB","",1546,1629,1561,[100,100,0,0,200],"西園寺家臣，伊予大森城主。西園寺十五將之一。一度逃往大佐，得到土佐一條家的扶助後返回，在各地表現活躍。智勇雙全，著有「清良記」。"],["法華津前延",61,70,36,60,39,53,72,"武士","佛教","DCCDDCADC","",1521,1593,1536,[0,100,100,0,0],"西園寺家臣，伊予法華津城主。西園寺十五將次之一。幾次擊退大友家的侵襲軍。豐臣秀吉平定四國後，他奉宇和郡領主戶田勝賴之命下城。"],["長宗我部國親",85,70,78,81,54,75,56,"武士","佛教","ADDDBDDCA","",1504,1560,1519,[100,0,0,0,300],"土佐的戰國大名，岡豐城主。父親兼序死後，投奔一條房家，得到房家的援助後重返居城。通過聯姻外交和積極的富田政策重振長宗我部家威風。"],["長宗我部元親",93,86,95,88,11,80,60,"武士","佛教","SCDCASBBA","",1539,1599,1554,[400,100,0,100,400],"土佐的戰國大名，岡豐城主，國親之子。率領剽悍的一領盔甲眾，瞬間控制了周圍諸國。用了十幾年統一了四國，綽號「土佐第一人」。"],["長宗我部信親",75,81,66,67,85,75,21,"武士","佛教","ABDCDDBBC","",1565,1586,1580,[100,100,0,100,0],"元親的嫡子。織田信長將偏諱賜給他。文武全才，聲望頗高。跟隨豐臣秀吉征伐九州，在豐後戶次川會戰中戰死。元親十分悲痛。"],["長宗我部盛親",78,77,35,24,74,80,40,"武士","佛教","BCDBDBBDD","",1575,1615,1590,[0,0,0,100,0],"元親的四子。關原會戰中屬於西軍，被免職，在京都開寺子屋。後來去了大阪城，消滅了藤堂高虎軍等等，表現出色，大阪陷落後被斬首。"],["吉良親貞",81,84,64,52,65,75,35,"武士","佛教","AADCCACDC","",1541,1576,1556,[100,400,0,0,200],"長宗我部國親的次子。剛毅而且富有智謀的武將，作為兄長元親的左右手，為統一土佐作出了貢獻。土佐一條間滅亡後，他成為土佐中村城代，但不久就病死了。"],["吉良親實",62,66,25,53,59,73,25,"武士","佛教","DCDDDCDCD","",1563,1588,1578,[0,100,0,0,0],"長宗我部家臣，親貞的嫡子。宗家繼承家業的時候，向希望擁立四子盛親的伯父元親進諫，但是由於對立勢力的久武親直的讒言，元親命他自殺了。"],["香宗我部親泰",76,73,83,83,79,78,50,"武士","佛教","BCACBBCDA","",1543,1593,1558,[100,0,400,0,300],"長宗我部國親的三子。阿波中富山合戰中擊敗十河存保軍等，作為兄長元親的左右手為統一四國作出了貢獻。作為使者出使過織田家等，在外交方面也表現活躍。"],["桑名吉成",50,69,47,44,18,75,64,"武士","佛教","CDDDDDCDC","",1551,1615,1566,[100,0,0,0,0],"長宗我部家臣，擔任土佐中村城代。在戶次川會戰、鎮壓浦戶起義等行動中表現活躍。主家被免職後，他歸屬藤堂家。大阪夏季戰役時，與舊主盛親作戰，戰死。"],["谷忠澄",32,16,81,80,69,74,66,"僧侶","佛教","DDCDADDDA","",1534,1600,1549,[0,0,0,0,200],"長宗我部家臣。專長謀略，負責外交工作。與豐臣秀吉的四國征伐軍作戰，判斷抗戰沒有勝機，勸主公元親議和。於滅亡的危機中挽救了主家。"],["豐永勝元",35,40,55,71,63,77,86,"武士","佛教","DDDDDDDCB","",1551,1637,1566,[0,0,0,0,0],"長宗我部家臣。追隨其主元親活躍於阿波統一戰，也以奉行的身份參與國政。在關原會戰後成為浪人。大阪之陣時，跟隨舊主盛親而作戰。"],["久武親信",65,71,61,40,56,75,39,"武士","佛教","BCDDDCCCD","",1540,1579,1555,[100,100,0,0,0],"長部我部家臣。為人誠實，得到了元親的高度信任。受命攻打南伊予地區，多次與小豪族們作戰。在攻打伊予岡本城時戰死了。"],["久武親直",29,21,82,62,7,83,59,"武士","佛教","DDDDADDDC","",1546,1605,1561,[0,0,0,0,300],"長宗我部家臣。以陰謀和讒言逼得許多同僚自殺，造成了主家滅亡的原因。據說兄長親信向主公元親說過「弟弟必將有禍主家」。"],["福留親政",68,87,21,17,68,75,49,"武士","佛教","ABDDDDDDD","",1528,1577,1543,[100,400,0,0,0],"長宗我部家臣。在與安藝家之戰鬥中活躍，留下了「福流之荒切」之逸聞。從其主元親那收到21張感謝狀，是家中屈指可屬的勇將。於南伊予攻略戰時戰死。"],["福留儀重",71,80,45,21,62,75,37,"武士","佛教","ACDDDCCDD","",1549,1586,1564,[100,100,0,0,0],"長宗我部家臣。連童謠中都稱頌他的猛將，為主家統一四國作出了貢獻。主公元親發佈禁酒令的時候，他摔碎酒杯進諫。參加了戶次川會戰，陣亡了。"],["吉田孝賴",69,53,84,65,42,75,74,"武士","佛教","CDBDSADDC","",1495,1569,1510,[100,0,0,0,400],"長宗我部家臣。娶了主公國親的妹妹。公認為智勇兼備的武將，專長各種計謀。另一方面，在各地經常立下軍功，作為國親的左右手，為主家擴大勢力作出貢獻。"],["吉田重俊",55,47,77,43,54,75,74,"武士","佛教","DCDDACDCD","",1500,1574,1515,[0,0,0,0,300],"長宗我部家臣，孝賴之弟。與安藝國虎作戰的時候，使用謀略，使安藝家中內部崩潰等等，智謀十分出眾的武將，與兄長一起為主家的興盛作出了貢獻。"],["吉田康俊",58,60,60,47,59,80,69,"武士","佛教","DDDCDDDCD","",1565,1634,1580,[0,0,0,100,0],"長宗我部家臣。中富川會戰和戶次川會戰中立下了戰功。主家被免職後，他作了山內家臣，但是不久就去大和隱居。後來去了大阪，跟隨舊主盛親作戰。"],["江村親家",72,74,36,20,64,75,66,"武士","佛教","DBBCDDDCD","",1525,1591,1540,[0,100,400,100,0],"長宗我部家臣。吉田重俊次子，為江村親政女婿。與父親同為備後守，所以人稱「小備後」。曾經參與多次的戰役，其威名廣遍鄰國。"],["本山茂宗",75,71,70,42,21,25,48,"武士","佛教","CBCDCCDCC","",1507,1555,1522,[100,100,100,0,0],"土佐的豪族，本山城主。將統治範圍擴大到嶺北地區一帶、南方的平野部，建立了本山家最大的版圖。後來把本山城讓給兒子茂長，自己回到土佐朝倉城。"],["安藝國虎",67,72,23,37,48,9,39,"武士","佛教","BDCDDDDDC","",1530,1569,1545,[100,0,100,0,0],"土佐的豪族，安藝城主。長宗我部元親請他去居城土佐岡豐城，他拒絕了，與元親作戰。可是由於元親的謀略，家臣們內部分裂了，最後戰敗，自殺了。"],["公文重忠",49,70,52,2,34,26,59,"武士","佛教","BCDDDDCCD","",1518,1577,1533,[0,100,0,0,0],"土佐的豪族，德著城主。起初與長宗我部國親作戰，但是後來成為其家臣，在各地的會戰中表現活躍。是員勇將，但是很窮，據說過年都吃不好。"],["黑岩種直",40,42,46,44,56,21,34,"武士","佛教","DDCDDDDDC","",1548,1582,1563,[0,0,0,0,0],"安藝家臣。父親越前在主家滅亡時，將主公國虎的夫人送到娘家土佐一條家後，在國虎的墓前殉死。為長宗我部家效力，在中富川會中戰死。"],["一條兼定",7,3,4,29,22,93,42,"高家","佛教","DDDDDDDDC","",1543,1585,1555,[0,0,0,0,0],"土佐一條家第4代當主，房基之子。日夜沉迷於酒色，終於被家臣們趕走。後來在大友宗麟的援助下欲恢復舊領地，但是失敗了。"],["小島政章",58,55,52,33,77,93,53,"武士","佛教","CDDDDCDDC","",1538,1591,1553,[100,0,0,0,0],"土佐一條家臣。對把主公兼定流放到兼定十分不滿，攻擊背叛兼定的家臣們的居城。後來投降長宗我部元親的侵襲軍，努力平定幡多地區。"],["漥川俊光",51,43,27,32,38,90,49,"武士","佛教","DDCDDDDCD","",1530,1579,1545,[0,0,0,0,0],"土佐一條家臣。串山城主。以高岡郡窪川鄉為根據地，從山內改姓為窪川。之後為長宗我部元親麾下。追隨久武親直，在攻略南伊予時戰死。"],["高島正重",4,6,71,72,62,92,69,"武士","佛教","DDDDBDDBC","",1567,1636,1582,[0,0,0,0,200],"長宗我部家臣，主公元親的親信。主家被免職後，為山內家效力。文才頗好，元親的三十回忌的時候寫了「元親記」。"],["立石正賀",24,26,74,73,54,93,59,"武士","佛教","DDDCBCDDB","",1565,1624,1580,[0,0,0,0,300],"長宗我部家臣。進攻伊予三瀧城等戰役中立下戰功。關原會戰失敗的時候，擔任投降的使者。主家被免職後為肥後細川家效力。後來著有「長元記」。"],["土居宗珊",70,60,77,74,82,92,59,"武士","佛教","BDBDBBCCB","",1513,1572,1528,[100,0,100,0,400],"土佐一條家臣。經常勸諫不務正業的主公兼定，但是得罪了兼定，被斬首。由此導致家臣們離心，將他趕走。"],["城井正房",43,40,59,69,46,68,83,"武士","佛教","DDCDCDDDB","",1478,1561,1493,[0,0,0,0,100],"城井宇都宮家第14代當主。為大內家效力。聯合少貳、大友家與主家對抗，但是招致一族的佐田俊景的攻擊，戰敗後投降了，以後再次臣從了大內家。"],["城井長房",62,54,44,53,51,71,82,"武士","佛教","CDCDDCDDD","",1506,1588,1521,[100,0,0,0,0],"城井宇都宮家第15代當主，正房之子。很早就要把家業讓給了兒子鎮房。自己兩次參與了下野宇都宮家的繼嗣問題。後來和鎮房一起被黑田長政殺死。"],["城井鎮房",72,70,36,45,35,71,52,"武士","佛教","CBDDDDDCD","",1536,1588,1551,[0,100,0,0,0],"城井宇都宮家第16代當主，長房之子。從屬於大友、島津家，保全了領地。後來投降了豐臣秀吉，但是拒絕被轉封到伊予，發動謀反，被黑田長政殺死。"],["佐田隆居",48,44,63,55,66,91,69,"武士","佛教","DDDDCDDDC","",1519,1588,1534,[0,0,0,0,0],"大內家臣，擔任宇佐郡代。主家滅亡後歸屬於大友家，作宇佐郡眾的核心人物表現活躍。安心院麟生背叛大友家的時候，以保全領地為條件讓其歸順了。"],["佐田鎮綱",53,50,45,57,74,91,52,"武士","佛教","DDDDDDDDD","",1541,1593,1556,[0,0,0,0,0],"大友家臣。隆居之子。曾率領宇佐郡的國眾參與各地戰役。主家在耳川之戰中慘敗後，在許多國眾陸續脫離主家時，他繼續侍奉大友家。"],["佐佐木小次郎",22,100,13,14,70,75,22,"劍豪","佛教","BDDDDDDDD","混戰",1590,1612,1605,[100,0,0,0,0],"別名巖流。在武者修行後，創出了「燕歸來」劍法。雖然打算侍奉增田長盛卻不被豐臣秀吉允許。在巖流島與宮本武藏決鬥，敗北而死。"],["大友宗麟",82,71,75,87,2,84,57,"武士","佛教","CCDABSCBA","",1530,1587,1545,[100,0,0,100,200],"大友家第21代當主，削髮，號宗麟。最昌盛時期佔有北九州6個國，但是在耳川會戰中大敗給島津軍，損失了大半家臣，以後逐步走向沒落。"],["大友義統",39,33,13,49,36,84,52,"武士","佛教","DDDCDCCDD","",1558,1610,1573,[0,0,0,0,0],"大友家第22代當主，宗麟之子。受到島津，龍造寺兩家的壓迫，投靠豐臣秀吉，保住了豐後一國的領地。可是，由於出兵朝鮮的時候臨陣逃脫，被免職了。"],["大友親家",61,68,25,27,59,86,80,"武士","佛教","CDDCDDCDC","",1561,1641,1576,[0,0,0,100,0],"大友家臣，宗麟的次子。奉父親之命作了僧侶，但是致力武術，後來還俗。由於私通島津義久，被沒收了領地。主家被免職後，為肥後細川家等效力。"],["一萬田鑑實",78,64,44,41,64,86,53,"武士","佛教","BCDCDBCBD","",1535,1588,1550,[100,100,0,0,0],"大友家臣，豐後小牟禮城主。一生中幾乎都在軍營中渡過，另一方面，邀請主公宗麟，召開過觀櫻會，也是風流人物。家族中有人謀反，他承擔責任，自殺了。"],["臼杵鑑續",41,41,80,81,59,89,52,"武士","佛教","DDCDADDDB","",1509,1561,1524,[0,0,0,0,200],"大友家臣，擔任筑前好土岳城督，經營筑前。還管理主要的外交事務，與大內家和解、使主公宗麟之弟義長入嗣大內家等等。"],["臼杵鑑速",58,51,74,80,62,89,57,"武士","佛教","DDDDBDCDA","",1518,1575,1533,[0,0,0,0,200],"大友家臣。豐後三老中一員。除了擔任外交事務之外，擔任肥前方分，參與各項國政策劃。此外也曾擔任筑前平定軍的主將職位，活躍於各個領域當中。"],["佐伯惟教",60,56,53,36,38,90,54,"武士","佛教","CDDCDDBDC","",1524,1578,1539,[100,0,0,0,0],"大友家臣。二階崩之變的時候，擁戴主公宗麟，鎮壓了事變。一度為西園寺家效力，但是後來返回。奉宗麟之命去日向，但是在耳川會戰中戰死了。"],["志賀親守",41,31,60,64,34,80,84,"武士","佛教","DDCDDDDDC","",1514,1598,1529,[0,0,0,0,0],"大友家臣，豐後岡城主。負責肥後方面工作。耳川會戰的時候採取消極的行動，造成大友家大敗的原因。主公義統出兵朝鮮的時候，他留在了豐後。"],["志賀親度",21,32,37,30,23,81,52,"武士","佛教","DDDDDCDDD","",1535,1587,1550,[0,0,0,0,0],"大友家臣，豐後岡城主，親守之子。擔任肥後方面的工作。由於經常與主公義統對立，接應島津義久的豐後侵入軍，兒子親次逼他自殺了。"],["志賀親次",80,84,71,11,31,80,41,"武士","佛教","ABDBCBDCD","",1566,1607,1581,[400,100,0,100,0],"大友家臣，豐後岡城主，親度之子，島津家臣新納忠元率領的3萬5千大軍被他僅用數千兵士就擊退了，而且奪回近鄰諸城，得到豐臣秀吉的獎賞。"],["田北鎮周",59,69,35,29,48,89,35,"武士","佛教","DBDDDDDDD","",1543,1578,1558,[0,100,0,0,0],"大友家臣，豐後蚊尾城主。擔任加叛眾。耳川會戰的時候，對總大將田原章賢支持佐伯惟教的慎重論調很不滿，作為先鋒突擊島津軍，戰死了。"],["田原親賢",38,30,76,51,36,81,59,"僧侶","佛教","DDDCBCDDC","",1541,1600,1556,[0,0,0,0,300],"大友家臣。作為義兄弟宗麟的親信參與國政，耳川會戰的時候擔任總大將，但是沒有管理好諸將，打了大敗仗。關原會戰的時候，在九州戰死。"],["高橋鑑種",67,60,52,46,54,90,49,"武士","佛教","CDDCDDCCD","",1530,1579,1545,[100,0,0,0,0],"大友家臣，擔任筑前寶滿城主，負責筑前的經營。後來私通毛利家，發動叛亂，造成了大友家與毛利家在筑前全面決戰的契機。"],["高橋紹運",95,94,70,22,100,84,38,"武士","佛教","AABCCCCBD","",1548,1586,1563,[400,100,0,100,0],"大友家臣，筑前岩屋城主。吉弘鑑理的次子。與立花道雪齊名的猛將。在居城僅以7百兵士迎擊島津軍5萬大軍，殺敵無數，全軍覆沒。"],["角隈石宗",63,38,88,75,50,85,59,"武士","佛教","CDBDASDBB","",1519,1578,1534,[0,0,100,0,300],"大友家臣，擔任主公宗麟的軍師。宗麟遠征日向的時候，他建議延期，但是被拒絕，因此，他燒了秘傳之書出戰，戰死了。"],["立花道雪",107,89,86,54,94,84,72,"武士","佛教","SBBDAADCD","強襲",1513,1585,1528,[400,100,0,0,200],"大友家臣，立花城西城督。遭雷劈不能步行，乘車經常為大友軍衝鋒陷陣，綽號「鬼道雪」，一生都在軍營中渡過，家中頭號猛將。"],["立花宗茂",97,94,68,60,97,84,75,"武士","佛教","BSCBCSBBC","",1567,1642,1582,[100,400,0,100,100],"大友家臣，高橋紹運之子。娶了立花道雪之女。豐臣秀吉稱讚他的忠義和剛勇鎮西第一。關原會戰中屬於西軍，被免職，但是後來恢復了舊領地。"],["吉岡長增",28,24,87,58,43,86,74,"武士","佛教","DDDDAADDC","",1499,1573,1514,[0,0,0,0,400],"大友家臣，豐後三老之一，智謀過人。大友家和毛利家在和筑前對峙的時候，煽動大內義隆的表兄弟輝弘進攻周防，迫使毛利家撤退。"],["吉弘鑑理",70,71,54,68,65,86,56,"武士","佛教","BCDCDDCBC","",1515,1571,1530,[100,100,0,0,0],"大友家臣，豐後三老之一。輔佐主公義鎮的執政。在勢場原會戰中擊退大內軍，而且在多多良濱會戰中擊敗毛利軍等等，在很多會戰中立下戰功。"],["吉弘鎮信",64,58,46,54,67,89,38,"武士","佛教","DDBDDCDDD","",1540,1578,1555,[0,0,100,0,0],"大友家臣，鑑理之子。小時候就侍俸在主公宗麟左右。擔任立花城西城督，從事博多的經營，與富商島井宗室等人關係密切。耳川會戰中戰死。"],["吉弘統幸",62,70,53,38,82,87,36,"武士","佛教","BDDCDCCDC","",1564,1600,1579,[100,0,0,100,0],"大友家臣，鎮信之子。關原會戰的時候反對主公義統加盟西軍，主張加盟東軍，沒有被採納。跟隨義統與黑田官兵衛作戰，戰死了。"],["築紫惟門",51,49,57,32,62,45,36,"武士","佛教","DDDDDDDCD","",1531,1567,1546,[0,0,0,0,0],"肥前的豪族，五箇山城主。屬於少貳家，招致大內家臣陶興房的進攻，戰敗。大內家滅亡後，和秋月文種一起歸屬毛利元就，但是招致大友軍進攻，自殺了。"],["築紫廣門",43,40,82,62,17,45,67,"武士","佛教","DDDDBBDDC","",1556,1623,1571,[0,0,0,0,100],"肥前的豪族，五箇山城主，惟門之子。在毛利、大友、龍造寺、島津家之間朝三暮四，後來投降了豐臣秀吉。關原會戰中屬於西軍，被免職。"],["原田隆種",74,67,43,28,32,86,75,"武士","佛教","CBBDDDDDD","",1513,1588,1528,[100,100,0,0,0],"筑前豪族，高祖城主。與大內家結盟共同於筑前西部構成一股強大勢力，曾數度擊敗大友家軍隊。為平定藤原純友叛亂有功的大藏春實嫡系。"],["原田信種",53,56,36,40,46,87,38,"武士","佛教","DDDCDDDCD","",1560,1598,1575,[0,0,0,0,0],"筑前豪族。高祖城主。草野鎮永之子。在原田隆種之子親種死後，成為其養子繼承家業。最後投降豐臣秀吉，保住領地。在派兵朝鮮時戰死。"],["秋月文種",71,68,23,43,50,34,41,"武士","佛教","BCDDDDDDC","",1516,1557,1531,[100,100,0,0,0],"筑前的豪族，古處山城主。屬於大友家，但是對自己的待遇不滿，聯合毛利元就，謀反了。面對2萬大友軍，英勇善戰，因寡不敵眾，戰敗，自殺了。"],["秋月種實",60,57,66,61,59,34,48,"武士","佛教","DDCDCCDDD","",1548,1596,1557,[0,0,100,0,0],"筑前的豪族，古處山城主，文種的長子。得到毛利家的援助，從大友家奪回了居城，敗給了豐臣秀吉的九州征伐軍，獻上「楢柴茶入」，避免了被罷職的命運。"],["蒲池鑑盛",69,66,70,71,97,68,58,"武士","佛教","CCDDCCDBB","",1520,1578,1535,[100,100,0,0,100],"筑後的豪族，柳河城主，鑑久的嫡子。屬於大友家。兩度保護了面臨滅亡危機的龍造寺家，參加了耳川會戰，一族人一起戰死了。"],["蒲池鎮漣",67,68,48,62,82,68,34,"武士","佛教","CDDDDDDDC","",1547,1581,1562,[100,0,0,0,0],"筑後的豪族，柳河城主，鑑盛的嫡男。父親死後繼承了家業。幫助龍造寺隆信經營筑後，後來對立。被叫到隆信的居城肥前佐賀城。"],["田尻鑑種",42,44,46,61,32,61,59,"武士","佛教","DDDDDDDDC","",1529,1588,1544,[0,0,0,0,0],"筑後的豪族。鷹尾城主。為龍造寺隆信效力，攻打三池鎮實時擔任先鋒。一度與隆信不和，不久後和解。參加了出兵朝鮮戰役，著有「高麗日記」。"],["間註所統景",51,50,55,38,69,90,51,"武士","佛教","DDCDDDDDD","",1542,1593,1557,[0,0,0,0,0],"筑後的豪族，長岩城主。耳川會戰後也屬於大友家進行作戰，得到主公義統的獎賞。豐臣秀吉征伐九州後，他屬於了小早川家。參加了出兵朝鮮行動，戰死了。"],["江上武種",74,72,69,23,77,28,49,"武士","佛教","CBDDCBDCD","",1526,1575,1541,[0,400,0,0,200],"少貳家臣，肥前勢福寺城主。反對龍造寺隆信繼承家業的東肥前十九將之一。殺死龍造寺家臣小田政光等等，表現活躍，後來成為龍造寺家臣。"],["小田政光",57,55,66,72,25,24,49,"武士","佛教","DDCDCCDDD","",1509,1558,1524,[0,0,0,0,300],"少貳家臣，肥前蓮池城主。反對龍造寺隆信繼承家業的東肥前十九將之一，與隆信爭鬥。隆信重返肥前後，為隆信效力，討伐江上武種的時候戰死了。"],["神代勝利",77,70,78,50,71,28,54,"僧侶","佛教","BCBCBDDBD","",1511,1565,1526,[100,0,100,100,200],"少貳家臣，肥前三瀨城主。夢想頭枕北山，腳泡南海，武運極好。殺死龍造寺家臣小田政光等等，終生與龍造寺家對抗。"],["龍造寺隆信",87,91,59,42,10,62,55,"僧侶","佛教","ABDADADDD","",1529,1584,1544,[100,100,0,400,0],"龍造寺家第19代當主，周家之子。統一村中、水江兩家，擴大勢力，佔領了九州5國2島，人稱「肥前之熊」。沖田畷會戰中大敗給島津軍，戰死了。"],["龍造寺政家",58,45,11,30,28,62,51,"武士","佛教","DDDDDDDCD","",1556,1607,1571,[0,0,0,0,0],"龍造寺家第20代當主，隆信的嫡子。擔任豐臣秀吉的九州征伐軍的先鋒，保全了領地。由於有疾，得到秀吉的許可，委託家臣鍋島直茂經營領國。"],["龍造寺信周",61,52,56,60,62,62,74,"武士","佛教","DDCDDDDDC","",1534,1608,1549,[0,0,100,0,0],"龍造寺家臣，周家的次子。成為須古鍋島家之祖。大友家衰退後，進入豐前方面，讓豐前的諸將歸順，負責政務，為兄長隆信擴大勢力作出了貢獻。"],["龍造寺長信",59,51,54,63,55,62,64,"武士","佛教","DDDCDDDDC","",1539,1603,1554,[0,0,0,100,0],"龍造寺家臣，周家的三子。多久家之祖。擔任肥前尾峰城主，防範西肥前的有馬家和松浦家。為兄長隆信在肥前確立勢力作出了極大貢獻。"],["龍造寺家就",62,53,46,55,51,60,59,"武士","佛教","CCDDDCDDD","",1528,1587,1543,[0,100,0,0,0],"龍造寺家臣，胤久的次子。龍造寺隆信統一了村中、水東兩家後，跟隨了隆信。在討伐少貳家時立下戰功。後來去了肥後，與北上的島津軍作戰。"],["龍造寺家晴",60,58,52,46,43,60,66,"武士","佛教","DDDCDDDDD","",1547,1613,1562,[0,0,0,0,0],"龍造寺家臣。鑑兼之子。曾於攻柳河城時相當活躍。後來成為柳河城主，與大友軍交戰。在豐臣秀吉征九州後，成為諫早城主，亦為諫早家之祖。"],["鍋島清房",60,69,57,52,66,58,73,"武士","佛教","DCBDDDDDD","",1512,1585,1527,[0,100,100,0,0],"龍造寺家臣，清久之子。田手雰會戰中和父親一起解救龍造寺軍，娶了龍造寺家純之女。後來，與主公隆信之母慶誾尼再婚，加深了與主家的關係。"],["鍋島直茂",90,85,91,93,44,58,80,"武士","佛教","BACAABBAA","",1538,1618,1553,[100,400,0,100,200],"龍造寺家臣，清房之子。智勇兼備的武將，為主家的發展作出了貢獻。輔佐主公政宗執行國政，在關原會戰中屬於東軍，戰後，獲得了肥前的支配權。"],["鍋島勝茂",71,68,60,78,65,58,77,"武士","佛教","BCDBDBBCB","",1580,1657,1595,[100,0,0,100,0],"肥前佐賀藩主，直茂的嫡子。關原會戰中屬於西軍，但是通過巧妙的事後處置保全了領地。島原之亂的時候，付出了很大犧牲，也為鎮壓混亂做出了貢獻。"],["江里口信常",80,87,39,6,93,62,36,"武士","佛教","ABDDDDDDD","",1548,1584,1563,[400,100,0,0,0],"龍造寺家臣，龍造寺四天王之一。沖田雰會戰中聽到主公隆信戰死的稟報後，單身殺入島津家久軍的主營，戰死了。家久稱讚他剛勇無雙。"],["元城寺信胤",76,80,41,11,79,62,43,"武士","佛教","CADCDBDDD","",1541,1584,1556,[100,400,0,100,0],"龍造寺家臣，龍造寺四天王之一。沖田畷會戰中接到主公隆信戰死的稟報後，殺入敵陣戰死了。"],["木下昌直",81,76,48,18,34,62,86,"武士","佛教","DBADDDDDD","",1524,1610,1539,[0,100,400,0,0],"龍造寺家臣，龍造寺四天王之一。沖田雰會戰中聽到主公隆信戰死的稟報後，讓鍋島直茂逃跑，自己殺入敵陣。生死不明，說法很多。"],["成松信勝",83,79,55,21,90,62,44,"武士","佛教","CCDADDDDD","",1540,1584,1555,[100,100,0,400,0],"龍造寺家臣，龍造寺四天王之一。今山會戰中殺死大友軍總大將，立下大功。作為軍事奉行參加了沖田畷會戰，聽說主公隆信戰死後，殺入敵陣，戰死了。"],["百武賢兼",78,84,25,17,85,62,46,"武士","佛教","ADBDDDDCD","",1538,1584,1553,[400,0,100,0,0],"龍造寺家臣，龍造寺四天王之一。今山會戰等戰役中表現出色，武勇過人，力敵百人，主公隆信賜給他百武姓。沖田畷會戰的時候，守在隆信的身邊，戰死了。"],["執行種",70,75,58,44,62,61,54,"武士","佛教","ADDDDCDDD","",1530,1584,1545,[100,0,0,0,0],"兼江上家臣。後來與其主武種一同投靠龍造寺家。為知名的勇將，在各地的戰鬥中活躍。於沖田畷合戰中，雖然不穿鎧甲僅穿著羽織褲奮戰，卻因此陣亡。"],["成富茂安",66,74,31,76,64,60,74,"武士","佛教","DCCCDCCBB","",1560,1634,1575,[0,100,100,100,0],"龍造寺家臣。在各地的會戰中立下很大的軍功，豐臣秀吉也認可他的武勇。後來為肥前佐賀藩主鍋島家效力，從事土木、水利事業等等。"],["松浦隆信",58,52,61,82,38,22,70,"海賊","佛教","CDDBDCSDB","",1529,1599,1544,[0,0,0,100,0],"肥前的豪族，平戶城主，興信之子。與平戶港為基地，與南洋進行交易。以豐富的資金實力做背景擴大勢力，但是後來敗給龍造寺隆信，從屬隆信了。"],["松浦鎮信",49,44,79,78,55,23,65,"海賊","佛教","CDDBBBSDB","",1549,1614,1564,[0,0,0,100,300],"肥前的豪族，平戶城主，隆信之子。跟隨豐臣秀吉征伐九州。與海外通商，負責唐船、南洋船的靠港。關原會戰中屬於東軍，保全了領地。"],["有馬晴純",80,64,70,85,34,24,83,"武士","佛教","BDCBBAACA","",1483,1566,1498,[400,0,0,100,200],"肥前的豪族，日野江城主。以島原半島為中心擴大勢力，建立了有馬家最大的版圖。而且讓次子純忠入嗣大村家，雙方和解，確定了安定的支配體制。"],["有馬義貞",17,15,21,44,46,22,55,"武士","佛教","DDDCDDBDD","",1521,1576,1536,[0,0,0,0,0],"肥前的豪族。日野江城主，晴純的嫡子。成為了將軍足利義晴的相伴眾。與龍造寺隆信展開抗爭，但是接連戰敗，失去了領地。據說愛好詩歌。"],["有馬晴信",54,60,32,66,38,21,45,"武士","基督教","CDDBDAADC","",1567,1612,1576,[0,0,0,100,0],"肥前的豪族，日野江城主，義貞的次子。兄長義純死後，繼承了家業。聯合島津家，欲恢復勢力。後來發生雰木大八事件，在甲斐被處斬。"],["安富純治",57,54,45,42,47,22,44,"武士","佛教","DDCDDDCDD","",1540,1584,1555,[0,0,0,0,0],"有馬家臣，肥前深江城主。跟隨主公晴信與龍造寺隆信作戰，後來歸屬於隆信。以此為契機，有馬和龍造寺家間講和了。在沖田畷會戰中戰死了。"],["安富純泰",48,53,56,32,67,26,49,"武士","佛教","DDDCDDCDD","",1560,1609,1575,[0,0,0,0,0],"有馬家臣，肥前深江城主。後來歸屬了龍造寺隆信。有馬軍攻打其居城，在龍造寺軍的救援下，將敵人擊退。沖田雰會戰中隆信戰死後，他改姓了深江。"],["大村純忠",58,37,48,69,70,24,54,"武士","佛教","CDDBDCADB","",1533,1587,1548,[0,0,0,100,0],"肥前的豪族，三城主，有馬晴純的次子。成為大村純前的義子，繼承了家業。在長崎建立港口，與葡萄牙進行交易。作為日本最初的天主教大名而聞名。"],["大村喜前",44,50,28,40,36,21,47,"武士","佛教","DDDBDCBDD","",1569,1616,1584,[0,0,0,0,0],"肥前的豪族，三城主，純忠的嫡子。關原會戰中屬於東軍，保全了領地。從天主教轉到日蓮宗，迫害天主教徒，因此被毒殺。"],["赤星親家",51,47,53,68,43,63,48,"武士","佛教","DDCDDDDBD","",1514,1562,1529,[0,0,0,0,0],"菊池家臣。主公義武的肥後隈本城恢復戰的時候，他屬於了大友家，作為恩賞，成為了肥後隈府城主，支配菊池郡。後來與隈部親永對立，作戰，失敗了。"],["赤星統家",37,40,41,56,55,63,89,"武士","佛教","CDDDDDDCD","",1530,1619,1545,[0,0,0,0,0],"龍造寺家臣。肥後隈府城主，親家之子。其主隆信懷疑其去留而殺害人質，因此從屬島津家。在豐臣秀吉征伐九州後，亦未取回居城。"],["隈部親永",40,31,61,41,23,65,72,"武士","佛教","CDCDCDDDD","",1516,1588,1531,[0,0,0,0,300],"菊池家臣，肥後長野城主。主家沒落後屬於了龍造寺家。投降了豐臣秀吉的九州征伐軍，但是抵抗佐佐成政的檢地，發起肥後國人起義，失敗，被殺了。"],["城親冬",52,39,43,64,50,72,64,"武士","佛教","DDCDDDDCC","",1511,1575,1526,[0,0,0,0,0],"菊池家臣。主公義武的肥後隈本城恢復戰的時候，屬於了大友家，作為恩賞成為了肥後隈本城主，支配飽田、詫摩二郡。後來出兵肥前，戰敗了。"],["城親賢",55,47,50,47,38,72,40,"武士","佛教","CDDDDDDDC","",1541,1581,1556,[0,0,0,0,0],"大友家臣，肥後隈本城主，親冬的嫡子。主家沒落後歸屬了島津家，把島津軍招到城外協助國內經營。龍造寺勢力南下的時候，跟隨了龍造寺家。"],["城親基",62,55,33,35,64,72,49,"武士","佛教","CDDDDDDDD","",1543,1592,1558,[100,0,0,0,0],"島津家臣，肥後隈本城主，親冬的次子。擊敗龍造寺軍等等，表現活躍，但是投降了豐臣秀吉的九州征伐軍，保全了領地。沒有參與肥後國人起義。"],["阿蘇惟豐",50,41,73,76,46,74,66,"僧侶","佛教","CDBDBCDBB","",1493,1559,1508,[0,0,0,0,300],"肥後的豪族，岩尾城主。一度被兄長惟長趕出居城，但是在家臣甲斐親宣的幫助下恢復了阿蘇大宮司職。後來向朝廷獻上錢財，朝廷派來了使者。"],["阿蘇惟將",61,43,51,62,77,76,57,"僧侶","佛教","DDBDDDDDC","",1526,1583,1541,[0,0,100,0,0],"肥後的豪族，岩尾城主，惟豐之子。擔任阿蘇大宮司。屬於大友家，在家臣甲斐親直的幫助下，與龍造寺家和島津家進行和平交涉，維持了領國。"],["阿蘇惟種",42,40,44,48,59,74,44,"僧侶","佛教","DDDDDCDDD","",1539,1583,1554,[0,0,0,0,0],"肥後豪族。岩尾城主，惟豐之子。因其兄惟將無子嗣，而過繼為兄長養子，並繼任家督，就阿蘇大宮司之職。但其後僅經1個月即去逝。"],["阿蘇惟光",26,14,12,28,55,76,11,"僧侶","佛教","DDDDDDDDD","",1582,1593,1597,[0,0,0,0,0],"肥後的豪族，岩尾城主，惟種之子。僅3歲就成為阿蘇大宮司。投降了豐臣秀吉，為佐佐成政效力，但是因為煽動肥後國人起義的讒言而被殺。"],["甲斐宗運",84,77,90,87,91,74,69,"武士","佛教","BCSDSBDBB","",1515,1584,1530,[400,100,400,0,400],"阿蘇家臣，肥後御船城主。聯合大友家，與龍造寺家和島津家外交交涉，努力維護主家。招致屬於島津家的相良義陽的攻擊，但是將敵人擊退。"],["甲斐親英",51,41,66,55,43,76,49,"武士","佛教","DDBDCDDCD","",1538,1587,1553,[0,0,0,0,200],"阿蘇家臣，肥後禦船城主，宗運之子。敗給島津軍，與之講和，但是與大友家的聯係被警戒，被肥後八代扣留。加盟國人起義，敗走途中被殺。"],["高森惟直",40,36,56,50,49,73,59,"武士","佛教","DDDDDDDDC","",1527,1586,1542,[0,0,0,0,0],"肥後的豪族，高森城主。拒絕了阿蘇家和島津家的勸說，屬於了大友家。因此島津軍攻擊居城，始終沒有盼來大友家的援軍，戰敗身死。"],["相良晴廣",60,54,62,74,38,49,42,"武士","佛教","CDDDCDDCA","",1513,1555,1528,[100,0,0,0,100],"肥後的戰國大名，古麓城主。上村賴興之子。成為相良義滋的義子，繼承了家業。對明進行交易。而且制定分國陸「相良氏法度」，努力加強統治。"],["相良義陽",76,74,63,66,91,49,37,"武士","佛教","BABCDBDBC","",1544,1581,1559,[100,100,100,0,0],"肥後的戰國大名，人吉城主，晴廣之子。得到祖父上村賴興的輔佐，經過2次內亂，擴大領國，但是投降了島津家，與阿蘇家作戰的時候戰死了。"],["相良賴房",55,50,69,59,46,49,62,"武士","佛教","DDCDCCDCD","",1574,1636,1589,[0,0,0,0,200],"肥後人吉藩主，義陽的次子。由於兄長忠房夭折，他繼承了家業。投降了豐臣秀吉的九州征伐軍。關原會戰中，在美濃大垣城接應東軍，保全了領地。"],["上村賴興",43,19,85,67,27,55,67,"武士","佛教","DDCDSADDB","",1490,1557,1505,[0,0,0,0,400],"相良家臣，肥後上村城主。因為有讓兒子晴廣繼嗣的約定，他協助主公義滋。作為義滋政治的背後實力者，為了實現篡位目的，而謀殺了弟弟和義兄。"],["犬童賴安",74,76,65,60,69,46,85,"僧侶","佛教","BADCCBDCC","",1521,1606,1536,[100,100,0,0,200],"相良家臣，武藝出眾，在各地活躍。肥後水俁城攻防戰中和敵將新納忠元應對連歌。主公義陽死後，與深水長智一起輔佐幼主賴房。"],["犬童賴兄",27,25,61,58,43,46,87,"武士","佛教","DDDDCDDDC","",1568,1655,1583,[0,0,0,0,0],"相良家臣，賴安之子。關原會戰中讓主公賴房接應東軍，為保全主家作出了貢獻。後來擔任國家老，但是為所欲為，專橫無度，被流放到津輕。"],["岡本賴氏",66,75,33,31,59,57,69,"武士","佛教","BDCDDDDCD","",1537,1606,1552,[100,0,100,0,0],"相良家臣。上陣以來經歷了19次會戰，立下戰功。薩摩大口會戰中殺死了島津家臣川上久朗。後來寫了相良家中故事的「岡本賴氏戰場日記」。"],["深水長智",69,24,77,85,87,49,59,"武士","佛教","CDACAADDA","",1531,1590,1546,[0,0,100,100,300],"相良家臣。使戰死的主公義陽之子忠房在島津家確立了地位，肥後國人起義的時候前去解除誤會等等，在外交方面表現活躍，努力維護主家。"],["丸目長惠",39,103,7,41,31,59,89,"劍豪","佛教","ADDDDDDDB","混戰",1540,1629,1555,[100,0,0,0,0],"相良家臣。向上泉信綱學習劍術，開創了新陰舍身流。與島津軍作戰時失敗，一度無臉見人。後來返回，擔任兵法教師，也從事開墾工作。"],["伊東義祐",70,65,31,44,38,77,73,"武士","佛教","BBDCDDCCD","",1512,1585,1527,[100,100,0,0,0],"日向的戰國大名。建立了伊東家的最大版圖，但在木崎原會戰中敗給了島津軍後開始衰退。去投靠豐後的大友宗麟，但是大友軍在耳川會戰中大敗，最後四處流浪。"],["伊東義益",52,43,69,60,55,78,23,"武士","佛教","DDDDBCCDC","",1546,1569,1561,[0,0,0,0,100],"日向的戰國大名，義祐之子。本是庶子，由於嫡子夭逝，他繼承了家業，得到父親的輔助，建立了伊東家的全盛時代。在與島津軍作戰的時候，病死了。"],["伊東祐兵",71,67,63,69,65,77,41,"武士","佛教","CBCDDCCDC","",1559,1600,1574,[100,100,0,0,0],"豐臣家臣，義祐之子。擔任豐臣秀吉的九州征伐軍的先鋒，恢復了日向飫肥的舊領地。也參加了出兵朝鮮行動。關原會戰中屬於東軍，戰後病死了。"],["伊東祐慶",44,50,45,66,52,77,47,"武士","佛教","DDCDDDDDB","",1589,1636,1604,[0,0,0,0,0],"日向飫肥藩主，祐兵之子。關原會戰的時候與父親一起屬於東軍，與高橋元種軍和島津軍作戰。父親死後，繼承了日向飫肥3萬6千石俸祿。進行檢地和開墾。"],["川崎祐長",35,32,46,74,90,72,82,"武士","佛教","DDDDDDDCB","",1533,1615,1548,[0,0,0,0,0],"伊東家臣，目井城主，人稱駿河守。跟隨其主義祐離開豐後。據說為救濟窮人，而釀酒與織布來賣。當主家取回舊領地後，成為酒谷城主。"],["木脅祐守",68,70,48,35,70,80,65,"武士","佛教","BCDDDDBDD","",1515,1580,1530,[100,100,0,0,0],"伊東家臣，鬼城城主。以奇襲破島津軍，十分活躍。此後成為執事。不跟隨主家離開豐後而藏匿於櫛間，但為島津軍發現，與其弟一同被迫自裁。"],["長倉祐政",70,66,42,24,62,79,40,"武士","佛教","DBCDDDDCD","",1538,1578,1553,[0,0,0,0,0],"伊東家臣。在與島津軍交戰中，斬敵將立功，賜姓伊東。當主家離開豐後，他留在日向，企圖集合舊臣起事失敗。於耳川之戰中陣亡。"],["山田宗昌",60,58,67,23,82,73,76,"武士","佛教","BDDCCCDBD","",1544,1620,1559,[100,0,0,0,100],"伊東家臣。主家滅亡後投靠大友家臣佐伯惟定。面對島澤家的豐後侵襲軍，守衛惟定的居城豐後母牟禮城，負責抗戰的準備，擔任會戰的總指揮。"],["肝付兼續",77,73,38,44,43,2,55,"武士","佛教","BBDBDCDCD","",1511,1566,1526,[100,100,0,100,0],"大隅的戰國大名，高山城主。建立了肝付家的最大版圖。娶了島津忠良之女，後來與忠良之子貴久敵對。聽到居城被島津軍佔領的消息後自殺了。"],["肝付良兼",64,67,58,49,46,2,36,"武士","佛教","CBDCDDDDC","",1535,1571,1550,[100,100,0,0,0],"大隅的戰國大名，高山城主，兼續之子。和伊東家聯合進攻日向飫肥城，趕跑城主島津忠親。並援助伊地知重興等，終身致力於與島津家抗爭。"],["肝付兼亮",11,8,4,20,16,97,76,"武士","佛教","DDDDDDDDD","",1558,1634,1573,[0,0,0,0,0],"大隅的戰國大名，高山城主，兼續之子。兄長良兼死後繼承家業。因為和伊東家等聯合對抗島津家，被母親（島津忠良的女兒）和家臣們流放。"],["肝付兼護",31,29,15,33,49,11,39,"武士","佛教","DDCDDCDDD","",1561,1600,1576,[0,0,0,0,0],"大隅的戰國大名，高山城主，兼續之子。由於二哥兼亮被流放繼承了家業，受到島津家的攻擊戰敗，交出了所有領地投降。在關之原之戰中戰死。"],["伊地知重興",60,54,68,36,38,17,52,"武士","佛教","CDCDCDDDC","",1528,1580,1543,[100,0,0,0,200],"大隅的豪族，小濱城主。和肝付家聯合對抗島津家，但因為居城被島津軍攻佔所以投降。之後跟隨島津家，參加了進攻大友家等戰鬥。"],["禰寑重長",42,38,60,64,23,0,44,"武士","佛教","CDDDDDCCB","",1536,1580,1551,[0,0,0,0,0],"禰寑家第16代當主。根占領主，清年嫡子，從屬肝付家。後來因單獨與島津家講和，而遭肝付軍攻擊，但在島津家的協助下擊退對方。曾進行對明貿易。"],["禰寑重張",26,30,51,69,32,9,63,"武士","佛教","DDDCDDCDB","",1566,1629,1581,[0,0,0,0,0],"禰寑家第17代當主。根占領主，重長嫡子男，人稱安藝守。歷仕島津義久、義弘、忠恆3代。在豐臣秀吉實行檢地後，轉封薩摩吉利。"],["藥丸兼將",50,47,40,53,64,9,59,"武士","佛教","DDCDDDDCD","",1517,1576,1532,[0,0,0,0,0],"肝付家臣。於伊集院忠朗舉辦的筵席上，受勸吃下鶴羹（肝付家家紋是一對鶴）。而此事成為主家與島津家抗爭的導火線。"],["島津忠良",83,59,91,96,59,30,75,"武士","佛教","CDBCSDDCS","",1493,1568,1508,[0,0,100,0,400],"伊代島津家第10代主人。把島津家的正宗家業傳給了長子貴義。創作了「伊呂波歌」來教育家臣，是奠定島津家興盛不衰基礎的鼻祖。"],["島津貴久",79,66,87,88,62,30,57,"武士","佛教","CDDBACDDB","",1514,1571,1529,[100,0,0,100,200],"島津家第15代主人，忠良的長子。在父親的輔佐下擴大了所屬領地，完成了薩摩的統一。他引入洋槍，實行積極的外交政策為島津家的進一步發展奠定了基礎。"],["島津義久",85,74,86,93,49,30,78,"武士","佛教","BDCABDCAS","特攻",1533,1611,1548,[100,0,0,400,300],"島津家第16代主人，貴久的長子。在本領高強的弟弟們的協助下擴大領土，幾乎佔領了整個九州，但敗給了豐臣秀吉的九州討伐軍，祇被允許保留薩摩一國。"],["島津義弘",105,94,82,70,74,30,84,"武士","佛教","ACDSBACBC","特攻",1535,1619,1550,[400,0,0,400,300],"島津家第17代主人，貴久之次子。消滅了伊東、大友兩家，是使島津家一步步走向興盛的第一猛將。朝鮮出兵的時候，打敗明朝大軍，人們稱他為「鬼石曼子」。"],["島津忠恆",84,70,56,83,66,30,60,"武士","佛教","BDDADCBBA","",1578,1638,1593,[100,0,0,100,0],"島津家第18代主人，義弘的三子。和父親一起跟隨朝鮮派出的軍隊作戰立下了戰功。關之原之戰後繼承了家業。建設城鎮和港灣，奠定了薩摩藩的基礎。"],["島津歲久",77,72,85,51,67,18,55,"武士","佛教","CDBBAACCD","特攻",1537,1592,1552,[100,0,100,100,200],"島津家臣，貴久的三子。成為日置島津家的創始人。同豐臣秀吉的九州討伐軍戰鬥到最後。因為許多家臣參與了梅北國兼的叛亂，最後因自責而自殺。"],["島津家久",95,97,70,24,77,30,40,"武士","佛教","AADSCBCDD","特攻",1547,1587,1562,[100,100,0,400,0],"島津家臣，貴久的四子。成為永吉島津家的創始人。沖田畷之戰打敗了10倍兵力之眾的龍造寺軍。敗給了豐臣秀吉的九州討伐軍，見過豐臣秀長之後突然死去。"],["島津豐久",68,80,42,28,90,30,30,"武士","佛教","DBDBDDCCD","",1570,1600,1585,[0,0,0,100,0],"島津家臣。家久〈貴久的四男〉之子。參加朝鮮派兵而立下戰功。關原合戰中擔任撤退的殿軍，在和本多忠勝及井伊直政等軍奮戰時不幸陣亡。"],["伊集院忠朗",72,67,85,76,43,8,64,"武士","佛教","BDDBABDDB","",1502,1566,1517,[100,0,0,100,300],"島津家臣。智勇雙全，為主家統一薩摩立下了汗馬功勞。在進攻大隅加治木城時，首次在日本把洋槍用於實戰。後任老中，參與國政。"],["伊集院忠倉",62,60,72,66,40,8,44,"武士","佛教","CDCCCDDDC","",1523,1567,1538,[100,0,100,0,0],"島津家臣，忠朗之子。和父親一起進攻大隅加治木城主肝付兼演並使其歸順，負責管理其所屬領地。後來擔任老中，為主家勢力的擴大立下汗馬功勞。"],["伊集院忠棟",45,61,78,74,9,13,52,"武士","佛教","DDDCBDCDB","",1547,1599,1562,[0,0,0,0,300],"島津家臣，忠倉之子。擔任老中。敗給了豐臣秀吉的九州討伐軍，成了人質。因為秀吉給他和主家同等待遇，所以和主公忠恆互相對立後被殺死。"],["上井黨兼",55,33,77,78,62,29,44,"武士","佛教","DDCCBDDCB","",1545,1589,1560,[0,0,100,0,300],"島津家臣。主要在日向方面發揮了巨大作用。擔任老中輔佐主公義久經營領地。在文學上造詣頗深，著有「伊勢守心得書」和「上井覺兼日記」。"],["穎娃久虎",71,75,69,16,70,30,29,"武士","佛教","BCDBCCCDD","",1558,1587,1573,[100,0,0,100,0],"島津家臣。參加了耳川之戰，敗擊肥後水俁城、沖田畷之戰等都立下了戰功。傳說主公義弘曾說過「豐肥戰的勝利都是久虎的功勞」。"],["樺山久高",59,46,51,47,49,29,76,"武士","佛教","DDCCDDADC","",1558,1634,1573,[0,0,0,0,0],"島津家臣，擔任家老。參加了豐臣秀吉向朝鮮派出的軍隊，打敗了李舜臣率領的龜甲船水軍。在遠征琉球時擔任元帥，攻佔了首里俘虜了王子。"],["猿渡信光",56,64,34,22,52,29,53,"武士","佛教","DCDDDDDDD","",1534,1587,1549,[0,100,0,0,0],"島津家臣。參加了沖田畷之戰，打敗了龍造寺軍，主要在肥前、肥後方面不斷立功。後來同豐臣秀吉的九州討伐軍在根白阪交戰，戰敗，戰死。"],["種子島惠時",57,34,71,61,46,18,64,"武士","佛教","DDDSCCCDC","",1503,1567,1518,[0,0,0,100,200],"島津家臣，種子島的領主。在進攻薩摩市來城中表現突出。同大隅的豪族禰寢家爭鬥，一段時間逃到了屋久島。從漂流到種子島的葡萄牙船上得到了洋槍。"],["種子島時堯",60,56,61,70,55,18,51,"武士","佛教","DDDSDDCDC","",1528,1579,1543,[0,0,0,100,0],"島津家臣，種子島的領主。惠時的長子。同大隅的豪族禰寢家抗爭。從漂流到種子島的葡萄牙船上得到洋槍，進行分析，改造成了國產品。"],["長壽院盛淳",61,24,75,72,64,30,53,"僧侶","佛教","DDDBBDDDB","",1547,1600,1562,[0,0,100,0,300],"島津家臣。在高野山與根來寺進行修業，成為鹿兒島安養院的住持。後來成為家老參與國政。在關原會戰時擔任其主義弘的影武者而戰死。"],["新納忠元",85,81,51,26,85,30,84,"武士","佛教","BACBDABBD","",1526,1610,1541,[100,100,100,0,0],"島津家臣。在進攻薩摩馬越城、肥後經略等各地交戰中立下了赫赫戰功，是留名於島津家看經所上的4個人中的一人。著有「二才咄格式定目」來告誡弟子。"],["北鄉時久",48,51,54,61,49,27,66,"武士","佛教","DDCDDDDDD","",1530,1596,1545,[0,0,0,0,0],"日向的豪族，莊內領主。屬於島津家，與伊東家和肝付家的大軍作戰。投降了豐臣秀吉的九州征伐軍，保全了領地。後來被轉封到薩摩宮之城。"],["山田有信",64,71,76,29,79,28,65,"武士","佛教","CDBCBDBCD","",1544,1609,1559,[100,0,0,0,200],"島津家臣。在各地的交戰中表現突出。伊東家滅亡後，成了日向高城主。在耳川之戰的時候，以少數兵力對抗大友家的大軍，堅守居城，為主家的勝利做出了貢獻。"],["山田有榮",67,59,68,69,69,28,90,"武士","佛教","BDDBCDCDB","",1578,1668,1593,[100,0,0,100,0],"島津家臣，有信的長子。在鎮壓伊集院忠真的謀反和關之原之戰中戰功卓著。但任山水莊頭，也為家臣教育和產業開發等盡心盡力，是個智勇雙全的大將。"],["島津義虎",60,69,47,58,65,82,49,"武士","佛教","DCDDDCCCD","",1536,1585,1551,[0,100,0,0,0],"島津家臣，薩摩出水領主，實久的長子。進攻相良家的時候擔任先鋒，打敗了相良義陽。後來也參加了沖田畷之戰，在肥後、肥前方面有出色表現。"],["川上忠克",53,40,48,60,25,56,85,"武士","佛教","DDCDDDDDC","",1501,1586,1516,[0,0,100,0,0],"島津家臣，串木野城主。最初從屬薩州島津家，但後來降於島津忠良，被流放至甑島3年。日後擔任家老，致力於白山權現的復興。"],["川上久朗",75,77,69,64,55,56,32,"武士","佛教","CBDBCDBBD","",1536,1568,1551,[100,100,0,100,100],"島津家臣，忠克之子。名字留在島津家看經所的4人中的1人。據說18歲時主公義久推薦他擔任守護。在進攻薩摩大口城時戰死。"],["平田光宗",46,44,53,56,49,58,76,"武士","佛教","DDCDDDDDC","",1529,1605,1544,[0,0,0,0,0],"島津家臣，宗秀的次子。在攻打日向石城、肥後堅志田、沖田畷之戰中立下了戰功。後來防守肥後八代城。擔任老中，輔佐主公貴久。"],["北條早雲",96,69,110,120,67,82,87,"武士","佛教","AABDSBCBS","火牛計",1432,1519,1447,[100,400,0,0,600],"今川家臣。因平定了小鹿範滿之亂，取得發言力。消滅了掘越公方與扇谷上杉家臣之三浦家，將伊豆、相模收為其領國。是被稱為「戰亂之梟雄」的有名人物。"],["太田道灌",99,88,99,90,68,25,54,"武士","佛教","SCSDADDSA","",1432,1486,1447,[400,100,400,0,300],"室町後期的武將。是扇谷上杉家臣。雖然活躍於鎮壓山內上杉家臣長尾景春之亂，但卻被因害怕其實力的上杉顯定之計謀陷害，而被其主定正所殺。"],["尼子經久",87,66,109,84,2,1,83,"武士","佛教","CBCDSSBBA","",1458,1541,1473,[0,400,100,0,600],"出雲的戰國大名。侍奉京極家，但因奪取領地之罪而被免去出雲守護代一職。後來奪回居城月山富田城並擴張勢力，成為中國11國的太守。"],["今川氏親",89,79,95,97,75,41,55,"高家","佛教","BCBDABDAS","",1471,1526,1486,[400,100,100,0,200],"今川家第7代當主。討伐了同族的小鹿範滿而成為當主。因伯父北條早雲的輔佐而擴大版圖。制訂了「今川假名目錄」等，為今川家的發展貢獻良多。"],["長尾為景",99,104,37,51,30,16,65,"武士","佛教","BSDDDBDCD","",1471,1536,1486,[100,400,0,0,0],"越後守護代。打倒了越後守護與關東管領而掌握國政。但後來與越後守護上杉定實對立，招來了上杉方國人的叛亂。是個出陣超過百次的猛將。"],["淺井亮政",93,91,80,82,67,53,51,"武士","佛教","CADDAADDB","",1491,1542,1506,[100,400,0,0,300],"近江的戰國大名。小谷城主。起初侍奉京極家，但趁著主家的內亂而擴張勢力範圍。受到朝倉家的援助，擊退了六角定賴之軍，稱霸江北。"],["織田信秀",93,95,53,61,44,0,41,"武士","佛教","ABCDDDDCC","",1510,1551,1525,[100,400,100,0,0],"尾張的戰國大名。是被稱為「尾張之虎」的猛將。為了統一尾張而持續與周圍的今川家、齋藤家持續抗爭，但途中染上傳染病而暴斃。"],["大友義鑑",78,70,69,88,49,79,48,"武士","佛教","CDBDCSCDB","",1502,1550,1517,[100,0,0,100,400],"大友家第20代當主。與大內家等周邊諸國對抗，擴大了勢力範圍。由於計畫廢掉長子義鎮的嫡子之位而爆發二階崩之變。被家臣砍殺而受重傷，因此身亡。"],["龍造寺家兼",78,60,90,91,70,62,92,"武士","佛教","BCDDACDBA","",1454,1546,1469,[400,0,0,0,300],"少貳家臣。在田手畷會戰擊破大內軍，但因馬場賴周的計策而使許多族人被殺，逃往筑後。後來回到肥前打倒了賴周，成功的實現再興。"],["本願寺蓮如",65,32,95,110,75,50,84,"僧侶","一向宗","BDBDCDDAS","",1415,1499,1430,[100,0,0,0,0],"本願寺8世法主。主要在近江、北陸一帶進行傳教。因其魅力和與門徒平起平坐這種庶民般的教義，為衰微的本願寺派之發展盡了一己之力。"],["最上義忠",51,39,61,63,39,97,76,"武士","佛教","CDDCCCDBB","",1588,1664,1603,[0,0,0,0,0],"最上家臣。最上義光的四男。被推舉為取代其姪‧義俊的當家候補人選。但卻招致繼承動亂，主家被貶。之後仕奉水戶德川家，擔任家老。"],["森忠政",65,32,52,65,53,1,64,"武士","佛教","BCCBCBCAB","",1570,1634,1585,[100,0,0,0,0],"豐臣家臣。可成的六子。由於兄長長可的陣亡而繼承家業。關原會戰中追隨德川秀忠，參加進攻上田城。之後被封轉美作津山18萬石俸祿。"],["木村定光",42,22,57,72,20,9,36,"武士","佛教","CCDDDDCCB","",1559,1595,1574,[0,0,0,0,0],"豐臣家臣，通稱常陸介。曾參加賤岳會戰等戰役，領受越前府中10萬石俸祿。擔任出羽國的檢地奉行。後來被豐臣秀次事件牽連，被迫自盡。"],["以心崇傳",15,1,91,88,22,90,64,"僧侶","佛教","DDDDADDCS","",1569,1633,1584,[0,0,0,0,400],"德川家臣，負責制定武家諸法度等法令。引發方廣寺鐘銘事件，為大阪之陣找藉口等等，在謀略方面也表現活躍。綽號「黑衣宰相」。"],["林羅山",16,8,86,85,27,90,74,"武士","佛教","DDDDADDCS","",1583,1657,1598,[0,0,0,0,400],"德川家臣，林家朱子學之祖。與以心崇傳一同在方廣鐘銘事件中誹謗豐臣秀賴，製造大阪之陣的藉口。後來參與幕政，起草各種公文書。"],["秋月元種",49,36,48,57,17,34,43,"武士","佛教","DDCDCDBAB","",1571,1614,1586,[0,0,0,0,0],"筑前的豪族，秋月種實的次子。投降豐臣秀吉，領受日向延岡5萬石俸祿。關原會戰中叛變到東軍，保全了領地。後來因為窩藏謀反嫌疑人之罪被免職。"],["井田親之",56,62,38,26,23,34,55,"武士","佛教","CBCCDCBCC","",1532,1587,1547,[0,100,0,0,0],"秋月家臣，通稱左馬助。其子親氏被大友軍殺害後，於佛壇之柱上刻下一首和歌，以慰其子之靈。隨後在某戰役中擔任先鋒而戰死。"],["服部康成",62,34,72,67,40,13,69,"忍者","佛教","CBACABCDA","",1566,1635,1581,[0,0,100,0,200],"津輕家臣。伊賀國出身。於關原會戰時受聘，在大垣城攻擊戰中表現傑出。之後便成為頭號家老掌握藩政，被評為「無比的良臣」。"],["浪岡慶好",9,11,29,57,25,35,53,"高家","佛教","DDDDCDCCB","",1575,1628,1590,[0,0,0,0,0],"安東家臣。顯村之子。與被津輕為信
